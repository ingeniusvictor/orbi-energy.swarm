name: ES-13J8L Pre-PR Certification

on:
  push:
    branches: [es-13j8l-pure-score-attack-runtime-activation-envelope]
    paths:
      - .github/workflows/es-13j8l-pre-pr-cert.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard exact J8L scope and frozen seams
        run: |
          test "$(git merge-base 9d110a10e07da45f51c932d575f0ae3edb9606d4 HEAD)" = "9d110a10e07da45f51c932d575f0ae3edb9606d4"
          printf '%s\n' \
            .github/workflows/es-13j8l-pre-pr-cert.yml \
            src/game/scoreAttackRuntimeActivationEnvelope.ts \
            tests/es-13j8l-score-attack-runtime-activation-envelope.test.mjs \
            tests/gameplay/score-attack-runtime-activation-envelope.test.ts > /tmp/expected
          git diff --name-only 9d110a10e07da45f51c932d575f0ae3edb9606d4...HEAD | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --quiet 9d110a10e07da45f51c932d575f0ae3edb9606d4...HEAD -- src/game/scoreAttackBootstrapEnvelope.ts
          git diff --quiet 9d110a10e07da45f51c932d575f0ae3edb9606d4...HEAD -- src/game/scoreAttackRuntimeDescriptorCompletionOverlay.ts
          git diff --quiet 9d110a10e07da45f51c932d575f0ae3edb9606d4...HEAD -- src/game/scoreAttackTerminalCompletionDisposition.ts
          git diff --quiet 9d110a10e07da45f51c932d575f0ae3edb9606d4...HEAD -- src/game/scoreAttackRuntimeProjectionBundle.ts
          git diff --quiet 9d110a10e07da45f51c932d575f0ae3edb9606d4...HEAD -- src/game/runtimeProjectionBundleCache.ts
          git diff --quiet 9d110a10e07da45f51c932d575f0ae3edb9606d4...HEAD -- src/game/EnergySwarmGame.tsx
          grep -Fq 'resolveScoreAttackBootstrapEnvelope(modeId)' src/game/scoreAttackRuntimeActivationEnvelope.ts
          grep -Fq 'resolveScoreAttackRuntimeProjectionBundle(bootstrapEnvelope)' src/game/scoreAttackRuntimeActivationEnvelope.ts
          grep -Fq 'const runtimeProgression = bootstrapEnvelope.runtimeProgression' src/game/scoreAttackRuntimeActivationEnvelope.ts
          grep -Fq 'const runtimeSession = runtimeProgression.session' src/game/scoreAttackRuntimeActivationEnvelope.ts
          grep -Fq 'const effectiveDescriptor = runtimeProjectionBundle.descriptor' src/game/scoreAttackRuntimeActivationEnvelope.ts
          ! grep -Eq 'createInfiniteSession|createInfiniteRuntimeState|Date\.now|performance\.now|Math\.random|localStorage|sessionStorage' src/game/scoreAttackRuntimeActivationEnvelope.ts
          ! grep -q 'scoreAttackRuntimeActivationEnvelope' src/game/EnergySwarmGame.tsx
          ! grep -q 'scoreAttackRuntimeActivationEnvelope' src/game/scoreAttackTerminalCompletionDisposition.ts

      - name: Repository smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8l-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8l-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
