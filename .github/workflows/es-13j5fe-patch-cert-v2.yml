name: ES-13J5F-E Patch and Pre-PR Certification v2.1

on:
  push:
    branches:
      - es-13j5fe-controlled-live-command-link-pulse
    paths:
      - .github/workflows/es-13j5fe-patch-cert-v2.yml

permissions:
  contents: write

jobs:
  patch-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_SHA: 022741e5c500dea2947241d4bb8c6cb8d004772c
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: es-13j5fe-controlled-live-command-link-pulse

      - name: Apply exact J5F-E runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/game/EnergySwarmGame.tsx')
          s = p.read_text()

          def sub_once(pattern: str, replacement, label: str, flags=0):
              global s
              s2, count = re.subn(pattern, replacement, s, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly 1 match, got {count}')
              s = s2

          sub_once(
              r'(import \{\n\s*resolveLiveCommandLinkBreakIntent,\n\s*shouldDetachCommandLinkMember,\n\s*type LiveCommandLinkBreakIntent,\n\} from "\.\/liveCommandLinkBreakApplication";\n)',
              r'\1import {\n  projectLiveCommandLinkPulseTarget,\n  resolveLiveCommandLinkPulseIntent,\n  type LiveCommandLinkPulseIntent,\n} from "./liveCommandLinkPulseApplication";\n',
              'J5F-E import seam',
          )

          sub_once(
              r'(  const pendingCommandLinkBreakRef =\n\s*useRef<LiveCommandLinkBreakIntent \| null>\(null\);\n)',
              r'\1  const pendingCommandLinkPulseRef =\n    useRef<LiveCommandLinkPulseIntent | null>(null);\n',
              'J5F-E scalar ref seam',
          )

          reset_pattern = re.compile(
              r'(?P<director>(?P<indent>[ \t]*)enemyFormationDirectorRef\.current =\s*\n[ \t]*createLiveEnemyFormationDirectorState\(\);\s*\n)(?P<breakindent>[ \t]*)pendingCommandLinkBreakRef\.current = null;'
          )
          def reset_repl(match):
              indent = match.group('breakindent')
              return (
                  match.group('director')
                  + indent + 'pendingCommandLinkBreakRef.current = null;\n'
                  + indent + 'pendingCommandLinkPulseRef.current = null;'
              )
          s, reset_count = reset_pattern.subn(reset_repl, s)
          if reset_count != 3:
              raise RuntimeError(f'J5F-E lifecycle resets: expected 3, got {reset_count}')

          sub_once(
              r'(?m)^(\s*)const pendingCommandLinkBreak = pendingCommandLinkBreakRef\.current;\n\s*let detachedPendingCommandLink = false;',
              lambda m: (
                  f'{m.group(1)}const pendingCommandLinkBreak = pendingCommandLinkBreakRef.current;\n'
                  f'{m.group(1)}const pendingCommandLinkPulse = pendingCommandLinkPulseRef.current;\n'
                  f'{m.group(1)}let detachedPendingCommandLink = false;'
              ),
              'J5F-E pending loop capture',
          )

          sub_once(
              r'(enemiesRef\.current\.forEach\(\(enemy\) => \{\n\s*if \(enemy\.isDead\) return;\n)(\s*if \(\n\s*shouldDetachCommandLinkMember\()',
              lambda m: (
                  m.group(1)
                  + '\n      const commandLinkPulseProjection = projectLiveCommandLinkPulseTarget(\n'
                  + '        pendingCommandLinkPulse,\n'
                  + '        enemy.enemyFormation,\n'
                  + '        enemy.health,\n'
                  + '        enemy.maxHealth,\n'
                  + '        !enemy.isDead,\n'
                  + '      );\n'
                  + '      if (commandLinkPulseProjection) {\n'
                  + '        enemy.health = commandLinkPulseProjection.resultingHealth;\n'
                  + '      }\n\n'
                  + m.group(2)
              ),
              'J5F-E pulse-before-detach seam',
          )

          sub_once(
              r'(?m)^(\s*)if \(\n\s*detachedPendingCommandLink &&',
              lambda m: (
                  f'{m.group(1)}if (\n'
                  f'{m.group(1)}  pendingCommandLinkPulse &&\n'
                  f'{m.group(1)}  pendingCommandLinkPulseRef.current === pendingCommandLinkPulse\n'
                  f'{m.group(1)}) {{\n'
                  f'{m.group(1)}  pendingCommandLinkPulseRef.current = null;\n'
                  f'{m.group(1)}}}\n\n'
                  f'{m.group(1)}if (\n'
                  f'{m.group(1)}  detachedPendingCommandLink &&'
              ),
              'J5F-E single-consume seam',
          )

          sub_once(
              r'(\s*// Apply direct damage\n)(\s*)enemy\.health -= damageToApply;',
              lambda m: (
                  m.group(1)
                  + m.group(2) + 'const commandLinkPulseSourceHealthBeforeDirectHit = enemy.health;\n'
                  + m.group(2) + 'enemy.health -= damageToApply;'
              ),
              'J5F-E direct pre-hit source',
          )

          sub_once(
              r'(splashCandidates\.forEach\(\(\{ item: otherEnemy \}\) => \{\n)(\s*)otherEnemy\.health -= splashDamage;',
              lambda m: (
                  m.group(1)
                  + m.group(2) + 'const commandLinkPulseSourceHealthBeforeSplashHit = otherEnemy.health;\n'
                  + m.group(2) + 'otherEnemy.health -= splashDamage;'
              ),
              'J5F-E splash pre-hit source',
          )

          sub_once(
              r'(?m)^(\s*)registerCombatDefeat\(otherEnemy, proj\.affinity\);$',
              lambda m: (
                  m.group(0)
                  + '\n' + m.group(1) + 'const commandLinkPulseIntent = otherEnemy.enemyFormation\n'
                  + m.group(1) + '  ? resolveLiveCommandLinkPulseIntent(\n'
                  + m.group(1) + '      otherEnemy.enemyFormation,\n'
                  + m.group(1) + '      "SPLASH_HIT",\n'
                  + m.group(1) + '      splashDamage,\n'
                  + m.group(1) + '      commandLinkPulseSourceHealthBeforeSplashHit,\n'
                  + m.group(1) + '    )\n'
                  + m.group(1) + '  : null;\n'
                  + m.group(1) + 'if (commandLinkPulseIntent) {\n'
                  + m.group(1) + '  pendingCommandLinkPulseRef.current = commandLinkPulseIntent;\n'
                  + m.group(1) + '}'
              ),
              'J5F-E splash lethal source projection',
          )

          sub_once(
              r'(?m)^(\s*)registerCombatDefeat\(enemy, proj\.affinity\);$',
              lambda m: (
                  m.group(0)
                  + '\n' + m.group(1) + 'const commandLinkPulseIntent = enemy.enemyFormation\n'
                  + m.group(1) + '  ? resolveLiveCommandLinkPulseIntent(\n'
                  + m.group(1) + '      enemy.enemyFormation,\n'
                  + m.group(1) + '      "DIRECT_HIT",\n'
                  + m.group(1) + '      damageToApply,\n'
                  + m.group(1) + '      commandLinkPulseSourceHealthBeforeDirectHit,\n'
                  + m.group(1) + '    )\n'
                  + m.group(1) + '  : null;\n'
                  + m.group(1) + 'if (commandLinkPulseIntent) {\n'
                  + m.group(1) + '  pendingCommandLinkPulseRef.current = commandLinkPulseIntent;\n'
                  + m.group(1) + '}'
              ),
              'J5F-E direct lethal source projection',
          )

          p.write_text(s)
          PY

      - name: Commit exact J5F-E candidate locally
        shell: bash
        run: |
          git config user.name ingeniusvictor
          git config user.email ingenius.victor@gmail.com
          git add src/game/EnergySwarmGame.tsx
          git diff --cached --quiet && { echo 'No runtime patch produced'; exit 1; }
          git commit -m 'ES-13J5F-E: integrate controlled live non-lethal command-link pulse'
          echo "J5FE_CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release Contract
        run: npm run release:verify

      - name: Manual dossier
        run: npm run release:evidence:verify

      - name: Production Build
        run: npm run build

      - name: RC readiness fail-closed
        run: npm run release:readiness

      - name: J5F-E exact scope guard
        shell: bash
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD | sort)"
          expected="$(printf '%s\n' .github/workflows/es-13j5fe-patch-cert-v2.yml .github/workflows/es-13j5fe-patch-cert.yml src/game/EnergySwarmGame.tsx src/game/liveCommandLinkPulseApplication.ts tests/es-13j5fe-live-command-link-pulse-application.test.mjs tests/gameplay/live-command-link-pulse-application.test.ts | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected J5F-E scope:'; echo "$changed"; exit 1; }

      - name: Frozen registerCombatDefeat signature guard
        shell: bash
        run: |
          grep -F 'const registerCombatDefeat = (enemy: Enemy, affinity?: OrbiAffinity) => {' src/game/EnergySwarmGame.tsx
          test "$(grep -Fc 'registerCombatDefeat(enemy, proj.affinity);' src/game/EnergySwarmGame.tsx)" -eq 1
          test "$(grep -Fc 'registerCombatDefeat(otherEnemy, proj.affinity);' src/game/EnergySwarmGame.tsx)" -eq 1

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbi-energy-swarm-j5fe-debug-${{ env.J5FE_CANDIDATE_SHA }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Push certified J5F-E candidate
        shell: bash
        run: |
          git push origin HEAD:es-13j5fe-controlled-live-command-link-pulse
