name: ES-12H1 Guarded Implementation

on:
  push:
    branches:
      - feat/es-12h1-gameplay-pressure-readability

permissions:
  contents: write

concurrency:
  group: es12h1-guarded-implementation
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/es-12h1-gameplay-pressure-readability
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded gameplay/readability patch
        run: node scripts/es12h1-apply.mjs

      - name: Repository smoke tests
        run: npm run test:repo

      - name: Gameplay tests
        run: npm run test:gameplay

      - name: Platform tests
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit validated implementation
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/es12h1-implement.yml scripts/es12h1-apply.mjs
          git add src tests
          git commit -m "feat(gameplay): apply ES-12H1 pressure and cockpit polish"
          git push origin HEAD:feat/es-12h1-gameplay-pressure-readability
