name: ES-13DOC53 pre-PR certification

on:
  push:
    branches:
      - docs/es-13-j8o-closure-j8p-public-score-attack-ui
    paths:
      - .github/workflows/es-13doc53-pre-pr-cert.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact docs-only scope and cleanup guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=89d1dea159f8478c2e2ccc01f027c2e9041a4542
          git diff --check "$BASE"...HEAD
          changed="$(git diff --name-only "$BASE"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/es-13doc53-pre-pr-cert.yml' \
            'docs/ES13_GAMEPLAY_ROADMAP.md' \
            'docs/IMPLEMENTATION_LEDGER.md' \
            'docs/PROJECT_CONTINUITY.md' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'DOC53 scope mismatch'
            printf 'Changed:\n%s\nExpected:\n%s\n' "$changed" "$expected"
            exit 1
          fi
          test ! -e .github/workflows/es-13doc53-apply.yml
          test ! -e .github/workflows/es-13doc53-repair.yml
          grep -F 'Canonical: `89d1dea159f8478c2e2ccc01f027c2e9041a4542`' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -F 'ES-13J8P — Controlled Public Score Attack Selection & Presentation Adoption' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -F '| ES-13J8O — Controlled Live Score Attack Engine Lifecycle Adoption | DEPLOYED / FROZEN | `89d1dea159f8478c2e2ccc01f027c2e9041a4542` | #469 | #470 |' docs/IMPLEMENTATION_LEDGER.md
          grep -F 'Phase: **ES-13J8O — Controlled Live Score Attack Engine Lifecycle Adoption**' docs/PROJECT_CONTINUITY.md
          grep -F 'Status: **NEXT CONTRACT TARGET AFTER DOC53 CLOSURE**' docs/PROJECT_CONTINUITY.md

      - name: Repository smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Upload RC readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13doc53-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30
