name: ES-13J5F-E Final Exact Candidate Certification v1.1

on:
  push:
    branches:
      - es-13j5fe-controlled-live-command-link-pulse
    paths:
      - .github/workflows/es-13j5fe-final-cert.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BASE_SHA: 022741e5c500dea2947241d4bb8c6cb8d004772c
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: es-13j5fe-controlled-live-command-link-pulse

      - name: Apply already-proven runtime patch exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/es-13j5fe-patch-cert-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(workflow[start + 1:end]))
          exec(compile(script, 'es-13j5fe-patch-cert-v2.py', 'exec'), {})
          PY

      - name: Commit exact candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ingeniusvictor
          git config user.email ingenius.victor@gmail.com
          git add src/game/EnergySwarmGame.tsx
          git diff --cached --check
          git diff --cached --quiet && { echo 'No candidate changes produced'; exit 1; }
          git commit -m 'ES-13J5F-E: integrate controlled live non-lethal command-link pulse'
          candidate="$(git rev-parse HEAD)"
          echo "J5FE_CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "ORBI_BUILD_SHA=$candidate" >> "$GITHUB_ENV"
          echo "ORBI_RELEASE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "Candidate SHA: $candidate"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release Contract
        run: npm run release:verify

      - name: Manual dossier
        run: npm run release:evidence:verify

      - name: Production Build
        run: npm run build

      - name: RC readiness fail-closed
        run: npm run release:readiness -- --output release-readiness.json

      - name: Exact J5F-E scope and frozen-authority guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" HEAD
          mapfile -t actual < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          expected=(
            ".github/workflows/es-13j5fe-final-cert.yml"
            ".github/workflows/es-13j5fe-patch-cert-v2.yml"
            ".github/workflows/es-13j5fe-patch-cert-v3.yml"
            ".github/workflows/es-13j5fe-patch-cert.yml"
            "src/game/EnergySwarmGame.tsx"
            "src/game/liveCommandLinkPulseApplication.ts"
            "tests/es-13j5fe-live-command-link-pulse-application.test.mjs"
            "tests/gameplay/live-command-link-pulse-application.test.ts"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          test "${#actual[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${actual[$i]}" = "${expected_sorted[$i]}"
          done
          git diff --quiet "$BASE_SHA" HEAD -- \
            src/game/types.ts \
            src/game/liveEnemyFormationDirector.ts \
            src/game/priorityTargetContract.ts \
            src/game/commandLinkBinding.ts \
            src/game/liveCommandCorePresentation.ts \
            src/game/commandLinkBreakResolution.ts \
            src/game/liveCommandLinkBreakApplication.ts \
            src/game/commandLinkCombatEffectContract.ts \
            src/game/commandLinkPulseTargetEligibility.ts \
            src/game/commandLinkPulseDamageSafety.ts \
            src/game/commandLinkPulseTriggerDamageSource.ts \
            src/game/constants.ts \
            android public docs package.json package-lock.json
          grep -F 'const registerCombatDefeat = (enemy: Enemy, affinity?: OrbiAffinity) => {' src/game/EnergySwarmGame.tsx
          test "$(grep -Fc 'registerCombatDefeat(enemy, proj.affinity);' src/game/EnergySwarmGame.tsx)" -eq 1
          test "$(grep -Fc 'registerCombatDefeat(otherEnemy, proj.affinity);' src/game/EnergySwarmGame.tsx)" -eq 1

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbi-energy-swarm-j5fe-debug-${{ env.J5FE_CANDIDATE_SHA }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Push certified exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:es-13j5fe-controlled-live-command-link-pulse
