name: ES-12G1 One-Shot Implementation

on:
  push:
    branches:
      - feat/es-12g1-gaia-f3-telemetry
    paths:
      - .github/workflows/es12g1-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/es-12g1-gaia-f3-telemetry
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply ES-12G1 telemetry patch
        run: node scripts/es12g1-apply-v2.mjs

      - name: Repository smoke tests
        run: npm run test:repo

      - name: Platform tests
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit implementation and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/es12g1-implement.yml scripts/es12g1-apply.mjs scripts/es12g1-apply-v2.mjs
          git add src tests
          git commit -m "feat(gaia): expose O(1) F3 certification telemetry ES-12G1"
          git push origin HEAD:feat/es-12g1-gaia-f3-telemetry
