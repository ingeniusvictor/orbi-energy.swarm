name: ES-13J8P full pre-PR certification

on:
  push:
    branches:
      - es-13j8p-controlled-public-score-attack-selection-presentation
    paths:
      - .github/workflows/es-13j8p-certify.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout J8P branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact scope and temporary-helper cleanup guard
        shell: bash
        run: |
          BASE=120fe00a61ad7a84984871ec19ec435be23535a0
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            .github/workflows/es-13j8p-certify.yml
            src/components/GameHud.tsx
            src/components/ResultScreen.tsx
            src/components/StartScreen.tsx
            src/game/EnergySwarmGame.tsx
            tests/es-13j8a-score-attack-mode-contract.test.mjs
            tests/es-13j8c-score-attack-timebox-projection.test.mjs
            tests/es-13j8o-score-attack-live-engine-lifecycle.test.mjs
            tests/es-13j8p-public-score-attack-presentation.test.mjs
            tests/gameplay/score-attack-public-presentation.test.ts
          )
          if [ "${#changed[@]}" -ne "${#expected[@]}" ]; then
            echo "Unexpected J8P certification scope count: ${#changed[@]}" >&2
            exit 1
          fi
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null || {
              echo "Missing expected certification path: $path" >&2
              exit 1
            }
          done
          test ! -e .github/workflows/es-13j8p-apply.yml
          test ! -e .github/workflows/es-13j8p-apply-v2.yml
          test ! -e scripts/es-13j8p-apply.py
          if git diff --name-only "$BASE"...HEAD -- 'src/game/scoreAttack*.ts' | grep -q .; then
            echo "Frozen J8A-J8O scoreAttack source changed unexpectedly" >&2
            exit 1
          fi
          git diff --check "$BASE"...HEAD

      - name: Focused J8P public presentation tests
        run: |
          node --test tests/es-13j8p-public-score-attack-presentation.test.mjs
          npx tsx --test tests/gameplay/score-attack-public-presentation.test.ts

      - name: Repository smoke regression
        shell: bash
        run: |
          set -o pipefail
          npm run test:repo 2>&1 | tee repo-smoke.log

      - name: Upload repository smoke diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8p-repo-smoke-${{ github.sha }}
          path: repo-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Upload RC readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8p-rc-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30

  android-debug:
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout J8P branch
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8p-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
