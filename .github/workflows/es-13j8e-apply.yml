name: ES-13J8E Apply

on:
  push:
    branches: [es-13j8e-score-attack-record-storage]
    paths:
      - scripts/es13j8e_apply.py
      - .github/workflows/es-13j8e-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard exact canonical ancestry
        run: |
          git merge-base --is-ancestor 7da459c56ab27d7891cf859db9c1065347cd2736 HEAD
          test "$(git rev-parse 7da459c56ab27d7891cf859db9c1065347cd2736)" = "7da459c56ab27d7891cf859db9c1065347cd2736"

      - name: Apply J8E fail-closed patch
        run: python3 scripts/es13j8e_apply.py

      - name: Guard exact product scope and frozen seams
        run: |
          printf '%s\n' \
            src/game/storage.ts \
            src/game/types.ts \
            tests/gameplay/storage.test.ts > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --exit-code 7da459c56ab27d7891cf859db9c1065347cd2736 -- src/game/scoreAttackRecordProjection.ts src/game/runPersistence.ts
          grep -Fq 'const LOCAL_STORAGE_KEY = "orbi_energy_swarm_stats_v2";' src/game/storage.ts
          ! grep -Fq 'orbi_energy_swarm_stats_v3' src/game/storage.ts

      - name: Targeted storage regression
        run: npx tsx --test tests/gameplay/storage.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit J8E product scope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/types.ts src/game/storage.ts tests/gameplay/storage.test.ts
          git diff --cached --name-only | sort > /tmp/staged-files
          printf '%s\n' \
            src/game/storage.ts \
            src/game/types.ts \
            tests/gameplay/storage.test.ts > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/staged-files
          git commit -m "feat(j8e): adopt dedicated score attack record storage"
          git push origin HEAD:es-13j8e-score-attack-record-storage
