name: ES-12F9 Run Integration

on:
  push:
    branches:
      - feat/es-12f9-gaia-fusion-evolution

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[es12f9-script-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/es-12f9-gaia-fusion-evolution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply runtime integration
        run: python scripts/es12f9-integrate.py
      - name: Certify implementation
        run: |
          npm test
          npm run typecheck
          npm run release:verify
          npm run build
      - name: Commit runtime integration
        run: |
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add src/game/EnergySwarmGame.tsx src/game/EnergySwarmCanvas.tsx
          git commit -m "feat(gaia): integrate fusion evolution runtime ES-12F9 [es12f9-script-applied]"
          git push origin HEAD:feat/es-12f9-gaia-fusion-evolution
