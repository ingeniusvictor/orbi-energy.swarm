name: ES-13J4B Pre-PR Certification

on:
  push:
    branches:
      - feat/es-13j4b-live-warp-ambusher-adoption

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
      ORBI_RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay
        run: npm run test:gameplay

      - name: Platform
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release Contract
        run: npm run release:verify

      - name: Manual dossier
        run: npm run release:evidence:verify

      - name: Production Build
        run: npm run build

      - name: RC readiness fail-closed
        run: npm run release:readiness -- --output release-readiness.json

      - name: Android debug APK
        run: npm run android:debug

      - name: APK verification
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: J4B scope and adoption guard
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/es-13j4b-pre-pr-certification.yml' \
            'src/game/EnergySwarmGame.tsx' \
            'src/game/runtimeTacticalEnemyAdoption.ts' \
            'tests/es-13j4b-live-tactical-adoption.test.mjs' \
            'tests/gameplay/runtime-tactical-enemy-adoption.test.ts' | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git diff --quiet origin/main...HEAD -- \
            src/game/types.ts \
            src/game/constants.ts \
            src/game/infiniteSectorDirector.ts \
            src/game/infiniteWaveDirector.ts \
            src/game/runtimeWaveDescriptor.ts \
            src/game/runtimeEnemyEvolution.ts \
            src/game/liveEnemyFormationDirector.ts \
            src/game/formations.ts \
            src/game/formationCycle.ts \
            android public package.json package-lock.json docs
