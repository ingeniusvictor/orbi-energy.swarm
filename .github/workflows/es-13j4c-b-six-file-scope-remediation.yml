name: ES-13J4C-B Six-File Scope Remediation

on:
  push:
    branches:
      - fix/es-13j4c-b-six-file-scope-remediation

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'ci(j4c-b): bootstrap six-file scope remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore six-file J4C-B contract fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game/EnergySwarmGame.tsx')
          source = path.read_text()
          old = '''      const enemyAttackRateStep =
                (delta / 16.6) *
                simulationCombatPressure.enemyAttackRateMultiplier *
                (enemy.evolvedAttackRateMultiplier ?? 1);

              if (
                enemy.type !== EnemyType.SIEGE_PRISM ||
                enemy.siegeVolleyTelegraph === undefined
              ) {
                enemy.shootCooldown -= enemyAttackRateStep;
              }
          '''
          new = '''      if (
                enemy.type !== EnemyType.SIEGE_PRISM ||
                enemy.siegeVolleyTelegraph === undefined
              ) {
                enemy.shootCooldown -=
                  (delta / 16.6) *
                  simulationCombatPressure.enemyAttackRateMultiplier *
                  (enemy.evolvedAttackRateMultiplier ?? 1);
              }
          '''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one cooldown block, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY

          git show 19beb0abf2b17d391834cb6336419ed4ead6819c:tests/runtime-combat-pressure-adoption.test.ts > tests/runtime-combat-pressure-adoption.test.ts

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'src/game/EnergySwarmGame.tsx' \
            'tests/runtime-combat-pressure-adoption.test.ts' | sort)"
          printf 'remediation changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git diff --check
          test "$(git hash-object tests/runtime-combat-pressure-adoption.test.ts)" = "$(git rev-parse 19beb0abf2b17d391834cb6336419ed4ead6819c:tests/runtime-combat-pressure-adoption.test.ts)"

      - name: Commit remediation only to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/EnergySwarmGame.tsx tests/runtime-combat-pressure-adoption.test.ts
          git commit -m 'fix(j4c-b): restore six-file scope contract'
          test "$(git branch --show-current)" = 'fix/es-13j4c-b-six-file-scope-remediation'
          git push origin HEAD:fix/es-13j4c-b-six-file-scope-remediation

  certify:
    if: github.event.head_commit.message == 'ci(j4c-b): certify six-file scope remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
      ORBI_RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay
        run: npm run test:gameplay

      - name: Platform
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release Contract
        run: npm run release:verify

      - name: Manual dossier
        run: npm run release:evidence:verify

      - name: Production Build
        run: npm run build

      - name: RC readiness fail-closed
        run: npm run release:readiness -- --output release-readiness.json

      - name: Android debug APK
        run: npm run android:debug

      - name: APK verification
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: J4C-B six-file canonical scope guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = '8dec7945338e0152e83536605b18da63879818fe'

          remediation_changed="$(git diff --name-only 8dec7945338e0152e83536605b18da63879818fe...HEAD | sort)"
          remediation_expected="$(printf '%s\n' \
            '.github/workflows/es-13j4c-b-six-file-scope-remediation.yml' \
            'src/game/EnergySwarmGame.tsx' \
            'tests/runtime-combat-pressure-adoption.test.ts' | sort)"
          printf 'remediation changed:\n%s\nexpected:\n%s\n' "$remediation_changed" "$remediation_expected"
          test "$remediation_changed" = "$remediation_expected"

          canonical_changed="$(git diff --name-only 19beb0abf2b17d391834cb6336419ed4ead6819c...HEAD | sort)"
          canonical_expected="$(printf '%s\n' \
            '.github/workflows/es-13j4c-b-six-file-scope-remediation.yml' \
            'src/game/EnergySwarmCanvas.tsx' \
            'src/game/EnergySwarmGame.tsx' \
            'src/game/liveSiegeVolleyIntegration.ts' \
            'src/game/types.ts' \
            'tests/es-13j4c-b-live-siege-volley-integration.test.mjs' \
            'tests/gameplay/live-siege-volley-integration.test.ts' | sort)"
          printf 'canonical changed:\n%s\nexpected:\n%s\n' "$canonical_changed" "$canonical_expected"
          test "$canonical_changed" = "$canonical_expected"

          test "$(git rev-parse HEAD:tests/runtime-combat-pressure-adoption.test.ts)" = "$(git rev-parse 19beb0abf2b17d391834cb6336419ed4ead6819c:tests/runtime-combat-pressure-adoption.test.ts)"
          git diff --quiet 19beb0abf2b17d391834cb6336419ed4ead6819c...HEAD -- \
            src/game/siegeVolleyTelegraph.ts \
            src/game/runtimeTacticalEnemyAdoption.ts \
            src/game/tacticalEnemyFamilies.ts \
            src/game/infiniteBossFamily.ts \
            src/game/liveEnemyFormationDirector.ts \
            src/game/formations.ts \
            src/game/formationCycle.ts \
            src/game/constants.ts \
            android public package.json package-lock.json docs
