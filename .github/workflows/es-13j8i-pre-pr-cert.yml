name: ES-13J8I Pre-PR Certification

on:
  push:
    branches: [es-13j8i-pure-score-attack-descriptor-completion-overlay]
    paths:
      - .github/workflows/es-13j8i-pre-pr-cert.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard exact J8I scope and frozen seams
        run: |
          test "$(git merge-base 12efb3029cf54581c81bad5a2fc629332f7be6c4 HEAD)" = "12efb3029cf54581c81bad5a2fc629332f7be6c4"
          printf '%s\n' \
            .github/workflows/es-13j8i-pre-pr-cert.yml \
            src/game/scoreAttackRuntimeDescriptorCompletionOverlay.ts \
            tests/es-13j8i-score-attack-runtime-descriptor-completion-overlay.test.mjs \
            tests/gameplay/score-attack-runtime-descriptor-completion-overlay.test.ts \
            | sort > /tmp/expected
          git diff --name-only 12efb3029cf54581c81bad5a2fc629332f7be6c4...HEAD | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --quiet 12efb3029cf54581c81bad5a2fc629332f7be6c4...HEAD -- \
            src/game/scoreAttackBootstrapEnvelope.ts \
            src/game/scoreAttackTimeboxProjection.ts \
            src/game/runtimeProgressionRouter.ts \
            src/game/runtimeWaveDescriptor.ts \
            src/game/runtimeCompletionPolicy.ts \
            src/game/runtimeProjectionBundleCache.ts \
            src/game/EnergySwarmGame.tsx \
            src/components/StartScreen.tsx \
            src/components/ResultScreen.tsx \
            src/game/storage.ts \
            src/game/runPersistence.ts
          grep -Fq 'ownsDescriptorCompletionOverlayProjectionAuthority: true' src/game/scoreAttackRuntimeDescriptorCompletionOverlay.ts
          grep -Fq 'BUDGET_AND_CLEAR' src/game/scoreAttackRuntimeDescriptorCompletionOverlay.ts
          grep -Fq 'SCORE_ATTACK_DURATION_MS' src/game/scoreAttackRuntimeDescriptorCompletionOverlay.ts

      - name: Repository smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8i-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbi-energy-swarm-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
