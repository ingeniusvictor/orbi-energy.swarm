name: ES-13J8P guarded applicator

on:
  push:
    branches:
      - es-13j8p-controlled-public-score-attack-selection-presentation
    paths:
      - .github/workflows/es-13j8p-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout J8P branch
        uses: actions/checkout@v4
        with:
          ref: es-13j8p-controlled-public-score-attack-selection-presentation
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact J8P presentation patch
        run: python3 scripts/es-13j8p-apply.py

      - name: Verify whitespace and exact working-tree scope
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only HEAD)
          printf '%s\n' "${changed[@]}"
          expected=(
            src/components/GameHud.tsx
            src/components/ResultScreen.tsx
            src/components/StartScreen.tsx
            src/game/EnergySwarmGame.tsx
            tests/es-13j8p-public-score-attack-presentation.test.mjs
            tests/gameplay/score-attack-public-presentation.test.ts
          )
          if [ "${#changed[@]}" -ne "${#expected[@]}" ]; then
            echo "Unexpected number of working-tree changes: ${#changed[@]}" >&2
            exit 1
          fi
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null || {
              echo "Missing expected path: $path" >&2
              exit 1
            }
          done

      - name: Focused J8P contract tests
        run: |
          node --test tests/es-13j8p-public-score-attack-presentation.test.mjs
          npx tsx --test tests/gameplay/score-attack-public-presentation.test.ts

      - name: Typecheck before commit
        run: npm run typecheck

      - name: Commit and push J8P product slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/GameHud.tsx \
            src/components/ResultScreen.tsx \
            src/components/StartScreen.tsx \
            src/game/EnergySwarmGame.tsx \
            tests/es-13j8p-public-score-attack-presentation.test.mjs \
            tests/gameplay/score-attack-public-presentation.test.ts
          git commit -m "ES-13J8P — adopt public Score Attack presentation"
          git push origin HEAD:es-13j8p-controlled-public-score-attack-selection-presentation
