name: ES-13DOC57 full docs certification

on:
  push:
    branches:
      - docs/es-13-doc57-close-j9c-activate-j9d
    paths:
      - '.github/workflows/es-13doc57-certify.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact DOC57 docs-only scope guard
        shell: bash
        run: |
          BASE=370f770171993760a3e11fa0aa95bcaa4318b758
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD | sort)
          expected=(
            .github/workflows/es-13doc57-certify.yml
            docs/ES13_GAMEPLAY_ROADMAP.md
            docs/IMPLEMENTATION_LEDGER.md
            docs/PROJECT_CONTINUITY.md
          )
          [ "${#changed[@]}" -eq "${#expected[@]}" ]
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null; done
          git diff --check "$BASE"...HEAD
          test -z "$(git diff --name-only "$BASE"...HEAD -- src tests android package.json package-lock.json)"
          grep -F 'ACTIVE PROGRAM — J9C DEPLOYED / J9D NEXT' docs/ES13_GAMEPLAY_ROADMAP.md >/dev/null
          grep -F 'Canonical: `370f770171993760a3e11fa0aa95bcaa4318b758`' docs/ES13_GAMEPLAY_ROADMAP.md >/dev/null
          grep -F 'NEXT CONTRACT TARGET AFTER DOC57 CLOSURE' docs/IMPLEMENTATION_LEDGER.md >/dev/null
          grep -F 'do not re-read chassis descriptors, select EnemyType' docs/PROJECT_CONTINUITY.md >/dev/null
          test ! -e .github/workflows/es-13doc57-apply.yml
          test ! -e scripts/es-13doc57-apply.py
      - run: npm run test:repo
      - run: npm run test:gameplay
      - run: npm run test:platform
      - run: npm run typecheck
      - run: npm run release:verify
      - run: npm run release:evidence:verify
      - run: npm run build
      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: es-13doc57-rc-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30
