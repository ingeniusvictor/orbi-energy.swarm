name: ES-13DOC56 guarded docs applicator

on:
  push:
    branches:
      - docs/es-13-doc56-close-j9b-activate-j9c
    paths:
      - '.github/workflows/es-13doc56-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DOC56 branch
        uses: actions/checkout@v4
        with:
          ref: docs/es-13-doc56-close-j9b-activate-j9c
          fetch-depth: 0

      - name: Apply exact DOC56 patch
        run: python3 scripts/es-13doc56-apply.py

      - name: Verify whitespace and exact docs scope
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            docs/ES13_GAMEPLAY_ROADMAP.md
            docs/IMPLEMENTATION_LEDGER.md
            docs/PROJECT_CONTINUITY.md
          )
          if [ "${#changed[@]}" -ne "${#expected[@]}" ]; then
            printf 'Unexpected DOC56 scope:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null || exit 1
          done
          grep -F '18dd628981182740905fa6e05a463c525c699e37' docs/ES13_GAMEPLAY_ROADMAP.md >/dev/null
          grep -F 'ES-13J9C — Pure Blackout Architect Chassis Compatibility Contract' docs/ES13_GAMEPLAY_ROADMAP.md >/dev/null
          grep -F 'NEXT CONTRACT TARGET AFTER DOC56 CLOSURE' docs/IMPLEMENTATION_LEDGER.md >/dev/null
          grep -F 'TITAN_CORE' docs/PROJECT_CONTINUITY.md >/dev/null

      - name: Commit and push DOC56 docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m "ES-13DOC56 — close J9B and activate J9C chassis compatibility"
          git push origin HEAD:docs/es-13-doc56-close-j9b-activate-j9c
