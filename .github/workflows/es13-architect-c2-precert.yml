name: ES-13 Architect C2 temporary full pre-cert
on:
  push:
    branches: ['feat/es13-architect-qa-cardinal-impact-c2']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Exact authorized scope
        shell: bash
        run: |
          git diff --name-only 2d6e9ed610d090f2257e18615d42124c2be6563a HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/es13-architect-c2-precert.yml' \
            'src/game/EnergySwarmGame.tsx' \
            'src/game/blackoutArchitectDevQaCardinalImpact.ts' \
            'tests/es-13j9lb2b2b2b-dev-qa.test.mjs' \
            'tests/es-13j9lb2b2b2b2c1-cardinal-geometry.test.mjs' \
            'tests/es-13j9lb2b2b2b2c2-cardinal-impact.test.mjs' \
            'tests/gameplay/blackout-architect-dev-cardinal-impact.test.ts' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - run: npm ci
      - name: Focused QA static and gameplay
        run: |
          node --test tests/es-13j9lb2b2b2b-dev-qa.test.mjs tests/es-13j9lb2b2b2b2c1-cardinal-geometry.test.mjs tests/es-13j9lb2b2b2b2c2-cardinal-impact.test.mjs
          npx tsx --test tests/gameplay/blackout-architect-dev-cardinal-impact.test.ts
      - name: Full repo+gameplay+platform
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Release and evidence
        run: |
          npm run release:verify
          npm run release:evidence:verify
      - name: Web build and release readiness
        run: |
          npm run build
          npm run release:readiness -- --output release-readiness.json
      - name: Android debug APK
        run: npm run android:debug
      - name: APK verification
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: es13-c2-precert-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
