name: ES-13J4C-B Apply Live Siege Integration

on:
  push:
    branches:
      - feat/es-13j4c-b-live-siege-volley-integration

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/es-13j4c-b-live-siege-volley-integration
          fetch-depth: 0

      - name: Apply fail-closed J4C-B runtime patch
        run: python3 scripts/es-13j4c-b-apply-live-siege.py

      - name: Guard exact product patch scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "src/game/EnergySwarmCanvas.tsx"
            "src/game/EnergySwarmGame.tsx"
            "src/game/types.ts"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected working-tree scope:\n%s\n' "${changed[*]}"
            exit 1
          fi

      - name: Commit bounded live integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/types.ts src/game/EnergySwarmGame.tsx src/game/EnergySwarmCanvas.tsx
          git commit -m "feat(j4c-b): integrate live siege volley telegraph"
          git push origin HEAD:feat/es-13j4c-b-live-siege-volley-integration
