name: ES-12H5 Finalize Guarded Implementation V5

on:
  push:
    branches:
      - feat/es-12h5-infinite-boss-family
    paths:
      - .github/workflows/es12h5-finalize-v5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout H5 branch
        uses: actions/checkout@v4
        with:
          ref: feat/es-12h5-infinite-boss-family
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align guarded source marker
        run: |
          sed -i 's#// 7\. ATTACK SELECTION#// 7. ACTIVE ATTACK COOLDOWNS / SELECTION#' scripts/es12h5-apply.mjs

      - name: Apply guarded H5 patch
        run: node scripts/es12h5-apply.mjs

      - name: Update historical rematch fixture with required boss identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/runtime-boss-rematch-gate.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = '  enemyType: EnemyType.BOSS_DEVOURER,\n  healthMultiplier: 1.2,';
          const after = '  enemyType: EnemyType.BOSS_DEVOURER,\n  bossIdentity: "DEVOURER_ASCENDANT",\n  healthMultiplier: 1.2,';
          const first = source.indexOf(before);
          if (first < 0) throw new Error('H5 finalize missing rematch fixture anchor');
          if (source.indexOf(before, first + before.length) >= 0) throw new Error('H5 finalize ambiguous rematch fixture anchor');
          source = source.slice(0, first) + after + source.slice(first + before.length);
          fs.writeFileSync(path, source, 'utf8');
          NODE

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay
        run: npm run test:gameplay

      - name: Platform
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Production Build
        run: npm run build

      - name: Commit clean H5 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch -- \
            scripts/es12h5-apply.mjs \
            .github/workflows/es12h5-implement.yml \
            .github/workflows/es12h5-implement-v2.yml \
            .github/workflows/es12h5-typecheck-diagnostic.yml \
            .github/workflows/es12h5-finalize.yml \
            .github/workflows/es12h5-finalize-v5.yml \
            es12h5-typecheck.log
          git add -- \
            src/game/infiniteBossFamily.ts \
            src/game/types.ts \
            src/game/runtimeMilestoneEncounter.ts \
            src/game/EnergySwarmGame.tsx \
            tests/infinite-boss-family.test.ts \
            tests/infinite-boss-family-runtime.test.ts \
            tests/runtime-milestone-encounter.test.ts \
            tests/runtime-boss-rematch-adoption.test.ts \
            tests/runtime-boss-rematch-gate.test.ts
          git status --short
          git commit -m "feat(h5): add Infinite boss family and milestone encounters"
          git push origin HEAD:feat/es-12h5-infinite-boss-family
