name: ES-13DOC12 Apply Documentation

on:
  push:
    branches:
      - docs/es-13-j3c-a-closure-j3c-b-activation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply documentation patch
        run: python .github/scripts/es13doc12_apply.py
      - name: Verify documentation-only diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md | sort)"
          test "$changed" = "$expected"
      - name: Commit documentation transition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_CONTINUITY.md docs/IMPLEMENTATION_LEDGER.md docs/ES13_GAMEPLAY_ROADMAP.md
          git commit -m "docs(es13): freeze J3C-A and activate J3C-B"
          git push origin HEAD:docs/es-13-j3c-a-closure-j3c-b-activation
