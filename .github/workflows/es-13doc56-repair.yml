name: ES-13DOC56 exact header repair

on:
  push:
    branches:
      - docs/es-13-doc56-close-j9b-activate-j9c
    paths:
      - '.github/workflows/es-13doc56-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/es-13-doc56-close-j9b-activate-j9c
          fetch-depth: 0
      - name: Repair exact J9 program status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ES13_GAMEPLAY_ROADMAP.md')
          text = p.read_text()
          old = 'Status: **ACTIVE PROGRAM — J9A DEPLOYED / J9B NEXT**'
          new = 'Status: **ACTIVE PROGRAM — J9B DEPLOYED / J9C NEXT**'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old J9 status, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only HEAD)" = "docs/ES13_GAMEPLAY_ROADMAP.md"
          grep -F 'Status: **ACTIVE PROGRAM — J9B DEPLOYED / J9C NEXT**' docs/ES13_GAMEPLAY_ROADMAP.md >/dev/null
      - name: Commit and push repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ES13_GAMEPLAY_ROADMAP.md
          git commit -m "fix(DOC56): advance J9 program status to J9C"
          git push origin HEAD:docs/es-13-doc56-close-j9b-activate-j9c
