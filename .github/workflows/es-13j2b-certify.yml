name: ES-13J2B Live Overdrive Certification

on:
  push:
    branches:
      - feat/es-13j2b-live-overdrive-activation

permissions:
  contents: write

jobs:
  certify:
    if: ${{ !contains(github.event.head_commit.message, '[j2b-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize J2B live adoption
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          game_path = Path('src/game/EnergySwarmGame.tsx')
          hud_path = Path('src/components/GameHud.tsx')
          test_path = Path('tests/es-13j2b-live-overdrive-adoption.test.mjs')

          game = game_path.read_text()
          hud = hud_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          game = replace_once(
              game,
              '''import {
            applyCombatResonanceDamageBreak,
            createCombatResonanceState,
            expireCombatChain,
            projectCombatResonance,
            registerCombatResonanceDefeat,
          } from "./combatResonance";
          import {
            PERFORMANCE_EVIDENCE_TARGET_SAMPLES,''',
              '''import {
            applyCombatResonanceDamageBreak,
            createCombatResonanceState,
            expireCombatChain,
            projectCombatResonance,
            registerCombatResonanceDefeat,
          } from "./combatResonance";
          import {
            activateCombatOverdrive,
            advanceCombatOverdrive,
            createCombatOverdriveState,
            projectCombatOverdrive,
          } from "./combatOverdrive";
          import {
            PERFORMANCE_EVIDENCE_TARGET_SAMPLES,''',
              'combatOverdrive import',
          )

          game = replace_once(
              game,
              '''  const [combatResonanceView, setCombatResonanceView] = useState(() => {
            const initialState = createCombatResonanceState();
            return {
              chain: initialState.chain,
              resonance: initialState.resonance,
              ...projectCombatResonance(initialState),
            };
          });

          // Stats persisting''',
              '''  const [combatResonanceView, setCombatResonanceView] = useState(() => {
            const initialState = createCombatResonanceState();
            return {
              chain: initialState.chain,
              resonance: initialState.resonance,
              ...projectCombatResonance(initialState),
            };
          });
          const [combatOverdriveView, setCombatOverdriveView] = useState(() =>
            projectCombatOverdrive(createCombatOverdriveState(), 0, false),
          );

          // Stats persisting''',
              'combatOverdrive view state',
          )

          game = replace_once(
              game,
              '''  const fusionEnergyRef = useRef(0);
            const combatResonanceRef = useRef(createCombatResonanceState());

            const keysPressedRef''',
              '''  const fusionEnergyRef = useRef(0);
            const combatResonanceRef = useRef(createCombatResonanceState());
            const combatOverdriveRef = useRef(createCombatOverdriveState());

            const keysPressedRef''',
              'combatOverdrive ref',
          )

          game = replace_once(
              game,
              '''    setCombatResonanceView({
              chain: resetResonanceState.chain,
              resonance: resetResonanceState.resonance,
              ...projectCombatResonance(resetResonanceState),
            });
            playerFlashRef.current = 0;''',
              '''    setCombatResonanceView({
              chain: resetResonanceState.chain,
              resonance: resetResonanceState.resonance,
              ...projectCombatResonance(resetResonanceState),
            });
            const resetOverdriveState = createCombatOverdriveState();
            combatOverdriveRef.current = resetOverdriveState;
            setCombatOverdriveView(
              projectCombatOverdrive(resetOverdriveState, 0, false),
            );
            playerFlashRef.current = 0;''',
              'startGame Overdrive reset',
          )

          game = replace_once(
              game,
              '''  // --- KEY LISTENER LISTENERS ---
            useEffect(() => {''',
              '''  const handleOverdriveActivation = () => {
            if (
              !isPlaying ||
              isGameOver ||
              isPausedRef.current ||
              isPhotoMode ||
              isUpgradeSelectionOpenRef.current
            ) {
              return false;
            }

            const nowMs = timeElapsedRef.current;
            combatOverdriveRef.current = advanceCombatOverdrive(
              combatOverdriveRef.current,
              nowMs,
            );
            const resonanceProjection = projectCombatResonance(
              combatResonanceRef.current,
            );
            const preActivationProjection = projectCombatOverdrive(
              combatOverdriveRef.current,
              nowMs,
              resonanceProjection.overdriveReady,
            );

            if (!preActivationProjection.canActivate) {
              setCombatOverdriveView(preActivationProjection);
              return false;
            }

            const resolution = activateCombatOverdrive(
              combatOverdriveRef.current,
              {
                occurredAtMs: nowMs,
                overdriveReady: resonanceProjection.overdriveReady,
              },
            );
            combatOverdriveRef.current = resolution.state;
            setCombatOverdriveView(resolution.projection);

            if (!resolution.activated || !resolution.consumeResonance) {
              return false;
            }

            combatResonanceRef.current = {
              ...combatResonanceRef.current,
              resonance: 0,
            };
            const consumedResonanceProjection = projectCombatResonance(
              combatResonanceRef.current,
            );
            setCombatResonanceView({
              chain: combatResonanceRef.current.chain,
              resonance: combatResonanceRef.current.resonance,
              ...consumedResonanceProjection,
            });
            return true;
          };

          // --- KEY LISTENER LISTENERS ---
          useEffect(() => {''',
              'Overdrive activation handler',
          )

          game = replace_once(
              game,
              '''      if (isUpgradeSelectionOpenRef.current) {
                e.preventDefault();
                if (key === "1") {
                  selectUpgradeByIndex(0);
                } else if (key === "2") {
                  selectUpgradeByIndex(1);
                } else if (key === "3") {
                  selectUpgradeByIndex(2);
                } else if (key === "R") {
                  handleReroll();
                }
                return; // BLOCK ALL OTHER INPUTS
              }

              keysPressedRef.current[key] = true;''',
              '''      if (isUpgradeSelectionOpenRef.current) {
                e.preventDefault();
                if (key === "1") {
                  selectUpgradeByIndex(0);
                } else if (key === "2") {
                  selectUpgradeByIndex(1);
                } else if (key === "3") {
                  selectUpgradeByIndex(2);
                } else if (key === "R") {
                  handleReroll();
                }
                return; // BLOCK ALL OTHER INPUTS
              }

              if (key === "O") {
                e.preventDefault();
                handleOverdriveActivation();
                return;
              }

              keysPressedRef.current[key] = true;''',
              'O hotkey adoption',
          )

          game = replace_once(
              game,
              '''  }, [isPlaying, isPaused, isPhotoMode, upgradesLevel]);''',
              '''  }, [isPlaying, isPaused, isPhotoMode, isGameOver, upgradesLevel]);''',
              'key listener dependencies',
          )

          game = replace_once(
              game,
              '''      const liveResonanceProjection = projectCombatResonance(
                combatResonanceRef.current,
              );
              setCombatResonanceView({
                chain: combatResonanceRef.current.chain,
                resonance: combatResonanceRef.current.resonance,
                ...liveResonanceProjection,
              });
              setScore(scoreRef.current);''',
              '''      const liveResonanceProjection = projectCombatResonance(
                combatResonanceRef.current,
              );
              combatOverdriveRef.current = advanceCombatOverdrive(
                combatOverdriveRef.current,
                timeElapsedRef.current,
              );
              const liveOverdriveProjection = projectCombatOverdrive(
                combatOverdriveRef.current,
                timeElapsedRef.current,
                liveResonanceProjection.overdriveReady,
              );
              setCombatResonanceView({
                chain: combatResonanceRef.current.chain,
                resonance: combatResonanceRef.current.resonance,
                ...liveResonanceProjection,
              });
              setCombatOverdriveView(liveOverdriveProjection);
              setScore(scoreRef.current);''',
              'HUD cadence Overdrive projection',
          )

          game = replace_once(
              game,
              '''                combatResonanceTier={combatResonanceView.tier}
                            combatScoreMultiplier={combatResonanceView.scoreMultiplier}
                            onTogglePause={togglePause}
                            onToggleMute={toggleMute}''',
              '''                combatResonanceTier={combatResonanceView.tier}
                            combatScoreMultiplier={combatResonanceView.scoreMultiplier}
                            combatOverdriveActive={combatOverdriveView.active}
                            combatOverdriveCanActivate={combatOverdriveView.canActivate}
                            combatOverdriveActionEnabled={
                              combatOverdriveView.canActivate &&
                              !isPaused &&
                              !isGameOver &&
                              !isPhotoMode &&
                              !isUpgradeSelectionOpen
                            }
                            combatOverdriveRemainingMs={combatOverdriveView.remainingMs}
                            combatOverdriveReentryLocked={combatOverdriveView.reentryLocked}
                            combatOverdriveReentryRemainingMs={combatOverdriveView.reentryRemainingMs}
                            onActivateOverdrive={handleOverdriveActivation}
                            onTogglePause={togglePause}
                            onToggleMute={toggleMute}''',
              'GameHud Overdrive props',
          )

          hud = replace_once(
              hud,
              '''import { Shield, Award, Users, Volume2, VolumeX, Pause, Play } from "lucide-react";''',
              '''import { Shield, Award, Users, Volume2, VolumeX, Pause, Play, Zap } from "lucide-react";''',
              'GameHud Zap import',
          )

          hud = replace_once(
              hud,
              '''  combatResonanceTier: ResonanceTier;
            combatScoreMultiplier: number;
            onTogglePause: () => void;''',
              '''  combatResonanceTier: ResonanceTier;
            combatScoreMultiplier: number;
            combatOverdriveActive: boolean;
            combatOverdriveCanActivate: boolean;
            combatOverdriveActionEnabled: boolean;
            combatOverdriveRemainingMs: number;
            combatOverdriveReentryLocked: boolean;
            combatOverdriveReentryRemainingMs: number;
            onActivateOverdrive: () => void;
            onTogglePause: () => void;''',
              'GameHud props interface',
          )

          hud = replace_once(
              hud,
              '''  combatResonanceTier,
            combatScoreMultiplier,
            onTogglePause,
            onToggleMute''',
              '''  combatResonanceTier,
            combatScoreMultiplier,
            combatOverdriveActive,
            combatOverdriveCanActivate,
            combatOverdriveActionEnabled,
            combatOverdriveRemainingMs,
            combatOverdriveReentryLocked,
            combatOverdriveReentryRemainingMs,
            onActivateOverdrive,
            onTogglePause,
            onToggleMute''',
              'GameHud props destructure',
          )

          hud = replace_once(
              hud,
              '''  const resonanceAriaLabel = language === "es"
            ? `Cadena ${combatChain}, resonancia ${Math.round(combatResonance)} por ciento, ${resonanceTierLabel}, multiplicador ${combatScoreMultiplier.toFixed(2)}`
            : `Chain ${combatChain}, resonance ${Math.round(combatResonance)} percent, ${resonanceTierLabel}, multiplier ${combatScoreMultiplier.toFixed(2)}`;

            // Localized wave details lookup helper''',
              '''  const resonanceAriaLabel = language === "es"
            ? `Cadena ${combatChain}, resonancia ${Math.round(combatResonance)} por ciento, ${resonanceTierLabel}, multiplicador ${combatScoreMultiplier.toFixed(2)}`
            : `Chain ${combatChain}, resonance ${Math.round(combatResonance)} percent, ${resonanceTierLabel}, multiplier ${combatScoreMultiplier.toFixed(2)}`;
            const overdriveSeconds = Math.max(
              0,
              Math.ceil(
                (combatOverdriveActive
                  ? combatOverdriveRemainingMs
                  : combatOverdriveReentryRemainingMs) / 1000,
              ),
            );
            const overdriveStatus = combatOverdriveActive
              ? `ACTIVE ${overdriveSeconds}s`
              : combatOverdriveReentryLocked
                ? `RECHARGING ${overdriveSeconds}s`
                : combatOverdriveCanActivate
                  ? "READY"
                  : "CHARGE";
            const overdriveAriaLabel = language === "es"
              ? `Sobrecarga ORBI: ${overdriveStatus}. Atajo O.`
              : `ORBI Overdrive: ${overdriveStatus}. Shortcut O.`;

            // Localized wave details lookup helper''',
              'GameHud Overdrive status',
          )

          hud = replace_once(
              hud,
              '''      {/* 5. QUICK CONTROLLER BUTTONS */}
                <div className="orbi-hud-actions flex items-center gap-1">
                  <button
                    onClick={onTogglePause}''',
              '''      {/* 5. QUICK CONTROLLER BUTTONS */}
                <div className="orbi-hud-actions flex items-center gap-1">
                  <button
                    onClick={onActivateOverdrive}
                    disabled={!combatOverdriveActionEnabled}
                    className={`flex items-center gap-1 rounded border px-1.5 py-1 text-[8px] font-black uppercase transition ${
                      combatOverdriveActive
                        ? "border-amber-400/60 bg-amber-950/40 text-amber-300"
                        : combatOverdriveReentryLocked
                          ? "border-slate-800 bg-slate-950/60 text-slate-600"
                          : combatOverdriveCanActivate
                            ? "border-amber-400/70 bg-amber-500/15 text-amber-300 hover:bg-amber-500/25 cursor-pointer"
                            : "border-slate-850 bg-slate-950/40 text-slate-600"
                    } disabled:cursor-not-allowed`}
                    title={overdriveAriaLabel}
                    aria-label={overdriveAriaLabel}
                    aria-disabled={!combatOverdriveActionEnabled}
                  >
                    <Zap size={10} />
                    <span>{overdriveStatus}</span>
                  </button>

                  <button
                    onClick={onTogglePause}''',
              'GameHud Overdrive action',
          )

          test_source = '''import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";

          const gameSource = fs.readFileSync("src/game/EnergySwarmGame.tsx", "utf8");
          const hudSource = fs.readFileSync("src/components/GameHud.tsx", "utf8");

          const sliceBetween = (source, start, end) => {
            const startIndex = source.indexOf(start);
            assert.notEqual(startIndex, -1, `Missing start marker: ${start}`);
            const endIndex = source.indexOf(end, startIndex + start.length);
            assert.notEqual(endIndex, -1, `Missing end marker: ${end}`);
            return source.slice(startIndex, endIndex);
          };

          test("J2B adopts the certified J2A state helpers without duplicating timing", () => {
            for (const symbol of [
              "activateCombatOverdrive",
              "advanceCombatOverdrive",
              "createCombatOverdriveState",
              "projectCombatOverdrive",
            ]) {
              assert.match(gameSource, new RegExp(`\\b${symbol}\\b`));
            }
            assert.match(gameSource, /combatOverdriveRef\s*=\s*useRef\(createCombatOverdriveState\(\)\)/);

            const activation = sliceBetween(
              gameSource,
              "const handleOverdriveActivation =",
              "// --- KEY LISTENER LISTENERS ---",
            );
            const cadence = sliceBetween(
              gameSource,
              "if (hudCadence.shouldFlush) {",
              "if (diagnosticsActive) {",
            );
            const liveAdoption = `${activation}\n${cadence}\n${hudSource}`;
            assert.doesNotMatch(liveAdoption, /OVERDRIVE_DURATION_MS|OVERDRIVE_REENTRY_LOCK_MS|\b8_?000\b|\b4_?000\b/);
          });

          test("J2B activation is explicit, guarded, simulation-time based and consumes resonance once", () => {
            const activation = sliceBetween(
              gameSource,
              "const handleOverdriveActivation =",
              "// --- KEY LISTENER LISTENERS ---",
            );
            for (const guard of [
              /!isPlaying/,
              /isGameOver/,
              /isPausedRef\.current/,
              /isPhotoMode/,
              /isUpgradeSelectionOpenRef\.current/,
            ]) {
              assert.match(activation, guard);
            }
            assert.match(activation, /const nowMs = timeElapsedRef\.current/);
            assert.match(activation, /resonanceProjection\.overdriveReady/);
            assert.match(activation, /preActivationProjection\.canActivate/);
            assert.match(activation, /activateCombatOverdrive\(/);
            assert.match(activation, /resolution\.consumeResonance/);
            assert.match(activation, /\.\.\.combatResonanceRef\.current,\s*resonance:\s*0/s);
            assert.doesNotMatch(activation, /chain:\s*0|bestChain:\s*0|affinityTrail:\s*\[\]/);
            assert.doesNotMatch(activation, /startBgm|playEnemy|play.*Sound|projectilesRef|damageMultiplier|fireRate|scoreRef\.current\s*[+*]=/i);
          });

          test("J2B exposes only explicit O/HUD activation and low-frequency simulation-time projection", () => {
            assert.match(gameSource, /if \(key === "O"\) \{[\s\S]*?handleOverdriveActivation\(\);[\s\S]*?return;/);
            assert.match(gameSource, /onActivateOverdrive=\{handleOverdriveActivation\}/);

            const cadence = sliceBetween(
              gameSource,
              "if (hudCadence.shouldFlush) {",
              "if (diagnosticsActive) {",
            );
            assert.match(cadence, /advanceCombatOverdrive\([\s\S]*?timeElapsedRef\.current/);
            assert.match(cadence, /projectCombatOverdrive\([\s\S]*?timeElapsedRef\.current/);
            assert.match(cadence, /setCombatOverdriveView\(liveOverdriveProjection\)/);
          });

          test("J2B resets Overdrive with a fresh run", () => {
            const startGame = sliceBetween(
              gameSource,
              "const startGame = () => {",
              "const rebootGame =",
            );
            assert.match(startGame, /const resetOverdriveState = createCombatOverdriveState\(\)/);
            assert.match(startGame, /combatOverdriveRef\.current = resetOverdriveState/);
            assert.match(startGame, /setCombatOverdriveView\(/);
          });

          test("J2B HUD exposes READY, ACTIVE and RECHARGING with a disabled guarded action", () => {
            for (const prop of [
              "combatOverdriveActive",
              "combatOverdriveCanActivate",
              "combatOverdriveActionEnabled",
              "combatOverdriveRemainingMs",
              "combatOverdriveReentryLocked",
              "combatOverdriveReentryRemainingMs",
              "onActivateOverdrive",
            ]) {
              assert.match(hudSource, new RegExp(`\\b${prop}\\b`));
            }
            assert.match(hudSource, /ACTIVE/);
            assert.match(hudSource, /RECHARGING/);
            assert.match(hudSource, /READY/);
            assert.match(hudSource, /disabled=\{!combatOverdriveActionEnabled\}/);
            assert.match(hudSource, /aria-label=\{overdriveAriaLabel\}/);
          });
          '''
          test_source = '\n'.join(line[10:] if line.startswith('          ') else line for line in test_source.splitlines()) + '\n'

          game_path.write_text(game)
          hud_path.write_text(hud)
          test_path.write_text(test_source)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Repository smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness remains fail-closed
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Build Android debug APK
        env:
          ORBI_BUILD_SHA: ${{ github.sha }}
        run: npm run android:debug

      - name: Verify Android APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: J2B scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only a485e52542b3d097511789c15f1a7afcb6ba5cb0...HEAD | sort -u > /tmp/j2b-files.txt
          git diff --name-only | sort -u >> /tmp/j2b-files.txt
          sort -u /tmp/j2b-files.txt -o /tmp/j2b-files.txt
          cat /tmp/j2b-files.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .github/workflows/es-13j2b-certify.yml|src/game/EnergySwarmGame.tsx|src/components/GameHud.tsx|tests/es-13j2b-live-overdrive-adoption.test.mjs) ;;
              *) echo "Unexpected J2B scope: $file" >&2; exit 1 ;;
            esac
          done < /tmp/j2b-files.txt

      - name: Commit certified materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add src/game/EnergySwarmGame.tsx src/components/GameHud.tsx tests/es-13j2b-live-overdrive-adoption.test.mjs
          git commit -m "feat(j2b): adopt live Overdrive activation and HUD [j2b-materialized]"
          git push origin HEAD:feat/es-13j2b-live-overdrive-activation
