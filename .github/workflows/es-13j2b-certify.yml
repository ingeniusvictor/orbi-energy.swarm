name: ES-13J2B Live Overdrive Certification

on:
  push:
    branches:
      - feat/es-13j2b-live-overdrive-activation

permissions:
  contents: write

jobs:
  certify:
    if: ${{ !contains(github.event.head_commit.message, '[j2b-materialized]') && !contains(github.event.head_commit.message, '[j2b-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize J2B live adoption
        run: python3 scripts/es-13j2b-materialize.py

      - name: Install dependencies
        run: npm ci

      - name: Repository smoke
        id: repo_smoke
        shell: bash
        run: |
          set +e
          npm run test:repo > /tmp/j2b-repo-smoke.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            set +e
            node --test tests/es-13j2b-live-overdrive-adoption.test.mjs > /tmp/j2b-isolated.log 2>&1
            isolated_status=$?
            set -e
            python3 - <<'PY'
          from pathlib import Path

          full = Path('/tmp/j2b-repo-smoke.log').read_text(errors='replace').splitlines()
          isolated = Path('/tmp/j2b-isolated.log').read_text(errors='replace')
          snippets = []
          seen = set()
          for index, line in enumerate(full):
              if line.lstrip().startswith('not ok '):
                  start = max(0, index - 3)
                  end = min(len(full), index + 45)
                  key = (start, end)
                  if key not in seen:
                      seen.add(key)
                      snippets.append('\n'.join(full[start:end]))
          summary = '\n'.join(full[-18:])
          report = [
              '=== EXTRACTED FAILING SUBTESTS FROM FULL REPOSITORY SMOKE ===',
              '\n\n'.join(snippets) if snippets else '(no not-ok blocks found)',
              '',
              '=== ISOLATED J2B ADOPTION TEST ===',
              isolated,
              '',
              '=== FULL REPOSITORY SMOKE SUMMARY ===',
              summary,
          ]
          Path('j2b-repo-smoke-failure.txt').write_text('\n'.join(report))
          PY
            echo "isolated_status=$isolated_status"
            cat j2b-repo-smoke-failure.txt
          fi

      - name: Commit repository smoke diagnostic
        if: ${{ steps.repo_smoke.outputs.status != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add j2b-repo-smoke-failure.txt
          git commit -m "ci(j2b): capture exact repository smoke assertions [j2b-diagnostic]"
          git push origin HEAD:feat/es-13j2b-live-overdrive-activation

      - name: Fail after repository smoke diagnostic
        if: ${{ steps.repo_smoke.outputs.status != '0' }}
        run: exit 1

      - name: Gameplay regression
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        run: npm run test:gameplay

      - name: Platform regression
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        run: npm run test:platform

      - name: Typecheck
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        run: npm run typecheck

      - name: Release contract
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        run: npm run release:verify

      - name: Manual certification dossier
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        run: npm run release:evidence:verify

      - name: Production build
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        run: npm run build

      - name: RC readiness remains fail-closed
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Setup Java 21
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Build Android debug APK
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        env:
          ORBI_BUILD_SHA: ${{ github.sha }}
        run: npm run android:debug

      - name: Verify Android APK
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: J2B scope guard
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            git diff --name-only a485e52542b3d097511789c15f1a7afcb6ba5cb0...HEAD
            git diff --name-only
          } | sort -u > /tmp/j2b-files.txt
          cat /tmp/j2b-files.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .github/workflows/es-13j2b-certify.yml|scripts/es-13j2b-materialize.py|j2b-repo-smoke-failure.txt|src/game/EnergySwarmGame.tsx|src/components/GameHud.tsx|tests/es-13j2b-live-overdrive-adoption.test.mjs|tests/es-13j1b-live-resonance-adoption.test.mjs|tests/es-13j2a-overdrive-contract.test.mjs) ;;
              *) echo "Unexpected J2B scope: $file" >&2; exit 1 ;;
            esac
          done < /tmp/j2b-files.txt

      - name: Commit certified materialization
        if: ${{ steps.repo_smoke.outputs.status == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add src/game/EnergySwarmGame.tsx src/components/GameHud.tsx tests/es-13j2b-live-overdrive-adoption.test.mjs tests/es-13j1b-live-resonance-adoption.test.mjs tests/es-13j2a-overdrive-contract.test.mjs
          git commit -m "feat(j2b): adopt live Overdrive activation and HUD [j2b-materialized]"
          git push origin HEAD:feat/es-13j2b-live-overdrive-activation
