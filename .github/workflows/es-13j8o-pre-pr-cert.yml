name: ES-13J8O Pre-PR Certification

on:
  push:
    branches: [es-13j8o-controlled-live-score-attack-engine-lifecycle]
    paths:
      - .github/workflows/es-13j8o-pre-pr-cert.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard exact J8O scope and frozen seams
        run: |
          test "$(git merge-base 7ed00b7f28f8c3dd6578932f8e77845e8618d853 HEAD)" = "7ed00b7f28f8c3dd6578932f8e77845e8618d853"
          printf '%s\n' \
            .github/workflows/es-13j8o-pre-pr-cert.yml \
            src/game/EnergySwarmGame.tsx \
            src/game/scoreAttackLiveEngineLifecycle.ts \
            tests/es-13j8o-score-attack-live-engine-lifecycle.test.mjs \
            tests/gameplay/score-attack-live-engine-lifecycle.test.ts | sort > /tmp/expected
          git diff --name-only 7ed00b7f28f8c3dd6578932f8e77845e8618d853...HEAD | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --quiet 7ed00b7f28f8c3dd6578932f8e77845e8618d853...HEAD -- src/game/scoreAttackRuntimeProjectionBundle.ts
          git diff --quiet 7ed00b7f28f8c3dd6578932f8e77845e8618d853...HEAD -- src/game/scoreAttackRuntimeActivationEnvelope.ts
          git diff --quiet 7ed00b7f28f8c3dd6578932f8e77845e8618d853...HEAD -- src/game/scoreAttackAttemptFinalizationPlan.ts
          git diff --quiet 7ed00b7f28f8c3dd6578932f8e77845e8618d853...HEAD -- src/game/scoreAttackStatsCommitApplication.ts
          git diff --quiet 7ed00b7f28f8c3dd6578932f8e77845e8618d853...HEAD -- tests/es-13j8k-score-attack-runtime-projection-bundle.test.mjs
          git diff --quiet 7ed00b7f28f8c3dd6578932f8e77845e8618d853...HEAD -- tests/es-13j8l-score-attack-runtime-activation-envelope.test.mjs
          git diff --quiet 7ed00b7f28f8c3dd6578932f8e77845e8618d853...HEAD -- tests/es-13j8m-score-attack-attempt-finalization-plan.test.mjs
          git diff --quiet 7ed00b7f28f8c3dd6578932f8e77845e8618d853...HEAD -- tests/es-13j8n-score-attack-stats-commit-application.test.mjs
          git diff --quiet 7ed00b7f28f8c3dd6578932f8e77845e8618d853...HEAD -- src/components/StartScreen.tsx
          git diff --quiet 7ed00b7f28f8c3dd6578932f8e77845e8618d853...HEAD -- src/components/ResultScreen.tsx
          git diff --quiet 7ed00b7f28f8c3dd6578932f8e77845e8618d853...HEAD -- src/components/GameHud.tsx
          grep -Fq 'scoreAttackLiveEngineLifecycle' src/game/EnergySwarmGame.tsx
          ! grep -q 'scoreAttackRuntimeProjectionBundle' src/game/EnergySwarmGame.tsx
          ! grep -q 'scoreAttackRuntimeActivationEnvelope' src/game/EnergySwarmGame.tsx
          ! grep -q 'scoreAttackAttemptFinalizationPlan' src/game/EnergySwarmGame.tsx
          ! grep -q 'scoreAttackStatsCommitApplication' src/game/EnergySwarmGame.tsx
          grep -Fq 'startGameWithMode("CAMPAIGN")' src/game/EnergySwarmGame.tsx
          grep -Fq 'resolveScoreAttackLiveTerminalApplication' src/game/EnergySwarmGame.tsx
          grep -Fq 'changedDedicatedRecord' src/game/EnergySwarmGame.tsx
          ! grep -q 'SCORE_ATTACK' src/components/StartScreen.tsx
          ! grep -q 'SCORE_ATTACK' src/components/ResultScreen.tsx

      - name: Repository smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        shell: bash
        run: |
          set -o pipefail
          npm run test:platform 2>&1 | tee platform-regression.log

      - name: Upload platform regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8o-platform-regression-${{ github.sha }}
          path: platform-regression.log
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8o-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8o-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
