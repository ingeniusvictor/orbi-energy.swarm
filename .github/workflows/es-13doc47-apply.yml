name: ES-13DOC47 Apply

on:
  push:
    branches: [docs/es-13-j8i-closure-j8j-terminal-completion-disposition]
    paths:
      - .github/workflows/es-13doc47-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact J8I ancestry
        run: test "$(git merge-base 9ccec58c5454e25e33cf58d2b4bf6030424f475d HEAD)" = "9ccec58c5454e25e33cf58d2b4bf6030424f475d"

      - name: Apply DOC47 patch fail closed
        run: python scripts/es13doc47_apply.py

      - name: Guard exact documentation scope
        run: |
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          grep -Fq '9ccec58c5454e25e33cf58d2b4bf6030424f475d' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J8J' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'END_SCORE_ATTACK_ATTEMPT' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'advanceInfiniteRuntime: false' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '#4' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#5' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#202' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#248' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#254' docs/PROJECT_CONTINUITY.md
          grep -Fq '#283' docs/PROJECT_CONTINUITY.md
          grep -Fq '## J9 — Boss & Miniboss Expansion' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '## J15' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md

      - name: Commit DOC47 documents
        run: |
          git config user.name ingeniusvictor
          git config user.email ingenius.victor@gmail.com
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'docs(doc47): close J8I and activate J8J terminal disposition'
          git push
