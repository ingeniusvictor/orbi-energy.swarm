name: ES-13DOC51 Apply

on:
  push:
    branches: [docs/es-13-j8m-closure-j8n-stats-commit-application]
    paths:
      - .github/workflows/es-13doc51-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact J8M ancestry
        run: test "$(git merge-base 9ec6a76bf34057881326530af9581e0eca1a0c74 HEAD)" = "9ec6a76bf34057881326530af9581e0eca1a0c74"
      - name: Apply DOC51 patch fail closed
        run: python scripts/es13doc51_apply.py
      - name: Guard exact documentation scope
        run: |
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          grep -Fq '9ec6a76bf34057881326530af9581e0eca1a0c74' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J8N' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'scoreAttackBestScore' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'applyFinalRunCommit' docs/PROJECT_CONTINUITY.md
          grep -Fq '#4' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#5' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#202' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#248' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#254' docs/PROJECT_CONTINUITY.md
          grep -Fq '#283' docs/PROJECT_CONTINUITY.md
          grep -Fq '## J9 — Boss & Miniboss Expansion' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '## J15' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md
      - name: Commit DOC51 documents
        run: |
          git config user.name ingeniusvictor
          git config user.email ingenius.victor@gmail.com
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'docs(doc51): close J8M and activate J8N stats commit'
          git push
