name: ES-13J9A full pre-PR certification

on:
  push:
    branches:
      - es-13j9a-pure-blackout-architect-battlefield-control-profile
    paths:
      - .github/workflows/es-13j9a-certify.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout J9A branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact J9A scope guard
        shell: bash
        run: |
          BASE=abe1ce116f3b92620afa99377008eb38382e56d1
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            .github/workflows/es-13j9a-certify.yml
            src/game/blackoutArchitectProfileContract.ts
            tests/es-13j9a-blackout-architect-profile-contract.test.mjs
            tests/gameplay/blackout-architect-profile-contract.test.ts
          )
          if [ "${#changed[@]}" -ne "${#expected[@]}" ]; then
            echo "Unexpected J9A certification scope count: ${#changed[@]}" >&2
            exit 1
          fi
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null || {
              echo "Missing expected J9A path: $path" >&2
              exit 1
            }
          done
          git diff --check "$BASE"...HEAD
          test -z "$(git diff --name-only "$BASE"...HEAD -- src/game/types.ts src/game/bossChassis.ts src/game/infiniteBossFamily.ts src/game/runtimeMilestoneEncounter.ts src/game/runtimeBossRematchGate.ts src/game/runtimeMinibossGate.ts src/game/EnergySwarmGame.tsx)"
          grep -F 'profileMode: "PROFILE_ONLY"' src/game/blackoutArchitectProfileContract.ts >/dev/null
          grep -F 'ownsProfileDefinitionAuthority: true' src/game/blackoutArchitectProfileContract.ts >/dev/null

      - name: Focused J9A static contract
        run: node --test tests/es-13j9a-blackout-architect-profile-contract.test.mjs

      - name: Focused J9A gameplay contract
        run: npx tsx --test tests/gameplay/blackout-architect-profile-contract.test.ts

      - name: Repository smoke regression
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Upload RC readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j9a-rc-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30

  android-debug:
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout J9A branch
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j9a-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
