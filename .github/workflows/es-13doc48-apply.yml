name: ES-13DOC48 Apply

on:
  push:
    branches: [docs/es-13-j8j-closure-j8k-runtime-projection-isolation]
    paths:
      - .github/workflows/es-13doc48-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact J8J ancestry
        run: test "$(git merge-base 801b09c7ab74db18a3765db4538b8d3b23588062 HEAD)" = "801b09c7ab74db18a3765db4538b8d3b23588062"

      - name: Apply DOC48 patch fail closed
        run: python scripts/es13doc48_apply.py

      - name: Guard exact documentation scope
        run: |
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          grep -Fq '801b09c7ab74db18a3765db4538b8d3b23588062' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J8K' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'Adaptive Invasion' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'Sector 11 / Wave 1' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '#4' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#5' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#202' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#248' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#254' docs/PROJECT_CONTINUITY.md
          grep -Fq '#283' docs/PROJECT_CONTINUITY.md
          grep -Fq '## J9 — Boss & Miniboss Expansion' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '## J15' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md

      - name: Commit DOC48 documents
        run: |
          git config user.name ingeniusvictor
          git config user.email ingenius.victor@gmail.com
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'docs(doc48): close J8J and activate J8K projection isolation'
          git push
