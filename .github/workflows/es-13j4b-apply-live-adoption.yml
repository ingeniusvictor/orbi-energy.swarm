name: ES-13J4B Apply Live Adoption

on:
  push:
    branches:
      - feat/es-13j4b-live-warp-ambusher-adoption
    paths:
      - '.github/workflows/es-13j4b-apply-live-adoption.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact J4B runtime seam
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/game/EnergySwarmGame.tsx")
          source = path.read_text(encoding="utf-8")

          import_old = 'import { resolveEvolvedEnemySpawn } from "./runtimeEnemyEvolution";'
          import_new = import_old + '\nimport { resolveRuntimeTacticalEnemySpawn } from "./runtimeTacticalEnemyAdoption";'

          selection_old = '''    const comp = descriptor.spawn.enemyComposition;
              const type =
                spawningMiniboss && minibossProfile
                  ? minibossProfile.enemyType
                  : forcedType ||
                    (comp[Math.floor(Math.random() * comp.length)] ||
                      EnemyType.CRAWLER);'''

          selection_new = '''    const comp = descriptor.spawn.enemyComposition;
              const tacticalType =
                !spawningMiniboss && !forcedType
                  ? resolveRuntimeTacticalEnemySpawn({
                      descriptor,
                      spawnOrdinal: waveBudgetSpawnedRef.current,
                    })
                  : null;
              const type =
                spawningMiniboss && minibossProfile
                  ? minibossProfile.enemyType
                  : forcedType ||
                    tacticalType ||
                    (comp[Math.floor(Math.random() * comp.length)] ||
                      EnemyType.CRAWLER);'''

          markers = [import_new, 'const tacticalType =', '!tacticalType &&']
          if all(marker in source for marker in markers):
              print("J4B runtime seam already applied; no changes required.")
              raise SystemExit(0)

          for old, new, label in [
              (import_old, import_new, "runtime adoption import"),
              (selection_old, selection_new, "spawn type selection"),
          ]:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one {label} seam, found {count}.")
              source = source.replace(old, new, 1)

          elite_pattern = re.compile(
              r'(?m)^(?P<indent>\s*)const isElite =\n'
              r'(?P=indent)  !spawningMiniboss &&\n'
              r'(?P=indent)  !evolvedProfile &&\n'
              r'(?P=indent)  Math\.random\(\) < effectiveEliteChance;'
          )
          elite_matches = list(elite_pattern.finditer(source))
          if len(elite_matches) != 1:
              raise RuntimeError(
                  f"Expected exactly one elite stacking guard seam, found {len(elite_matches)}."
              )

          def add_tactical_guard(match):
              indent = match.group("indent")
              return (
                  f"{indent}const isElite =\n"
                  f"{indent}  !spawningMiniboss &&\n"
                  f"{indent}  !evolvedProfile &&\n"
                  f"{indent}  !tacticalType &&\n"
                  f"{indent}  Math.random() < effectiveEliteChance;"
              )

          source = elite_pattern.sub(add_tactical_guard, source, count=1)

          path.write_text(source, encoding="utf-8")
          print("Applied exact J4B live adoption seam.")

      - name: Commit branch-only runtime seam
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No runtime patch commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/EnergySwarmGame.tsx
          git commit -m 'ES-13J4B — adopt one live Warp Ambusher slot'
          git push origin HEAD:feat/es-13j4b-live-warp-ambusher-adoption
