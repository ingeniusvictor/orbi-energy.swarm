name: ORBI Android UX03 Launch Accessibility
on:
  push:
    branches: [main, fix/android-ux03-landscape-launch-menu]
    paths:
      - 'src/components/StartScreen.tsx'
      - 'src/styles/androidImmersive.css'
      - 'scripts/android-ux03-launch-browser.mjs'
      - '.github/workflows/android-ux03-launch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/components/StartScreen.tsx'
      - 'src/styles/androidImmersive.css'
      - 'scripts/android-ux03-launch-browser.mjs'
      - '.github/workflows/android-ux03-launch.yml'
permissions:
  contents: read
jobs:
  launch-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Launch layout contract, TypeScript and production web
        run: |
          node --test tests/android-ux03-launch-accessibility.test.mjs
          npm run typecheck
          npm run build
      - name: Install pinned Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real touch mobile landscape first-frame Play and secondary tabs
        run: node scripts/android-ux03-launch-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ux03-launch-${{ github.sha }}
          path: artifacts/android-ux03/
          if-no-files-found: warn
          retention-days: 14
