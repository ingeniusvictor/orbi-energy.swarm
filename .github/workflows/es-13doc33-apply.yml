name: ES-13DOC33 Apply

on:
  push:
    branches:
      - docs/es-13-j6bc-closure-j6bd-activation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/es-13-j6bc-closure-j6bd-activation
          fetch-depth: 0
      - name: Apply DOC33 fail-closed
        run: python scripts/es13doc33_apply.py
      - name: Validate exact DOC33 product scope
        shell: bash
        run: |
          test "$(git diff --name-only HEAD -- | sort | tr '\n' ' ')" = "docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md "
          ! git diff --name-only HEAD -- | grep -E '^(src/|tests/|package|public/|assets/|android/)'
      - name: Commit DOC33 docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m "ES-13DOC33: close J6B-C and activate J6B-D"
          git push origin HEAD:docs/es-13-j6bc-closure-j6bd-activation
