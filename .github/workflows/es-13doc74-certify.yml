name: ES-13DOC74 full docs certification
on:
  push:
    branches:
      - docs/es-13-doc74-b2a-reservation
    paths:
      - '.github/workflows/es-13doc74-certify.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact DOC74 docs-only guard
        shell: bash
        run: |
          BASE=87d7b8ba4a3bac1c37e746590b0b3acb761dc027
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD | sort)
          expected=(
            .github/workflows/es-13doc74-certify.yml
            docs/ES13_GAMEPLAY_ROADMAP.md
            docs/IMPLEMENTATION_LEDGER.md
            docs/PROJECT_CONTINUITY.md
          )
          [ "${#changed[@]}" -eq "${#expected[@]}" ]
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null; done
          git diff --check "$BASE"...HEAD
          test -z "$(git diff --name-only "$BASE"...HEAD -- src tests android package.json package-lock.json)"
          grep -F 'J9L-B2A ISOLATED RESERVATION NEXT' docs/ES13_GAMEPLAY_ROADMAP.md >/dev/null
          grep -F 'ES-13DOC73 — J9L-B1 closure' docs/IMPLEMENTATION_LEDGER.md >/dev/null
          grep -F '39178828240' docs/PROJECT_CONTINUITY.md >/dev/null
          grep -F 'ES-13J9L-B2B — Actual Engine-Owned' docs/PROJECT_CONTINUITY.md >/dev/null
      - run: npm run test:repo
      - run: npm run test:gameplay
      - run: npm run test:platform
      - run: npm run typecheck
      - run: npm run release:verify
      - run: npm run release:evidence:verify
      - run: npm run build
      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: es-13doc74-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30
