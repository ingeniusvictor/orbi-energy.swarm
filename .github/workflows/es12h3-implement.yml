name: ES-12H3 Guarded Implementation

on:
  push:
    branches:
      - feat/es-12h3-endgame-challenge-dyson
    paths-ignore:
      - es12h3-platform.log

permissions:
  contents: write

concurrency:
  group: es12h3-endgame-challenge-dyson
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/es-12h3-endgame-challenge-dyson
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded H3 patch
        run: node scripts/es12h3-apply-v2.mjs

      - name: Repository smoke tests
        run: npm run test:repo

      - name: Gameplay tests
        run: npm run test:gameplay

      - name: Platform tests
        shell: bash
        run: |
          set +e
          npm run test:platform 2>&1 | tee es12h3-platform.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add es12h3-platform.log
            git commit -m "chore: capture ES-12H3 platform failure"
            git push origin HEAD:feat/es-12h3-endgame-challenge-dyson
            exit "$status"
          fi
          rm -f es12h3-platform.log

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/es12h3-implement.yml scripts/es12h3-apply.mjs scripts/es12h3-apply-v2.mjs
          git add src tests docs
          git commit -m "feat(endgame): apply ES-12H3 challenge and Dyson corrections"
          git push origin HEAD:feat/es-12h3-endgame-challenge-dyson
