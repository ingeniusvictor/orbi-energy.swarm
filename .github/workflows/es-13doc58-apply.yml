name: ES-13DOC58 guarded docs applicator

on:
  push:
    branches:
      - docs/es-13-doc58-close-j9d-activate-j9e
    paths:
      - '.github/workflows/es-13doc58-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DOC58 branch
        uses: actions/checkout@v4
        with:
          ref: docs/es-13-doc58-close-j9d-activate-j9e
          fetch-depth: 0

      - name: Apply exact DOC58 patch
        run: python3 scripts/es-13doc58-apply.py

      - name: Verify whitespace and exact docs scope
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            docs/ES13_GAMEPLAY_ROADMAP.md
            docs/IMPLEMENTATION_LEDGER.md
            docs/PROJECT_CONTINUITY.md
          )
          [ "${#changed[@]}" -eq "${#expected[@]}" ]
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null; done
          grep -F 'ACTIVE PROGRAM — J9D DEPLOYED / J9E NEXT' docs/ES13_GAMEPLAY_ROADMAP.md >/dev/null
          grep -F '4bc4d70b1d54217dcbfca1a4745042dbb8770fe6' docs/IMPLEMENTATION_LEDGER.md >/dev/null
          grep -F 'ES-13J9E — Pure Blackout Architect EnemyType Compatibility Mapping Contract' docs/PROJECT_CONTINUITY.md >/dev/null

      - name: Commit and push DOC58 docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m "ES-13DOC58 — close J9D and activate J9E EnemyType mapping"
          git push origin HEAD:docs/es-13-doc58-close-j9d-activate-j9e
