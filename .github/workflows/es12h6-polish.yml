name: ES-12H6 Fallback Safety Certify

on:
  push:
    branches:
      - feat/es-12h6-environmental-mutators
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/es-12h6-environmental-mutators
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make environmental fallback conflict-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/infiniteMutatorDirector.ts')
          text = path.read_text()

          old_line = '    const preferred = firstBiomePreference(biome, candidates);'
          new_line = '''    const preferred =
                firstBiomePreference(biome, candidates) ??
                candidates.find((mutator) => ENVIRONMENTAL_MUTATORS.has(mutator)) ??
                null;'''
          if text.count(old_line) != 1:
              raise SystemExit(f'fail-closed: expected one legacy preference line, found {text.count(old_line)}')
          text = text.replace(old_line, new_line)

          start = '  if (tier !== "MASTERY" && !selected.some((mutator) => ENVIRONMENTAL_MUTATORS.has(mutator))) {'
          end = '  return selected.slice(0, target);'
          if text.count(start) != 1:
              raise SystemExit(f'fail-closed: expected one legacy fallback start, found {text.count(start)}')
          if text.count(end) != 1:
              raise SystemExit(f'fail-closed: expected one return marker, found {text.count(end)}')
          start_index = text.index(start)
          end_index = text.index(end, start_index)
          text = text[:start_index] + text[end_index:]
          path.write_text(text)
          PY
      - name: Add fallback conflict regression
        run: |
          if grep -Fq 'Advanced+ environmental fallback is selected before conflict filtering' tests/infinite-mutator-director.test.ts; then
            echo 'fail-closed: regression test already exists unexpectedly'
            exit 1
          fi
          cat >> tests/infinite-mutator-director.test.ts <<'EOF'

          test("Advanced+ environmental fallback is selected before conflict filtering", () => {
            const selected = directInfiniteMutatorSelection({
              tier: "ENDLESS_ENDGAME",
              biome: BiomeType.DEEP_WATER,
              recoverySector: false,
              targetCount: 3,
              orderedCandidates: [
                "FRAGILE_SWARM",
                "ELECTRICAL_STORM",
                "DOUBLE_THREAT",
                "ELITE_BURST",
              ],
            });

            assert.equal(selected[0], "ELECTRICAL_STORM");
            assert.equal(hasEnvironmentalMutator(selected), true);
            assert.equal(selected.includes("FRAGILE_SWARM"), false);
            assert.ok(countSevereEnvironmentalMutators(selected) <= 1);
          });
          EOF
      - name: Repository Smoke
        run: npm run test:repo
      - name: Gameplay
        run: npm run test:gameplay
      - name: Platform
        run: npm run test:platform
      - name: Typecheck
        run: npm run typecheck
      - name: Production Build
        run: npm run build
      - name: Materialize certified product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/es12h6-polish.yml
          git add src/game/infiniteMutatorDirector.ts tests/infinite-mutator-director.test.ts
          ACTUAL="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' '.github/workflows/es12h6-polish.yml' 'src/game/infiniteMutatorDirector.ts' 'tests/infinite-mutator-director.test.ts' | sort)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo 'fail-closed: unexpected staged paths'
            printf '%s\n' "$ACTUAL"
            exit 1
          fi
          git commit -m "fix(h6): make environmental fallback conflict-safe"
          git push origin HEAD:feat/es-12h6-environmental-mutators
