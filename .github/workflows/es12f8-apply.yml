name: ES-12F8 Apply

on:
  push:
    branches:
      - feat/es-12f8-unique-energy-attacks

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[apply-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/es-12f8-unique-energy-attacks
          fetch-depth: 0
      - name: Apply unique attack source patch
        run: python .github/es12f8-apply.py
      - name: Commit patched sources
        run: |
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(orbi): wire unique attack behavior and VFX ES-12F8 [apply-done]"
          git push origin HEAD:feat/es-12f8-unique-energy-attacks
