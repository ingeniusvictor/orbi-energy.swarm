name: ES-12H7 Platform Adoption Diagnostic

on:
  push:
    branches:
      - feat/es-12h7-titan-core-chassis
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/es-12h7-titan-core-chassis
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bound defeat patch to rematch branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/es12h7-apply.py")
          t = p.read_text()
          old = 'defeat_end = "      bossSessionEndTimeRef.current = Date.now();"'
          new = 'defeat_end = "      enterInfiniteAfterCampaignVictory();"'
          if t.count(old) != 1:
              raise SystemExit(f"fail-closed defeat_end marker count={t.count(old)}")
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Apply literal H7 patcher
        run: python scripts/es12h7-apply.py
      - name: Align historical platform adoption contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"fail-closed {label}: expected 1, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/game/EnergySwarmGame.tsx",
              "  // --- SPAWN SHARED BOSS CHASSIS ---",
              "  // --- SPAWN GIANT DEVOURER BOSS ---\n  // Legacy section boundary retained; H7 routes this boundary through the shared chassis engine.\n  // --- SPAWN SHARED BOSS CHASSIS ---",
              "legacy spawn section boundary",
          )

          replace_once(
              "tests/live-infinite-record-adoption.test.ts",
              '''  const clear = defeat.indexOf(\n    "bossRef.current = null",\n  );''',
              '''  const clear = defeat.indexOf(\n    "bossRef.current = null",\n    persist,\n  );''',
              "post-persist boss cleanup lookup",
          )

          replace_once(
              "tests/player-contact-spatial-optimization.test.ts",
              r'/shieldCollisionRadius = 14 \+ proj\.size/',
              r'/shieldCollisionRadius = node\.collisionRadius \+ proj\.size/',
              "profile-driven weakpoint collision assertion",
          )

          rematch_test = "tests/runtime-boss-rematch-adoption.test.ts"
          replace_once(
              rematch_test,
              r'/milestoneDamageMultiplier:[\s\S]*rematchProfile\?\.damageMultiplier/',
              r'/const damageMultiplier =[\s\S]*rematchProfile\?\.damageMultiplier[\s\S]*milestoneDamageMultiplier: damageMultiplier/',
              "profile-driven rematch damage assertion",
          )
          replace_once(
              rematch_test,
              r'/milestoneAttackRateMultiplier:[\s\S]*rematchProfile\?\.attackRateMultiplier/',
              r'/const attackRateMultiplier =[\s\S]*rematchProfile\?\.attackRateMultiplier[\s\S]*milestoneAttackRateMultiplier: attackRateMultiplier/',
              "profile-driven rematch attack-rate assertion",
          )
          replace_once(
              rematch_test,
              r'/milestoneRewardMultiplier:[\s\S]*rematchProfile\?\.rewardMultiplier/',
              r'/const rewardMultiplier =[\s\S]*rematchProfile\?\.rewardMultiplier[\s\S]*milestoneRewardMultiplier: rewardMultiplier/',
              "profile-driven rematch reward assertion",
          )

          old_health = r'/BLACKOUT_DEVOURER_CANON\.maxHealth \*[\s\S]*\(rematchProfile\?\.healthMultiplier \?\? 1\)/'
          new_health = r'/chassisProfile\.baseHealth \* healthMultiplier/'
          for path in (
              "tests/runtime-combat-mutator-adoption.test.ts",
              "tests/runtime-combat-pressure-adoption.test.ts",
              "tests/runtime-miniboss-adoption.test.ts",
          ):
              replace_once(path, old_health, new_health, f"shared chassis health assertion {path}")
          PY
      - name: Capture Platform
        shell: bash
        run: |
          set +e
          npm run test:platform > platform.log 2>&1
          STATUS=$?
          cat platform.log
          printf '%s\n' "$STATUS" > platform.status
          exit 0
      - name: Upload platform diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es12h7-platform-diagnostic
          path: |
            platform.log
            platform.status
          if-no-files-found: error
          retention-days: 1
      - name: Preserve platform result
        shell: bash
        run: |
          STATUS="$(cat platform.status)"
          if [ "$STATUS" -ne 0 ]; then
            echo "Platform failed with exit code $STATUS"
            exit "$STATUS"
          fi
