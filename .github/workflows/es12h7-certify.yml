name: ES-12H7 Literal Smoke Diagnostic

on:
  push:
    branches:
      - feat/es-12h7-titan-core-chassis
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/es-12h7-titan-core-chassis
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bound defeat patch to rematch branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/es12h7-apply.py")
          t = p.read_text()
          old = 'defeat_end = "      bossSessionEndTimeRef.current = Date.now();"'
          new = 'defeat_end = "      enterInfiniteAfterCampaignVictory();"'
          if t.count(old) != 1:
              raise SystemExit(f"fail-closed defeat_end marker count={t.count(old)}")
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Apply literal H7 patcher
        run: python scripts/es12h7-apply.py
      - name: Capture Repository Smoke
        shell: bash
        run: |
          set +e
          npm run test:repo > smoke.log 2>&1
          STATUS=$?
          cat smoke.log
          printf '%s\n' "$STATUS" > smoke.status
          exit 0
      - name: Upload smoke diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es12h7-smoke-diagnostic
          path: |
            smoke.log
            smoke.status
          if-no-files-found: error
          retention-days: 1
      - name: Preserve smoke result
        shell: bash
        run: |
          STATUS="$(cat smoke.status)"
          if [ "$STATUS" -ne 0 ]; then
            echo "Repository Smoke failed with exit code $STATUS"
            exit "$STATUS"
          fi
