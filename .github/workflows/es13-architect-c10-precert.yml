name: ES-13 Architect C10 temporary full pre-cert
on:
  push:
    branches: ['feat/es13-architect-qa-touch-controls-c10']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Authorized C10 files only
        shell: bash
        run: |
          git diff --name-only befe99d6bbb95c33b48ec94a0ea3f99d9055c5c5 HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/es13-architect-c10-precert.yml' \
            'src/game/EnergySwarmGame.tsx' \
            'src/game/blackoutArchitectDevQaTouchAccess.ts' \
            'tests/es-13j9lb2b2b2b2c10-dev-touch-controls.test.mjs' \
            'tests/gameplay/blackout-architect-dev-touch-controls.test.ts' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - run: npm ci
      - name: Focused real Architect C5-C10 and J2
        run: |
          node --test tests/es-13j9lb2b2b2b2c5-grid-lock.test.mjs tests/es-13j9lb2b2b2b2c6-vector-tide.test.mjs tests/es-13j9lb2b2b2b2c7-sector-wall.test.mjs tests/es-13j9lb2b2b2b2c8-pattern-director.test.mjs tests/es-13j9lb2b2b2b2c9-integrated-qa-hud.test.mjs tests/es-13j9lb2b2b2b2c10-dev-touch-controls.test.mjs tests/es-13j2b-live-overdrive-adoption.test.mjs
          npx tsx --test tests/gameplay/blackout-architect-dev-grid-lock.test.ts tests/gameplay/blackout-architect-dev-vector-tide.test.ts tests/gameplay/blackout-architect-dev-sector-wall.test.ts tests/gameplay/blackout-architect-dev-pattern-director.test.ts tests/gameplay/blackout-architect-dev-integrated-hud.test.ts tests/gameplay/blackout-architect-dev-touch-controls.test.ts
      - name: Complete repository gameplay and platform tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Release and evidence
        run: |
          npm run release:verify
          npm run release:evidence:verify
      - name: Web build and readiness
        run: |
          npm run build
          npm run release:readiness -- --output release-readiness.json
      - name: Android APK
        run: npm run android:debug
      - name: Android APK verification
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: es13-c10-precert-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
