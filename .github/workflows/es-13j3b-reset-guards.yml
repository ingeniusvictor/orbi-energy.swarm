name: ES-13J3B Reset Ownership Guards

on:
  push:
    branches:
      - feat/es-13j3b-live-enemy-formation-director

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded reset patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/game/EnergySwarmGame.tsx")
          source = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              "    currentWaveRef.current = 1;\n    runtimeProgressionRef.current = createCampaignRuntimeState(1);\n    waveActiveRef.current = false;",
              "    currentWaveRef.current = 1;\n    runtimeProgressionRef.current = createCampaignRuntimeState(1);\n    waveActiveRef.current = false;\n    enemyFormationDirectorRef.current =\n      createLiveEnemyFormationDirectorState();",
              "fresh-run formation reset",
          )

          replace_once(
              "  ) => {\n    enemiesRef.current = [];\n    hazardZonesRef.current = [];",
              "  ) => {\n    enemiesRef.current = [];\n    enemyFormationDirectorRef.current =\n      createLiveEnemyFormationDirectorState();\n    hazardZonesRef.current = [];",
              "boss-transition formation reset",
          )

          path.write_text(source)
          PY

      - name: Verify patch scope
        shell: bash
        run: |
          test "$(git diff --name-only)" = "src/game/EnergySwarmGame.tsx"
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Repository contract tests
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Typecheck
        run: npm run typecheck

      - name: Commit reset guards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/EnergySwarmGame.tsx
          git commit -m "fix(j3b): reset formation ownership across run and boss boundaries"
          git push origin HEAD:feat/es-13j3b-live-enemy-formation-director
