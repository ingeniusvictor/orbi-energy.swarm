name: EV-F06 EVO8 Canvas Visual Proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/game/formations.ts'
      - 'src/game/EnergySwarmGame.tsx'
      - 'src/game/EnergySwarmCanvas.tsx'
      - 'src/game/gaiaEvolution.ts'
      - 'src/game/orbiEvolution.ts'
      - 'src/game/evo8SwarmDoctrine.ts'
      - 'scripts/ev-f06-evo8-visual-browser.mjs'
      - 'tests/ev-f08-delta-wing-clearance.test.ts'
      - '.github/workflows/ev-f06-evo8-visual.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/EnergySwarmGame.tsx'
      - 'src/game/EnergySwarmCanvas.tsx'
      - 'src/game/gaiaEvolution.ts'
      - 'scripts/ev-f06-evo8-visual-browser.mjs'
      - '.github/workflows/ev-f06-evo8-visual.yml'
permissions:
  contents: read
jobs:
  evo8-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate EVO8 module and full build
        run: |
          npm run typecheck
          npm run build
          npx tsx --test tests/orbi-evo8-contract.test.ts tests/gaia-evolution.test.ts tests/evo8-swarm-doctrine.test.ts tests/ev-f08-delta-wing-clearance.test.ts tests/ev-f01-formations-geometry.test.ts
      - name: Actual canvas renderer screenshots (synthetic Orbi layouts, not real encounters)
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          node scripts/ev-f06-evo8-visual-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ev-f06-evo8-canvas-${{ github.sha }}
          path: artifacts/ev-f06/
          retention-days: 14
          if-no-files-found: warn
