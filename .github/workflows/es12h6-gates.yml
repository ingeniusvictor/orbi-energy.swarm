name: ES-12H6 Platform Trace

on:
  push:
    branches:
      - feat/es-12h6-environmental-mutators
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-platform-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Trace exact source
        run: |
          echo '=== INFINITE FILES ==='
          find tests -maxdepth 2 -type f -iname '*infinite*' -print | sort
          echo '=== ASSERTION ==='
          grep -R -n -F 'recipe.mutators.length >= 1' tests || true
          echo '=== TITLE ==='
          grep -R -n -F 'sector recipes are deterministic, bounded, and milestone-aware' tests || true
          echo '=== ALL MUTATOR LENGTH ASSERTIONS ==='
          grep -R -n -F 'mutators.length' tests | head -80 || true
      - run: npm run test:platform
