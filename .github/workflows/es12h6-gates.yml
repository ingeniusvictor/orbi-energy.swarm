name: ES-12H6 Guarded Certification

on:
  push:
    branches:
      - feat/es-12h6-environmental-mutators
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: es12h6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact historical recovery contract fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/infinite-director.test.mjs')
          old = '''    assert.ok(\n      recipe.mutators.length >= 1 && recipe.mutators.length <= 4,\n    );'''
          new = '''    if (recipe.recoverySector) {\n      assert.deepEqual(recipe.mutators, []);\n    } else {\n      assert.ok(\n        recipe.mutators.length >= 1 && recipe.mutators.length <= 4,\n      );\n    }'''
          text = path.read_text()
          if text.count(old) != 1:
              raise SystemExit(f'fail-closed: expected historical assertion exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - run: npm run test:repo

  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:gameplay

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact historical recovery contract fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/infinite-director.test.mjs')
          old = '''    assert.ok(\n      recipe.mutators.length >= 1 && recipe.mutators.length <= 4,\n    );'''
          new = '''    if (recipe.recoverySector) {\n      assert.deepEqual(recipe.mutators, []);\n    } else {\n      assert.ok(\n        recipe.mutators.length >= 1 && recipe.mutators.length <= 4,\n      );\n    }'''
          text = path.read_text()
          if text.count(old) != 1:
              raise SystemExit(f'fail-closed: expected historical assertion exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - run: npm run test:platform

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  materialize-clean-contract:
    needs: [repository-smoke, gameplay, platform, typecheck, production-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/es-12h6-environmental-mutators
      - name: Materialize exact historical recovery contract fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/infinite-director.test.mjs')
          old = '''    assert.ok(\n      recipe.mutators.length >= 1 && recipe.mutators.length <= 4,\n    );'''
          new = '''    if (recipe.recoverySector) {\n      assert.deepEqual(recipe.mutators, []);\n    } else {\n      assert.ok(\n        recipe.mutators.length >= 1 && recipe.mutators.length <= 4,\n      );\n    }'''
          text = path.read_text()
          if text.count(old) != 1:
              raise SystemExit(f'fail-closed: expected historical assertion exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- tests/infinite-director.test.mjs
      - name: Commit certified contract alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/infinite-director.test.mjs
          git diff --cached --check
          git commit -m "test(h6): align recovery-clear historical contract"
          git push origin HEAD:feat/es-12h6-environmental-mutators
