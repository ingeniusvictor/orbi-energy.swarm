name: ES-12H6 Guarded Certification

on:
  push:
    branches:
      - feat/es-12h6-environmental-mutators
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: es12h6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:repo

  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:gameplay

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Locate historical mutator assertion
        run: |
          echo "=== tracked candidate ==="
          git ls-files 'tests/*infinite*' || true
          echo "=== assertion search after npm ci ==="
          grep -R -n -F 'recipe.mutators.length >= 1' tests . --exclude-dir=node_modules --exclude-dir=.git || true
          echo "=== matching test title ==="
          grep -R -n -F 'sector recipes are deterministic, bounded, and milestone-aware' tests . --exclude-dir=node_modules --exclude-dir=.git || true
      - run: npm run test:platform

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build