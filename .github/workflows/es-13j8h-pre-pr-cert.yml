name: ES-13J8H Pre-PR Certification

on:
  push:
    branches: [es-13j8h-pure-score-attack-bootstrap-envelope]
    paths:
      - .github/workflows/es-13j8h-pre-pr-cert.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard exact J8H scope and frozen seams
        run: |
          test "$(git merge-base 0557f91982534248765f2a5f7e5a2648f99ba58a HEAD)" = "0557f91982534248765f2a5f7e5a2648f99ba58a"
          printf '%s\n' \
            .github/workflows/es-13j8h-pre-pr-cert.yml \
            src/game/scoreAttackBootstrapEnvelope.ts \
            tests/es-13j8h-score-attack-bootstrap-envelope.test.mjs \
            tests/gameplay/score-attack-bootstrap-envelope.test.ts > /tmp/expected
          git diff --name-only 0557f91982534248765f2a5f7e5a2648f99ba58a...HEAD | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --quiet 0557f91982534248765f2a5f7e5a2648f99ba58a...HEAD -- src/game/runtimeProgressionRouter.ts
          git diff --quiet 0557f91982534248765f2a5f7e5a2648f99ba58a...HEAD -- src/game/infiniteSession.ts
          git diff --quiet 0557f91982534248765f2a5f7e5a2648f99ba58a...HEAD -- src/game/scoreAttackRunRecipe.ts
          git diff --quiet 0557f91982534248765f2a5f7e5a2648f99ba58a...HEAD -- src/game/scoreAttackExecutionSubstrateContract.ts
          git diff --quiet 0557f91982534248765f2a5f7e5a2648f99ba58a...HEAD -- src/game/scoreAttackTimeboxProjection.ts
          git diff --quiet 0557f91982534248765f2a5f7e5a2648f99ba58a...HEAD -- src/game/EnergySwarmGame.tsx
          git diff --quiet 0557f91982534248765f2a5f7e5a2648f99ba58a...HEAD -- src/game/runPersistence.ts
          grep -Fq 'resolveScoreAttackCanonicalRunRecipe' src/game/scoreAttackBootstrapEnvelope.ts
          grep -Fq 'createInfiniteSession(recipe.seed, recipe.context)' src/game/scoreAttackBootstrapEnvelope.ts
          grep -Fq 'createInfiniteRuntimeState(session)' src/game/scoreAttackBootstrapEnvelope.ts
          grep -Fq 'preservesCanonicalModeIdentityOutsideRuntimeDiscriminator: true' src/game/scoreAttackBootstrapEnvelope.ts
          grep -Fq 'addsRuntimeProgressionDiscriminator: false' src/game/scoreAttackBootstrapEnvelope.ts
          ! grep -Eq 'advanceInfiniteSession|advanceInfiniteRuntimeState|endInfiniteSession|localStorage|sessionStorage|applyFinalRunCommit|Date\.now|performance\.now|Math\.random' src/game/scoreAttackBootstrapEnvelope.ts
          ! grep -q 'SCORE_ATTACK' src/game/runtimeProgressionRouter.ts

      - name: Repository smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8h-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8h-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
