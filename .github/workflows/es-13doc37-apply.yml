name: ES-13DOC37 Apply

on:
  push:
    branches:
      - docs/es-13-j7c-closure-j7d-activation
    paths:
      - scripts/es13doc37_apply.py
      - .github/workflows/es-13doc37-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/es-13-j7c-closure-j7d-activation
          fetch-depth: 0
      - name: Apply DOC37 fail-closed
        run: python scripts/es13doc37_apply.py
      - name: Validate exact DOC37 product scope and preservation
        run: |
          set -euo pipefail
          git diff --name-only 1ad86de5155a3e6e73630e5244f7ce7ec107f4af -- \
            ':!.github/workflows/es-13doc37-apply.yml' ':!scripts/es13doc37_apply.py' | sort > /tmp/files.txt
          printf '%s\n' \
            docs/ES13_GAMEPLAY_ROADMAP.md \
            docs/IMPLEMENTATION_LEDGER.md \
            docs/PROJECT_CONTINUITY.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt
          grep -Fq '#4' docs/PROJECT_CONTINUITY.md
          grep -Fq '#5' docs/PROJECT_CONTINUITY.md
          grep -Fq '#202' docs/PROJECT_CONTINUITY.md
          grep -Fq '#248' docs/PROJECT_CONTINUITY.md
          grep -Fq '#254' docs/PROJECT_CONTINUITY.md
          grep -Fq '#283' docs/PROJECT_CONTINUITY.md
          grep -Fq '## J8 — Additional Game Modes' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-13J7D' docs/PROJECT_CONTINUITY.md
      - name: Commit DOC37 docs
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'ES-13DOC37: close J7C and activate J7D discovery'
          git push origin HEAD:docs/es-13-j7c-closure-j7d-activation
