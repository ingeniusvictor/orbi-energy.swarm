name: ES-12H11 Guarded Certification

on:
  push:
    branches:
      - feat/es-12h11-photo-mode-filters

permissions:
  contents: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply H11 literal patch
        run: python3 scripts/es12h11-apply.py

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay
        run: npm run test:gameplay

      - name: Platform
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Production Build
        run: npm run build

      - name: Verify bounded H11 diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD -- \
            src/game/EnergySwarmGame.tsx \
            src/styles/index.css \
            tests/photo-mode.test.ts
          unexpected="$(git diff --name-only HEAD | grep -Ev '^(src/game/EnergySwarmGame.tsx|src/styles/index.css|tests/photo-mode.test.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected patched paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Materialize clean H11 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/es12h11-apply.py .github/workflows/es12h11-certify.yml
          git add \
            src/game/photoMode.ts \
            src/components/PhotoModeOverlay.tsx \
            tests/photo-mode-filters.test.ts \
            src/game/EnergySwarmGame.tsx \
            src/styles/index.css \
            tests/photo-mode.test.ts \
            scripts/es12h11-apply.py \
            .github/workflows/es12h11-certify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(h11): complete photo mode cinematic filters"
          git push origin HEAD:feat/es-12h11-photo-mode-filters
