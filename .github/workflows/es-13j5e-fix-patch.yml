name: ES-13J5E Fix Patch

on:
  push:
    branches:
      - es-13j5e-controlled-live-command-link-detach
    paths:
      - '.github/workflows/es-13j5e-fix-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: es-13j5e-controlled-live-command-link-detach
          fetch-depth: 0

      - name: Apply guarded J5E correction
        run: python .github/es13j5e_fix.py

      - name: Verify exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          [[ "${#changed[@]}" -eq 1 ]]
          [[ "${changed[0]}" == "src/game/EnergySwarmGame.tsx" ]]
          grep -q 'resolveLiveCommandLinkBreakIntent' src/game/EnergySwarmGame.tsx
          if grep -q 'commandLinkBreakResolution' src/game/EnergySwarmGame.tsx; then exit 1; fi
          grep -q 'detachedPendingCommandLink = true' src/game/EnergySwarmGame.tsx

      - name: Commit exact product correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/EnergySwarmGame.tsx
          git commit -m 'ES-13J5E: preserve J5D boundary and retain unapplied detach intent'
          git push origin HEAD:es-13j5e-controlled-live-command-link-detach
