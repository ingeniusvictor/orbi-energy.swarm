name: ES-13J2E Overdrive Integration Certification

on:
  push:
    branches:
      - test/es-13j2e-overdrive-integration

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness remains fail-closed
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Build Android debug APK
        env:
          ORBI_BUILD_SHA: ${{ github.sha }}
        run: npm run android:debug

      - name: Verify Android APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: J2E scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 95beb172e845794d03484e446128896a44428996...HEAD | sort -u > /tmp/j2e-files.txt
          cat /tmp/j2e-files.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .github/workflows/es-13j2e-certify.yml|tests/gameplay/overdrive-integration.test.ts|tests/es-13j2e-overdrive-integration-adoption.test.mjs) ;;
              *) echo "Unexpected J2E scope: $file" >&2; exit 1 ;;
            esac
          done < /tmp/j2e-files.txt
