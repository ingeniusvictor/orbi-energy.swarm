name: ES-13DOC42 Apply

on:
  push:
    branches:
      - docs/es-13-j8d-closure-j8e-storage-schema
    paths:
      - scripts/es13doc42_apply.py
      - .github/workflows/es-13doc42-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/es-13-j8d-closure-j8e-storage-schema
          fetch-depth: 0
      - name: Apply DOC42 fail-closed
        run: python scripts/es13doc42_apply.py
      - name: Validate exact DOC42 scope and preservation
        run: |
          set -euo pipefail
          git diff --name-only de37f4a818b05b09c136617b71cf3620bf4e1e83 -- \
            ':!.github/workflows/es-13doc42-apply.yml' ':!scripts/es13doc42_apply.py' | sort > /tmp/files.txt
          printf '%s\n' \
            docs/ES13_GAMEPLAY_ROADMAP.md \
            docs/IMPLEMENTATION_LEDGER.md \
            docs/PROJECT_CONTINUITY.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt
          grep -Fq '#4' docs/PROJECT_CONTINUITY.md
          grep -Fq '#5' docs/PROJECT_CONTINUITY.md
          grep -Fq '#202' docs/PROJECT_CONTINUITY.md
          grep -Fq '#248' docs/PROJECT_CONTINUITY.md
          grep -Fq '#254' docs/PROJECT_CONTINUITY.md
          grep -Fq '#283' docs/PROJECT_CONTINUITY.md
          grep -Fq 'J3C-C' docs/PROJECT_CONTINUITY.md
          grep -Fq 'J4D+' docs/PROJECT_CONTINUITY.md
          grep -Fq '## J9 — Boss & Miniboss Expansion' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'de37f4a818b05b09c136617b71cf3620bf4e1e83' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J8E' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J8E' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq 'ES-13J8E' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'scoreAttackBestScore' docs/PROJECT_CONTINUITY.md
          grep -Fq 'scoreAttackBestScore' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq 'scoreAttackBestScore' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'Number.MAX_SAFE_INTEGER' docs/PROJECT_CONTINUITY.md
          grep -Fq 'orbi_energy_swarm_stats_v2' docs/ES13_GAMEPLAY_ROADMAP.md
      - name: Commit DOC42 docs
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'ES-13DOC42: close J8D and activate J8E storage schema'
          git push origin HEAD:docs/es-13-j8d-closure-j8e-storage-schema
