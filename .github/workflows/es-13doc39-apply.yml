name: ES-13DOC39 Apply

on:
  push:
    branches:
      - docs/es-13-j8a-closure-j8b-substrate
    paths:
      - scripts/es13doc39_apply.py
      - .github/workflows/es-13doc39-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/es-13-j8a-closure-j8b-substrate
          fetch-depth: 0
      - name: Apply DOC39 fail-closed
        run: python scripts/es13doc39_apply.py
      - name: Validate exact DOC39 scope and preservation
        run: |
          set -euo pipefail
          git diff --name-only 4a78c942a3ebdb509f67185d6799b0724ac27238 -- \
            ':!.github/workflows/es-13doc39-apply.yml' ':!scripts/es13doc39_apply.py' | sort > /tmp/files.txt
          printf '%s\n' \
            docs/ES13_GAMEPLAY_ROADMAP.md \
            docs/IMPLEMENTATION_LEDGER.md \
            docs/PROJECT_CONTINUITY.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt

          check() {
            local pattern="$1"
            local file="$2"
            local label="$3"
            if grep -Fq "$pattern" "$file"; then
              echo "PRESERVED: $label"
            else
              echo "MISSING: $label :: $pattern :: $file"
              exit 1
            fi
          }

          check '#4' docs/PROJECT_CONTINUITY.md 'manual blocker #4'
          check '#5' docs/PROJECT_CONTINUITY.md 'manual blocker #5'
          check '#202' docs/PROJECT_CONTINUITY.md 'manual blocker #202'
          check '#248' docs/PROJECT_CONTINUITY.md 'manual blocker #248'
          check '#254' docs/PROJECT_CONTINUITY.md 'resolved diagnostic #254'
          check '#283' docs/PROJECT_CONTINUITY.md 'resolved diagnostic #283'
          check 'J3C-C' docs/PROJECT_CONTINUITY.md 'J3C-C deferred state'
          check 'J4D+' docs/PROJECT_CONTINUITY.md 'J4D+ deferred state'
          check '## J9 — Boss & Miniboss Expansion' docs/ES13_GAMEPLAY_ROADMAP.md 'J9 roadmap preservation'
          check 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md 'ES-14 roadmap preservation'
          check '4a78c942a3ebdb509f67185d6799b0724ac27238' docs/PROJECT_CONTINUITY.md 'J8A canonical evidence'
          check 'ES-13J8B' docs/PROJECT_CONTINUITY.md 'J8B continuity activation'
          check 'ES-13J8B' docs/IMPLEMENTATION_LEDGER.md 'J8B ledger activation'
          check 'ES-13J8B' docs/ES13_GAMEPLAY_ROADMAP.md 'J8B roadmap activation'
      - name: Commit DOC39 docs
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'ES-13DOC39: close J8A and activate J8B substrate discovery'
          git push origin HEAD:docs/es-13-j8a-closure-j8b-substrate
