name: ES-13DOC20 Pre-PR Certification

on:
  push:
    branches:
      - docs/es-13-j5a-closure-j5b-activation
    paths:
      - '.github/workflows/es-13doc20-docs-patch.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: df60f62565a1d3cdf6058d2e1a4049f5870f27b7
      ORBI_RELEASE_SHA: ${{ github.sha }}
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay
        run: npm run test:gameplay

      - name: Platform
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release Contract
        run: npm run release:verify

      - name: Manual dossier
        run: npm run release:evidence:verify

      - name: Production Build
        run: npm run build

      - name: RC readiness fail-closed
        run: npm run release:readiness -- --output release-readiness.json

      - name: DOC20 docs-only scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" HEAD

          mapfile -t actual < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          expected=(
            ".github/es13doc20_patch.py"
            ".github/workflows/es-13doc20-docs-patch.yml"
            "docs/ES13_GAMEPLAY_ROADMAP.md"
            "docs/IMPLEMENTATION_LEDGER.md"
            "docs/PROJECT_CONTINUITY.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)

          if [[ "${#actual[@]}" -ne "${#expected_sorted[@]}" ]]; then
            printf 'Unexpected changed-file count.\nExpected:\n%s\nActual:\n%s\n' \
              "$(printf '%s\n' "${expected_sorted[@]}")" \
              "$(printf '%s\n' "${actual[@]}")"
            exit 1
          fi

          for i in "${!expected_sorted[@]}"; do
            if [[ "${actual[$i]}" != "${expected_sorted[$i]}" ]]; then
              printf 'Scope mismatch at index %s: expected %s, got %s\n' \
                "$i" "${expected_sorted[$i]}" "${actual[$i]}"
              exit 1
            fi
          done

          git diff --quiet "$BASE_SHA" HEAD -- \
            src \
            tests \
            android \
            public \
            package.json \
            package-lock.json
