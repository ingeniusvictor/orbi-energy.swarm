name: ES-13DOC20 Docs Patch

on:
  push:
    branches:
      - docs/es-13-j5a-closure-j5b-activation
    paths:
      - '.github/es13doc20_patch.py'
      - '.github/workflows/es-13doc20-docs-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: df60f62565a1d3cdf6058d2e1a4049f5870f27b7
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/es-13-j5a-closure-j5b-activation

      - name: Apply guarded DOC20 patch
        run: python .github/es13doc20_patch.py

      - name: Validate diff and scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            "docs/ES13_GAMEPLAY_ROADMAP.md"
            "docs/IMPLEMENTATION_LEDGER.md"
            "docs/PROJECT_CONTINUITY.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          if [[ "${#changed[@]}" -ne "${#expected_sorted[@]}" ]]; then
            printf 'Unexpected patch scope.\nExpected:\n%s\nActual:\n%s\n' \
              "$(printf '%s\n' "${expected_sorted[@]}")" \
              "$(printf '%s\n' "${changed[@]}")"
            exit 1
          fi
          for i in "${!expected_sorted[@]}"; do
            [[ "${changed[$i]}" == "${expected_sorted[$i]}" ]]
          done

      - name: Commit documentation patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_CONTINUITY.md docs/IMPLEMENTATION_LEDGER.md docs/ES13_GAMEPLAY_ROADMAP.md
          git commit -m "ES-13DOC20: close J5A and activate J5B"
          git push origin HEAD:docs/es-13-j5a-closure-j5b-activation
