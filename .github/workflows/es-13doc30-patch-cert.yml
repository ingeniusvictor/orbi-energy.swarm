name: ES-13DOC30 Patch and Certification

on:
  push:
    branches:
      - docs/es-13-j6a-closure-j6ba-activation
    paths:
      - '.github/workflows/es-13doc30-patch-cert.yml'

permissions:
  contents: write

jobs:
  patch-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 69ac8a1a83d2f6bbe6a989a3a819fac438e854c1
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/es-13-j6a-closure-j6ba-activation

      - name: Apply DOC30 exact anchored patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old, new, 1)

          def replace_regex(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, got {count}")
              return updated

          # ROADMAP
          p = Path('docs/ES13_GAMEPLAY_ROADMAP.md')
          s = p.read_text()
          replacement = '''### J6A — Pure Dynamic Mid-Sector Event Opportunity Contract
          Status: **DEPLOYED / FROZEN**
          Canonical: `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`
          Issue #375 / PR #376

          Certified behavior:
          - Infinite-only and bounded to certified wave counts 3–7;
          - Campaign, recovery sectors, milestone waves, first/final waves and malformed facts fail closed;
          - exactly one interior opportunity wave is selected deterministically per valid sector identity from existing `seed + recipeId + sector + waveCount` facts;
          - output is immutable `DYNAMIC_MID_SECTOR_EVENT_OPPORTUNITY` / `OPPORTUNITY_ONLY` metadata;
          - no event identity/profile, live effect, environmental/mutator mutation, spawn/progression, entity/projectile collection, combat/economy, entity lookup/scan, timer/RNG or cap/budget authority;
          - existing Infinite and environmental authorities remain unchanged.

          Exact deployment anchors:
          - DOC29 baseline `0dca89678698be0557f0500590f27c9f53ab1548`;
          - pre-PR `8dd38514738e0873364851bea472413b44b5539c`, run `38741496798` / job `116444066588` GREEN including exact scope + Android APK;
          - final PR #376 head `38a8e76c147ca682143e44f2cd57dca0d0bc54af`;
          - PR CI `38780778121` / `116580097952` GREEN; Android `38780778404` / `116580099652` GREEN;
          - canonical `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`, parent `0dca89678698be0557f0500590f27c9f53ab1548`, tree `d3aac694e27af9c4fddcbce7c07d6766c84f1146`;
          - main CI `38781077090` / `116581119711` GREEN; Android `38781076913` / `116581119364` GREEN;
          - Pages `38781193209`, build `116581519042` + deploy `116581668287` GREEN.

          ### J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract
          Status: **NEXT ACTIVE ENGINEERING SLICE AFTER DOC30 CLOSURE**

          Architecture discovery found no existing J6 event identity catalog. Existing `infiniteMutatorDirector`, `runtimeMutatorEffects` and `runtimeEnvironmentalFields` already own environmental selection/effects and must not be duplicated.

          Initial bounded identity vocabulary:
          - `SOLAR_STORM`;
          - `QUANTUM_RIFT`;
          - `BLACKOUT_SURGE`;
          - `CRYSTAL_RUSH`;
          - `DYSON_ECLIPSE`.

          Required direction:
          - pure immutable/fail-closed identity profiles only;
          - deterministic exact lookup by supported event ID;
          - semantic/display/tactical metadata only, with explicit `IDENTITY_ONLY` / zero-live-authority semantics;
          - no opportunity selection, event execution, mutator/effect mapping or runtime adoption;
          - no import/adoption by J6A, Infinite directors, mutator directors, environmental runtime files or `EnergySwarmGame.tsx`;
          - no spawn/progression, entity/projectile collection, damage/defeat, score/reward/economy, lookup/scan, clock/timer/RNG, cap/budget or entity create/remove/mutate authority;
          - unsupported IDs fail closed;
          - objective/spawn-heavy events remain deferred until dedicated mechanics justify them;
          - deterministic event selection remains J6B-B+; live effect mapping remains later and must reuse existing certified environmental authorities.

          '''
          s = replace_regex(
              s,
              r'### J6A — Pure Dynamic Mid-Sector Event Opportunity Contract\n.*?(?=## J7 — Bonus Challenge Rounds)',
              replacement,
              'roadmap J6A/J6B-A',
          )
          p.write_text(s)

          # LEDGER
          p = Path('docs/IMPLEMENTATION_LEDGER.md')
          s = p.read_text()
          j5fe = '| ES-13J5F-E — Controlled Live Command-Link Disruption Pulse Application | DEPLOYED / FROZEN | `9554358005d6d092341f4f65d8b986090307f8b5` | #371 | #372 |'
          j6a = '| ES-13J6A — Pure Dynamic Mid-Sector Event Opportunity Contract | DEPLOYED / FROZEN | `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1` | #375 | #376 |'
          s = replace_exact(s, j5fe, j5fe + '\n' + j6a, 'ledger J6A milestone row')

          evidence = '''### J6A — Pure Dynamic Mid-Sector Event Opportunity Contract
          Certified behavior:
          - Infinite-only, certified wave range 3–7 and one deterministic interior opportunity per valid sector identity;
          - Campaign/recovery/milestone/first/final/invalid facts fail closed;
          - immutable `DYNAMIC_MID_SECTOR_EVENT_OPPORTUNITY` / `OPPORTUNITY_ONLY` output;
          - no event identity/live effect, environmental/mutator mutation, spawn/progression, collection, combat/economy, lookup/scan, timer/RNG or cap/budget authority.

          Exact deployment anchors:
          - DOC29 baseline `0dca89678698be0557f0500590f27c9f53ab1548`;
          - pre-PR `8dd38514738e0873364851bea472413b44b5539c`, run `38741496798` / job `116444066588` GREEN including exact scope + Android APK;
          - final PR #376 head `38a8e76c147ca682143e44f2cd57dca0d0bc54af`;
          - PR CI `38780778121` / `116580097952` GREEN; Android `38780778404` / `116580099652` GREEN;
          - canonical `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`, parent `0dca89678698be0557f0500590f27c9f53ab1548`, tree `d3aac694e27af9c4fddcbce7c07d6766c84f1146` equal to final PR tree;
          - main CI `38781077090` / `116581119711` GREEN; Android `38781076913` / `116581119364` GREEN;
          - Pages `38781193209`, build `116581519042` + deploy `116581668287` GREEN.

          Issue #375 CLOSED / completed. J6A is **DEPLOYED / FROZEN**.

          '''
          s = replace_exact(s, '## Documentation canonicals\n', evidence + '## Documentation canonicals\n', 'ledger J6A evidence')
          s = replace_exact(
              s,
              '- DOC29 — J5F-E closure & J6A dynamic event opportunity activation: Issue #373, branch `docs/es-13-j5fe-closure-j6a-activation`, in progress from gameplay canonical `9554358005d6d092341f4f65d8b986090307f8b5`.',
              '- DOC29 — J5F-E closure & J6A dynamic event opportunity activation: `0dca89678698be0557f0500590f27c9f53ab1548` — Issue #373 / PR #374.\n- DOC30 — J6A closure & J6B-A event identity vocabulary activation: Issue #377, branch `docs/es-13-j6a-closure-j6ba-activation`, in progress from gameplay canonical `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`.',
              'ledger DOC29/DOC30',
          )
          next_section = '''### ES-13J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract
          Status: **NEXT ENGINEERING TARGET AFTER DOC30 CLOSURE**.

          J6A is frozen as opportunity-only. J6B-A may define exactly five initial immutable event identities (`SOLAR_STORM`, `QUANTUM_RIFT`, `BLACKOUT_SURGE`, `CRYSTAL_RUSH`, `DYSON_ECLIPSE`) with semantic/display metadata and fail-closed lookup only.

          J6B-A must not select an opportunity, map identities to existing mutators/effects, execute events or adopt live runtime. It owns no spawn/progression, entity/projectile collection, damage/defeat, score/reward/economy, environment/mutator mutation, lookup/scan, timing/RNG, cap/budget or entity authority. Selection remains J6B-B+ and live effect mapping must later reuse existing certified environmental authorities.

          '''
          s = replace_regex(
              s,
              r'### ES-13J6A — Pure Dynamic Mid-Sector Event Opportunity Contract\n.*?(?=J4D\+ additional tactical families remain deferred:)',
              next_section,
              'ledger next gameplay',
          )
          s = replace_exact(
              s,
              '`J6A Pure Dynamic Mid-Sector Event Opportunity Contract → J6B+ Event Vocabulary/Live Effects → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance → ES-14 Living Warfront`',
              '`J6B-A Pure Dynamic Mid-Sector Event Identity Vocabulary Contract → J6B-B+ Deterministic Selection/Certified Live Mapping → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance → ES-14 Living Warfront`',
              'ledger program sequence',
          )
          p.write_text(s)

          # CONTINUITY
          p = Path('docs/PROJECT_CONTINUITY.md')
          s = p.read_text()
          current = '''## Current certified gameplay canonical

          `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`

          Phase: **ES-13J6A — Pure Dynamic Mid-Sector Event Opportunity Contract**
          Status: **DEPLOYED / FROZEN**
          Issue: #375 — CLOSED / completed
          Delivery: PR #376 — squash merged

          Single parent: `0dca89678698be0557f0500590f27c9f53ab1548` — DOC29 documentation canonical.

          Canonical tree: `d3aac694e27af9c4fddcbce7c07d6766c84f1146`, exactly equal to final PR-head tree.

          '''
          s = replace_regex(
              s,
              r'## Current certified gameplay canonical\n.*?(?=Version remains `0\.2\.0-beta\.1`\.)',
              current,
              'continuity current canonical',
          )

          result = '''## J6A result
          J6A established the first bounded Dynamic Mid-Sector Event opportunity seam without creating a parallel event or environmental director.

          Certified contract:
          - Infinite-only; certified wave counts 3–7;
          - exactly one deterministic interior opportunity per valid sector identity using existing stable identity/seed facts;
          - Campaign/recovery/milestone/first/final/invalid facts fail closed;
          - immutable `OPPORTUNITY_ONLY` metadata only;
          - no event identity/profile, runtime adoption, live effect, spawn/progression, collection, combat/economy, environment/mutator mutation, lookup/scan, timer/RNG, cap/budget or entity authority.

          Final product scope exactly:
          - `src/game/dynamicMidSectorEventOpportunity.ts`;
          - `tests/es-13j6a-dynamic-mid-sector-event-opportunity.test.mjs`;
          - `tests/gameplay/dynamic-mid-sector-event-opportunity.test.ts`.

          ## J6A exact evidence
          - DOC29 baseline `0dca89678698be0557f0500590f27c9f53ab1548`;
          - pre-PR SHA `8dd38514738e0873364851bea472413b44b5539c`, run `38741496798` / job `116444066588` GREEN including repo/gameplay/platform/typecheck/release/dossier/build/readiness, exact scope guard and Android APK build/verify/upload;
          - final PR #376 head `38a8e76c147ca682143e44f2cd57dca0d0bc54af`;
          - PR CI `38780778121` / `116580097952` GREEN;
          - PR Android `38780778404` / `116580099652` GREEN including Build/Verify/Upload APK;
          - canonical `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`, single parent `0dca89678698be0557f0500590f27c9f53ab1548`, tree `d3aac694e27af9c4fddcbce7c07d6766c84f1146` equal to final PR-head tree;
          - canonical diff exactly three certified product/test files;
          - main CI `38781077090` / `116581119711` GREEN;
          - main Android `38781076913` / `116581119364` GREEN including Build/Verify/Upload APK;
          - Pages `38781193209`: build `116581519042` + deploy `116581668287` GREEN.

          Issue #375 CLOSED / completed. J6A is **DEPLOYED / FROZEN**.

          '''
          s = replace_exact(s, '## ES-13 gameplay canonicals\n', result + '## ES-13 gameplay canonicals\n', 'continuity J6A evidence')
          s = replace_exact(
              s,
              '- J5F-E — Controlled Live Command-Link Disruption Pulse Application: `9554358005d6d092341f4f65d8b986090307f8b5`.',
              '- J5F-E — Controlled Live Command-Link Disruption Pulse Application: `9554358005d6d092341f4f65d8b986090307f8b5`.\n- J6A — Pure Dynamic Mid-Sector Event Opportunity Contract: `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`.',
              'continuity canonical list',
          )
          s = replace_exact(
              s,
              '- DOC29 — J5F-E closure & J6A dynamic event opportunity activation: Issue #373, branch `docs/es-13-j5fe-closure-j6a-activation`, documentation-only closure in progress from gameplay canonical `9554358005d6d092341f4f65d8b986090307f8b5`.',
              '- DOC29 — J5F-E closure & J6A dynamic event opportunity activation: `0dca89678698be0557f0500590f27c9f53ab1548` — Issue #373 / PR #374.\n- DOC30 — J6A closure & J6B-A event identity vocabulary activation: Issue #377, branch `docs/es-13-j6a-closure-j6ba-activation`, documentation-only closure in progress from gameplay canonical `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`.',
              'continuity DOC29/DOC30',
          )
          next_cont = '''### ES-13J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract
          Status: **NEXT ENGINEERING TARGET AFTER DOC30 CLOSURE**

          J6A is frozen as opportunity-only. J6B-A defines the first five event identities as pure immutable vocabulary only: `SOLAR_STORM`, `QUANTUM_RIFT`, `BLACKOUT_SURGE`, `CRYSTAL_RUSH`, `DYSON_ECLIPSE`.

          Required direction:
          - exact deterministic lookup and fail-closed unsupported IDs;
          - semantic/display/tactical metadata only with explicit `IDENTITY_ONLY` semantics;
          - no event selection, mutator/effect mapping, execution or runtime adoption;
          - no imports into J6A, Infinite/mutator/environment authorities or `EnergySwarmGame.tsx`;
          - no spawn/progression, collection, combat/economy, environment mutation, scan/lookup, timer/RNG, cap/budget or entity authority;
          - J6B-B+ must separately prove deterministic selection; any live mapping must reuse existing certified environmental authorities.

          '''
          s = replace_regex(
              s,
              r'### ES-13J6A — Pure Dynamic Mid-Sector Event Opportunity Contract\n.*?(?=J4D\+ additional tactical families remain \*\*DEFERRED)',
              next_cont,
              'continuity next gameplay',
          )
          s = replace_exact(
              s,
              '`J6A Pure Dynamic Mid-Sector Event Opportunity Contract → J6B+ Event Vocabulary/Live Effects → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance`',
              '`J6B-A Pure Dynamic Mid-Sector Event Identity Vocabulary Contract → J6B-B+ Deterministic Selection/Certified Live Mapping → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance`',
              'continuity gameplay chronology',
          )
          s = replace_regex(
              s,
              r'Suggested handoff:\n>.*?(?=\n\n## Update obligation)',
              'Suggested handoff:\n> Continue ORBI Energy Swarm autonomously. Repository `ingeniusvictor/orbi-energy.swarm`. J6A gameplay canonical is `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`, fully DEPLOYED / FROZEN via Issue #375 / PR #376 with exact three-file product scope and post-main CI/Android/Pages GREEN. Complete DOC30 if still open, then implement J6B-A as a pure Dynamic Mid-Sector Event Identity Vocabulary Contract: exactly the initial five identities `SOLAR_STORM`, `QUANTUM_RIFT`, `BLACKOUT_SURGE`, `CRYSTAL_RUSH`, `DYSON_ECLIPSE`, immutable/fail-closed identity lookup only, no selection, mutator/effect mapping, live adoption, spawn/collection/combat/economy/environment/timing/scan/cap authority. J6B-B+ must separately prove deterministic selection and later live mapping must reuse frozen environmental authorities. Keep J3C-C, J4D+ and manual blockers deferred. Follow Issue → Branch → full gates → PR → exact-SHA post-merge evidence. Never touch `main` directly or weaken tests.',
              'continuity handoff',
          )
          p.write_text(s)
          PY

      - name: Commit exact DOC30 candidate locally
        shell: bash
        run: |
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git diff --cached --quiet && { echo "DOC30 produced no documentation change"; exit 1; }
          git commit -m "ES-13DOC30: close J6A and activate J6B-A"

      - name: Install dependencies
        run: npm ci
      - name: Repository Smoke
        run: npm run test:repo
      - name: Gameplay regression
        run: npm run test:gameplay
      - name: Platform regression
        run: npm run test:platform
      - name: Typecheck
        run: npm run typecheck
      - name: Release Contract
        run: npm run release:verify
      - name: Manual dossier
        run: npm run release:evidence:verify
      - name: Production Build
        run: npm run build
      - name: RC readiness fail-closed
        run: npm run release:readiness

      - name: DOC30 exact scope guard
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${files[@]}"
          expected=(
            ".github/workflows/es-13doc30-patch-cert.yml"
            "docs/ES13_GAMEPLAY_ROADMAP.md"
            "docs/IMPLEMENTATION_LEDGER.md"
            "docs/PROJECT_CONTINUITY.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${#files[@]}" -eq "${#expected_sorted[@]}" ]]
          for i in "${!files[@]}"; do
            [[ "${files[$i]}" == "${expected_sorted[$i]}" ]]
          done
          grep -Fq '69ac8a1a83d2f6bbe6a989a3a819fac438e854c1' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract' docs/PROJECT_CONTINUITY.md
          ! git diff --name-only "$BASE_SHA"...HEAD | grep -Eq '^(src/|tests/|android/|public/|package(-lock)?\.json$)'

      - name: Push certified DOC30 candidate
        shell: bash
        run: git push origin HEAD:docs/es-13-j6a-closure-j6ba-activation
