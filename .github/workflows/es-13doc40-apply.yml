name: ES-13DOC40 Apply

on:
  push:
    branches:
      - docs/es-13-j8b-closure-j8c-duration
    paths:
      - scripts/es13doc40_apply.py
      - .github/workflows/es-13doc40-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/es-13-j8b-closure-j8c-duration
          fetch-depth: 0
      - name: Repair temporary helper brace escape fail-closed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/es13doc40_apply.py')
          s = p.read_text()
          old = 'J8C must freeze exactly one pure Score Attack completion metadata projection: `60000 ms` with `{ type: "TIMEBOX", durationMs: 60000 }`. It must consume J8A + J8B, fail closed for unsupported/incompatible facts, and leave current timer/completion runtime authority unchanged.'
          new = 'J8C must freeze exactly one pure Score Attack completion metadata projection: `60000 ms` with `{{ type: "TIMEBOX", durationMs: 60000 }}`. It must consume J8A + J8B, fail closed for unsupported/incompatible facts, and leave current timer/completion runtime authority unchanged.'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'DOC40 fail-closed: expected one roadmap brace-escape anchor, got {count}')
          p.write_text(s.replace(old, new, 1))
          print('DOC40 temporary helper brace escape repaired locally')
          PY
      - name: Repair temporary roadmap delimiter fail-closed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/es13doc40_apply.py')
          s = p.read_text()
          old = 'r"### ES-13J8B — Pure Score Attack Execution-Substrate / Lifecycle Compatibility Contract\\nStatus: \\*\\*NEXT DISCOVERY / CONTRACT TARGET AFTER DOC39 CLOSURE\\*\\*\\n\\n.*?(?=\\n---\\n\\n## J9)",'
          new = 'r"### ES-13J8B — Pure Score Attack Execution-Substrate / Lifecycle Compatibility Contract\\nStatus: \\*\\*NEXT DISCOVERY / CONTRACT TARGET AFTER DOC39 CLOSURE\\*\\*\\n\\n.*?(?=\\n## J9)",'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'DOC40 fail-closed: expected one roadmap delimiter anchor, got {count}')
          p.write_text(s.replace(old, new, 1))
          print('DOC40 temporary roadmap delimiter repaired locally')
          PY
      - name: Apply DOC40 fail-closed
        run: python scripts/es13doc40_apply.py
      - name: Validate exact DOC40 scope and preservation
        run: |
          set -euo pipefail
          git diff --name-only d6277d4162c23f9b3edbbd69ccac8424b90d99ee -- \
            ':!.github/workflows/es-13doc40-apply.yml' ':!scripts/es13doc40_apply.py' | sort > /tmp/files.txt
          printf '%s\n' \
            docs/ES13_GAMEPLAY_ROADMAP.md \
            docs/IMPLEMENTATION_LEDGER.md \
            docs/PROJECT_CONTINUITY.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt
          grep -Fq '#4' docs/PROJECT_CONTINUITY.md
          grep -Fq '#5' docs/PROJECT_CONTINUITY.md
          grep -Fq '#202' docs/PROJECT_CONTINUITY.md
          grep -Fq '#248' docs/PROJECT_CONTINUITY.md
          grep -Fq '#254' docs/PROJECT_CONTINUITY.md
          grep -Fq '#283' docs/PROJECT_CONTINUITY.md
          grep -Fq 'J3C-C' docs/PROJECT_CONTINUITY.md
          grep -Fq 'J4D+' docs/PROJECT_CONTINUITY.md
          grep -Fq '## J9 — Boss & Miniboss Expansion' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'd6277d4162c23f9b3edbbd69ccac8424b90d99ee' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J8C' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J8C' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq 'ES-13J8C' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '60000 ms' docs/PROJECT_CONTINUITY.md
          grep -Fq '60000 ms' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '60000 ms' docs/ES13_GAMEPLAY_ROADMAP.md
      - name: Commit DOC40 docs
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'ES-13DOC40: close J8B and activate J8C duration projection'
          git push origin HEAD:docs/es-13-j8b-closure-j8c-duration
