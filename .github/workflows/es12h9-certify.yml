name: ES-12H9 Eclipse Runtime Certification

on:
  push:
    branches:
      - feat/es-12h9-eclipse-cosmic-event
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/es-12h9-eclipse-cosmic-event
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply literal Eclipse runtime patch
        run: python scripts/es12h9-apply.py

      - name: H9 focused contracts
        run: >-
          npx tsx --test
          tests/runtime-eclipse.test.ts
          tests/eclipse-runtime-adoption.test.ts
          tests/runtime-mutator-effects.test.ts
          tests/runtime-environmental-fields.test.ts
          tests/infinite-mutator-director.test.ts

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay
        run: npm run test:gameplay

      - name: Platform
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Production Build
        run: npm run build

      - name: Preserve H6 authorities and certified budgets
        shell: bash
        run: |
          grep -Eq 'MAX_ENEMIES[^0-9]*80' src/game/constants.ts
          grep -Eq 'MAX_PROJECTILES[^0-9]*120' src/game/constants.ts
          git diff --exit-code 8b84554c3b7c6bf4ced2e6bf547fa54e68fff371 -- \
            src/game/constants.ts \
            src/game/waveDirector.ts \
            src/game/infiniteMutatorDirector.ts \
            src/game/runtimeMutatorEffects.ts \
            src/game/runtimeEnvironmentalFields.ts

      - name: Remove H9 temporary tooling
        shell: bash
        run: |
          rm -f .github/workflows/es12h9-certify.yml
          rm -f scripts/es12h9-apply.py
          test ! -e .github/workflows/es12h9-certify.yml
          test ! -e scripts/es12h9-apply.py
          git add -A

      - name: Verify H9 diff hygiene
        shell: bash
        run: git diff --cached --check

      - name: Verify exact H9 net file set
        shell: bash
        run: |
          cat > /tmp/h9-allowed.txt <<'EOF'
          src/game/EnergySwarmGame.tsx
          src/game/runtimeEclipse.ts
          tests/eclipse-runtime-adoption.test.ts
          tests/runtime-eclipse.test.ts
          EOF
          sort -u /tmp/h9-allowed.txt -o /tmp/h9-allowed.txt
          git diff --name-only 8b84554c3b7c6bf4ced2e6bf547fa54e68fff371 -- | sort -u > /tmp/h9-actual.txt
          echo '=== H9 NET FILES ==='
          cat /tmp/h9-actual.txt
          diff -u /tmp/h9-allowed.txt /tmp/h9-actual.txt

      - name: Materialize certified H9 candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(h9): complete Eclipse cosmic event runtime"
          git push origin HEAD:feat/es-12h9-eclipse-cosmic-event
