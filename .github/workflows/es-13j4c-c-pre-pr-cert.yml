name: ES-13J4C-C Pre-PR Certification

on:
  push:
    branches:
      - es-13j4c-c-controlled-siege-adoption
    paths:
      - '.github/workflows/es-13j4c-c-pre-pr-cert.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: 72c4359af106d6f955e9932c6c72a836b2922ab8
      ORBI_RELEASE_SHA: ${{ github.sha }}
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay
        run: npm run test:gameplay

      - name: Platform
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release Contract
        run: npm run release:verify

      - name: Manual dossier
        run: npm run release:evidence:verify

      - name: Production Build
        run: npm run build

      - name: RC readiness fail-closed
        run: npm run release:readiness -- --output release-readiness.json

      - name: J4C-C exact product scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" HEAD

          mapfile -t actual < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          expected=(
            ".github/workflows/es-13j4c-c-pre-pr-cert.yml"
            "src/game/runtimeTacticalEnemyAdoption.ts"
            "tests/es-13j4b-live-tactical-adoption.test.mjs"
            "tests/es-13j4c-c-controlled-siege-adoption.test.mjs"
            "tests/gameplay/runtime-tactical-enemy-adoption.test.ts"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)

          if [[ "${#actual[@]}" -ne "${#expected_sorted[@]}" ]]; then
            printf 'Unexpected changed-file count.\nExpected:\n%s\nActual:\n%s\n' \
              "$(printf '%s\n' "${expected_sorted[@]}")" \
              "$(printf '%s\n' "${actual[@]}")"
            exit 1
          fi

          for i in "${!expected_sorted[@]}"; do
            if [[ "${actual[$i]}" != "${expected_sorted[$i]}" ]]; then
              printf 'Scope mismatch at index %s: expected %s, got %s\n' \
                "$i" "${expected_sorted[$i]}" "${actual[$i]}"
              exit 1
            fi
          done

          git diff --quiet "$BASE_SHA" HEAD -- \
            src/game/EnergySwarmGame.tsx \
            src/game/EnergySwarmCanvas.tsx \
            src/game/liveSiegeVolleyIntegration.ts \
            src/game/siegeVolleyTelegraph.ts \
            src/game/infiniteBossFamily.ts \
            src/game/infiniteSectorDirector.ts \
            src/game/infiniteWaveDirector.ts \
            src/game/runtimeEnemyEvolution.ts \
            src/game/liveEnemyFormationDirector.ts \
            src/game/tacticalEnemyFamilies.ts \
            src/game/types.ts \
            src/game/constants.ts \
            src/game/formations.ts \
            src/game/formationCycle.ts \
            android \
            public \
            package.json \
            package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j4c-c-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
