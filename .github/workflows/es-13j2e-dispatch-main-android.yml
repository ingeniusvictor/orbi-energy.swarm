name: ES-13J2E Canonical Android Dispatch

on:
  push:
    branches:
      - test/es-13j2e-overdrive-integration

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical main and dispatch Android
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: bf0e6a858e3c96091c002ea623b29eb5c260c6ea
        shell: bash
        run: |
          set -euo pipefail
          actual="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).sha));')"
          test "${actual}" = "${EXPECTED_SHA}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/dispatches" \
            -d '{"ref":"main"}'
