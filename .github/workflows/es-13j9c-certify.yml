name: ES-13J9C full pre-PR certification

on:
  push:
    branches:
      - es-13j9c-blackout-architect-chassis-compatibility
    paths:
      - '.github/workflows/es-13j9c-certify.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout J9C branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact J9C scope guard
        shell: bash
        run: |
          BASE=cf745bb7b17cd2c2421d3531cf2646dd726774c3
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD | sort)
          expected=(
            .github/workflows/es-13j9c-certify.yml
            src/game/blackoutArchitectChassisCompatibility.ts
            tests/es-13j9c-blackout-architect-chassis-compatibility.test.mjs
            tests/gameplay/blackout-architect-chassis-compatibility.test.ts
          )
          [ "${#changed[@]}" -eq "${#expected[@]}" ]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done
          git diff --check "$BASE"...HEAD
          test -z "$(git diff --name-only "$BASE"...HEAD -- src/game/bossChassis.ts src/game/infiniteRaidEscalation.ts src/game/runtimeMilestoneEncounter.ts src/game/EnergySwarmGame.tsx)"

      - name: Focused J9C static contract tests
        run: node --test tests/es-13j9c-blackout-architect-chassis-compatibility.test.mjs

      - name: Focused J9C gameplay contract tests
        run: npx --no-install tsx --test tests/gameplay/blackout-architect-chassis-compatibility.test.ts

      - name: Repository smoke tests
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Upload RC readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j9c-rc-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30

  android-debug:
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout J9C branch
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j9c-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
