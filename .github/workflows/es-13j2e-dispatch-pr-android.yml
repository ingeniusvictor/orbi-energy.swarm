name: ES-13J2E Final PR Android Dispatch

on:
  push:
    branches:
      - test/es-13j2e-overdrive-integration

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify frozen PR head and dispatch Android
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: cert/es-13j2e-pr-android
          EXPECTED_SHA: 0dcd9b4533976a43f872d6b070607076c6336b48
        shell: bash
        run: |
          set -euo pipefail
          actual="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_REF}" | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).sha));')"
          test "${actual}" = "${EXPECTED_SHA}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/dispatches" \
            -d "{\"ref\":\"${TARGET_REF}\"}"
