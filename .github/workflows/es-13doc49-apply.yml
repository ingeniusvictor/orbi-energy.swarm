name: ES-13DOC49 Apply

on:
  push:
    branches: [docs/es-13-j8k-closure-j8l-activation-envelope]
    paths:
      - .github/workflows/es-13doc49-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact J8K ancestry
        run: test "$(git merge-base ac943f609e427618465104f51b8f023620c8bf98 HEAD)" = "ac943f609e427618465104f51b8f023620c8bf98"

      - name: Apply DOC49 patch fail closed
        run: python scripts/es13doc49_apply.py

      - name: Guard exact documentation scope
        run: |
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          grep -Fq 'ac943f609e427618465104f51b8f023620c8bf98' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J8L' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'Runtime Activation Envelope' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '#4' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#5' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#202' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#248' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#254' docs/PROJECT_CONTINUITY.md
          grep -Fq '#283' docs/PROJECT_CONTINUITY.md
          grep -Fq '## J9 — Boss & Miniboss Expansion' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '## J15' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md

      - name: Commit DOC49 documents
        run: |
          git config user.name ingeniusvictor
          git config user.email ingenius.victor@gmail.com
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'docs(doc49): close J8K and activate J8L activation envelope'
          git push
