name: ES-13DOC58 full docs certification

on:
  push:
    branches:
      - docs/es-13-doc58-close-j9d-activate-j9e
    paths:
      - '.github/workflows/es-13doc58-certify.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact DOC58 docs-only scope guard
        shell: bash
        run: |
          BASE=4bc4d70b1d54217dcbfca1a4745042dbb8770fe6
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD | sort)
          expected=(
            .github/workflows/es-13doc58-certify.yml
            docs/ES13_GAMEPLAY_ROADMAP.md
            docs/IMPLEMENTATION_LEDGER.md
            docs/PROJECT_CONTINUITY.md
          )
          [ "${#changed[@]}" -eq "${#expected[@]}" ]
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null; done
          git diff --check "$BASE"...HEAD
          test -z "$(git diff --name-only "$BASE"...HEAD -- src tests android package.json package-lock.json)"
          grep -F 'ACTIVE PROGRAM — J9D DEPLOYED / J9E NEXT' docs/ES13_GAMEPLAY_ROADMAP.md >/dev/null
          grep -F 'Canonical: `4bc4d70b1d54217dcbfca1a4745042dbb8770fe6`' docs/ES13_GAMEPLAY_ROADMAP.md >/dev/null
          grep -F 'NEXT CONTRACT TARGET AFTER DOC58 CLOSURE' docs/IMPLEMENTATION_LEDGER.md >/dev/null
          grep -F 'TITAN_CORE -> EnemyType.BOSS_TITAN' docs/PROJECT_CONTINUITY.md >/dev/null
          test ! -e .github/workflows/es-13doc58-apply.yml
          test ! -e scripts/es-13doc58-apply.py
      - run: npm run test:repo
      - run: npm run test:gameplay
      - run: npm run test:platform
      - run: npm run typecheck
      - run: npm run release:verify
      - run: npm run release:evidence:verify
      - run: npm run build
      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: es-13doc58-rc-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30
