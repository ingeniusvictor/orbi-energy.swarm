name: ES-13DOC38 Apply

on:
  push:
    branches:
      - docs/es-13-j7d-j7-closure-j8-discovery
    paths:
      - scripts/es13doc38_apply.py
      - .github/workflows/es-13doc38-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/es-13-j7d-j7-closure-j8-discovery
          fetch-depth: 0
      - name: Apply DOC38 fail-closed
        run: python scripts/es13doc38_apply.py
      - name: Validate exact DOC38 scope and preservation
        run: |
          set -euo pipefail
          git diff --name-only 9440b31b0c8dca2da0cfe92a5f02cbf7065e6d67 -- \
            ':!.github/workflows/es-13doc38-apply.yml' ':!scripts/es13doc38_apply.py' | sort > /tmp/files.txt
          printf '%s\n' \
            docs/ES13_GAMEPLAY_ROADMAP.md \
            docs/IMPLEMENTATION_LEDGER.md \
            docs/PROJECT_CONTINUITY.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt
          grep -Fq '#4' docs/PROJECT_CONTINUITY.md
          grep -Fq '#5' docs/PROJECT_CONTINUITY.md
          grep -Fq '#202' docs/PROJECT_CONTINUITY.md
          grep -Fq '#248' docs/PROJECT_CONTINUITY.md
          grep -Fq '#254' docs/PROJECT_CONTINUITY.md
          grep -Fq '#283' docs/PROJECT_CONTINUITY.md
          grep -Fq 'J3C-C' docs/PROJECT_CONTINUITY.md
          grep -Fq 'J4D+' docs/PROJECT_CONTINUITY.md
          grep -Fq '## J8 — Additional Game Modes' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '## J9 — Boss & Miniboss Expansion' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '9440b31b0c8dca2da0cfe92a5f02cbf7065e6d67' docs/PROJECT_CONTINUITY.md
          grep -Fq 'NEXT ARCHITECTURE / DISCOVERY TARGET AFTER DOC38 CLOSURE' docs/ES13_GAMEPLAY_ROADMAP.md
      - name: Commit DOC38 docs
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'ES-13DOC38: close J7D/J7 and activate J8 discovery'
          git push origin HEAD:docs/es-13-j7d-j7-closure-j8-discovery
