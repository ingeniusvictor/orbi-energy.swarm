name: ES-13J7A Pre-PR Certification

on:
  push:
    branches:
      - es-13j7a-timed-survival-bonus-profile

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository smoke tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Exact J7A scope and authority guard
        shell: bash
        run: |
          set -euo pipefail
          base=b858b14a2682fd5855eda5093fc6b13ec3a5653c
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | sort)
          expected=(
            .github/workflows/es-13j7a-pre-pr-cert.yml
            src/game/bonusChallengeContract.ts
            tests/es-13j7a-bonus-challenge-contract.test.mjs
            tests/gameplay/bonus-challenge-contract.test.ts
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected J7A scope:\n%s\n' "${actual[*]}"
            exit 1
          fi
          grep -q '"TIMED_SURVIVAL"' src/game/bonusChallengeContract.ts
          grep -q 'profileMode: "PROFILE_ONLY"' src/game/bonusChallengeContract.ts
          grep -q 'completionCompatibility: "TIMEBOX"' src/game/bonusChallengeContract.ts
          grep -q 'minMs: 20000' src/game/bonusChallengeContract.ts
          grep -q 'maxMs: 40000' src/game/bonusChallengeContract.ts
          ! grep -q 'bonusChallengeContract' src/game/EnergySwarmGame.tsx
          ! grep -q 'bonusChallengeContract' src/game/runtimeWaveDescriptor.ts
          ! grep -q 'bonusChallengeContract' src/game/runtimeCompletionPolicy.ts
          ! grep -q 'bonusChallengeContract' src/game/infiniteSession.ts

      - name: Upload RC readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j7a-rc-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30

  android-debug:
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j7a-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
