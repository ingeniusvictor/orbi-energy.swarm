name: ES-13J1A Branch Certification

on:
  push:
    branches:
      - feat/es-13j1a-combat-resonance-core

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness remains fail-closed
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: J1A scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 6901c67eaf369c3b41dba5d60480ad7d173275a7...HEAD > /tmp/j1a-files.txt
          cat /tmp/j1a-files.txt
          while IFS= read -r file; do
            case "$file" in
              src/game/combatResonance.ts|tests/gameplay/combat-resonance.test.ts|.github/workflows/es-13j1a-certify.yml) ;;
              *) echo "Unexpected J1A scope: $file" >&2; exit 1 ;;
            esac
          done < /tmp/j1a-files.txt
