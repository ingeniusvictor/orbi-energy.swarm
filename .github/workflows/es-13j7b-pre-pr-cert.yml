name: ES-13J7B Pre-PR Certification

on:
  push:
    branches:
      - es-13j7b-timed-survival-opportunity

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository smoke tests
        run: npm test

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Exact J7B scope and authority guard
        shell: bash
        run: |
          set -euo pipefail
          base=bd4c5c7061337aec3c857f548e086516bbea04e0
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | sort)
          expected=(
            .github/workflows/es-13j7b-pre-pr-cert.yml
            src/game/bonusChallengeOpportunity.ts
            tests/es-13j7b-bonus-challenge-opportunity.test.mjs
            tests/gameplay/bonus-challenge-opportunity.test.ts
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected J7B scope:\n%s\n' "${actual[*]}"
            exit 1
          fi
          grep -q 'BONUS_CHALLENGE_MIN_INFINITE_SECTOR = 33' src/game/bonusChallengeOpportunity.ts
          grep -q 'BONUS_CHALLENGE_SECTOR_CADENCE = 10' src/game/bonusChallengeOpportunity.ts
          grep -q 'resolveDynamicMidSectorEventOpportunity' src/game/bonusChallengeOpportunity.ts
          grep -q 'j6OccupiesWaveTwo ? 3 : 2' src/game/bonusChallengeOpportunity.ts
          ! grep -q 'hashIdentity' src/game/bonusChallengeOpportunity.ts
          ! grep -q 'bonusChallengeOpportunity' src/game/EnergySwarmGame.tsx
          ! grep -q 'bonusChallengeOpportunity' src/game/runtimeProjectionBundleCache.ts
          ! grep -q 'bonusChallengeOpportunity' src/game/runtimeWaveDescriptor.ts
          ! grep -q 'bonusChallengeOpportunity' src/game/infiniteSession.ts

      - name: Upload RC readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j7b-rc-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30

  android-debug:
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j7b-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
