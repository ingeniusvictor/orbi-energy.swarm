name: ES-13DOC19 Documentation Patch

on:
  push:
    branches:
      - docs/es-13-j4c-c-closure-j5a-activation
    paths:
      - '.github/workflows/es-13doc19-docs-cert.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: 1131c06db406ca0170d5dad33ecb7f4610a06b96
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/es-13-j4c-c-closure-j5a-activation

      - name: Apply guarded DOC19 patch
        run: python .github/es13doc19_patch.py

      - name: Validate docs patch fail-closed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t actual < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            "docs/ES13_GAMEPLAY_ROADMAP.md"
            "docs/IMPLEMENTATION_LEDGER.md"
            "docs/PROJECT_CONTINUITY.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [[ "${#actual[@]}" -eq "${#expected_sorted[@]}" ]]
          for i in "${!expected_sorted[@]}"; do
            [[ "${actual[$i]}" == "${expected_sorted[$i]}" ]]
          done
          git diff --quiet -- src tests android public package.json package-lock.json

      - name: Commit documentation patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_CONTINUITY.md docs/IMPLEMENTATION_LEDGER.md docs/ES13_GAMEPLAY_ROADMAP.md
          git commit -m "ES-13DOC19: close J4C-C and activate J5A"
          git push origin HEAD:docs/es-13-j4c-c-closure-j5a-activation
