name: ES-12F8 Patch

on:
  push:
    branches:
      - feat/es-12f8-unique-energy-attacks

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/es-12f8-unique-energy-attacks
          fetch-depth: 0
      - name: Repair staged patcher template literal
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/es12f8-patch.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const labelPos = source.indexOf('"wild label identity"');
          const start = source.lastIndexOf('canvas = replaceOnce(', labelPos);
          const end = source.indexOf('const newProjectileRenderer =', labelPos);
          if (labelPos < 0 || start < 0 || end < 0) {
            throw new Error('wild label repair range not found');
          }
          const replacement = [
            'canvas = replaceOnce(',
            '  canvas,',
            '  "wild label identity",',
            '  \'        const displayLabel = lang === "es" ? `${affinity.toUpperCase()} SALVAJE` : `WILD ${affinity.toUpperCase()}`;\',',
            '  `        const identity = res.orbiEnergyId ?? affinity.toUpperCase();\\n        const displayLabel = lang === "es" ? identity + " SALVAJE" : "WILD " + identity;`,',
            ');',
            '',
            '',
          ].join('\n');
          source = source.slice(0, start) + replacement + source.slice(end);
          fs.writeFileSync(path, source);
          NODE
      - name: Apply unique energy attack patch
        run: node .github/es12f8-patch.mjs
      - name: Commit patch
        run: |
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(orbi): wire unique energy attack signatures ES-12F8 [patch-applied]"
          git push origin HEAD:feat/es-12f8-unique-energy-attacks
