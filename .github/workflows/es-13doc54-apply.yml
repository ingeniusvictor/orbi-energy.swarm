name: ES-13DOC54 guarded docs applicator

on:
  push:
    branches:
      - docs/es-13-doc54-close-j8p-roadmap-hold
    paths:
      - .github/workflows/es-13doc54-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DOC54 branch
        uses: actions/checkout@v4
        with:
          ref: docs/es-13-doc54-close-j8p-roadmap-hold
          fetch-depth: 0

      - name: Apply exact DOC54 patch
        run: python3 scripts/es-13doc54-apply.py

      - name: Verify whitespace and exact docs scope
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            docs/ES13_GAMEPLAY_ROADMAP.md
            docs/IMPLEMENTATION_LEDGER.md
            docs/PROJECT_CONTINUITY.md
          )
          if [ "${#changed[@]}" -ne "${#expected[@]}" ]; then
            echo "Unexpected DOC54 docs count: ${#changed[@]}" >&2
            exit 1
          fi
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null || {
              echo "Missing expected DOC54 path: $path" >&2
              exit 1
            }
          done
          grep -F 'c29df45aebf4a0b3d58038a42b8c539234b42745' docs/ES13_GAMEPLAY_ROADMAP.md >/dev/null
          grep -F 'PLANNED / DEFERRED — NOT ACTIVE' docs/ES13_GAMEPLAY_ROADMAP.md >/dev/null
          grep -F 'ES-13J8P — Controlled Public Score Attack Selection & Presentation Adoption | DEPLOYED / FROZEN' docs/IMPLEMENTATION_LEDGER.md >/dev/null
          grep -F 'No gameplay phase is active after DOC54' docs/PROJECT_CONTINUITY.md >/dev/null

      - name: Commit and push DOC54 docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/ES13_GAMEPLAY_ROADMAP.md \
            docs/IMPLEMENTATION_LEDGER.md \
            docs/PROJECT_CONTINUITY.md
          git commit -m "ES-13DOC54 — close J8P and hold post-J8 roadmap"
          git push origin HEAD:docs/es-13-doc54-close-j8p-roadmap-hold
