name: ES-13J8E Pre-PR Certification

on:
  push:
    branches: [es-13j8e-score-attack-record-storage]
    paths:
      - .github/workflows/es-13j8e-pre-pr-cert.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard exact J8E scope and frozen seams
        run: |
          test "$(git merge-base 7da459c56ab27d7891cf859db9c1065347cd2736 HEAD)" = "7da459c56ab27d7891cf859db9c1065347cd2736"
          printf '%s\n' \
            .github/workflows/es-13j8e-pre-pr-cert.yml \
            src/game/storage.ts \
            src/game/types.ts \
            tests/es-13j8d-score-attack-record-projection.test.mjs \
            tests/gameplay/storage.test.ts > /tmp/expected-files
          git diff --name-only 7da459c56ab27d7891cf859db9c1065347cd2736...HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --exit-code 7da459c56ab27d7891cf859db9c1065347cd2736...HEAD -- src/game/scoreAttackRecordProjection.ts src/game/runPersistence.ts
          test ! -e scripts/es13j8e_apply.py
          test ! -e .github/workflows/es-13j8e-apply.yml
          grep -Fq 'scoreAttackBestScore: number;' src/game/types.ts
          grep -Fq 'scoreAttackBestScore: 0,' src/game/storage.ts
          grep -Fq 'Number.MAX_SAFE_INTEGER' src/game/storage.ts
          grep -Fq 'const LOCAL_STORAGE_KEY = "orbi_energy_swarm_stats_v2";' src/game/storage.ts
          ! grep -Fq 'orbi_energy_swarm_stats_v3' src/game/storage.ts
          grep -Fq 'J8D remains storage-neutral after J8E adopts the dedicated schema field' tests/es-13j8d-score-attack-record-projection.test.mjs
          grep -Fq 'assert.equal(persistence.includes("scoreAttackBestScore"), false);' tests/es-13j8d-score-attack-record-projection.test.mjs

      - name: Repository smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8e-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8e-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
