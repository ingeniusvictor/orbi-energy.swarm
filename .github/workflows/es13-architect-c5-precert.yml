name: ES-13 Architect C5 temporary full pre-cert
on:
  push:
    branches: ['feat/es13-architect-qa-grid-lock-c5']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21', cache: gradle}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Exact C5 file boundary
        run: |
          git diff --name-only 653c6a79df8ed76b032f5875f4282e3a9ec440e9 HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/es13-architect-c5-precert.yml' \
            'src/game/EnergySwarmGame.tsx' \
            'src/game/blackoutArchitectDevQaGridLockAttack.ts' \
            'tests/es-13j9lb2b2b2b2c5-grid-lock.test.mjs' \
            'tests/gameplay/blackout-architect-dev-grid-lock.test.ts' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Dependencies
        run: npm ci
      - name: Focused C5/C4/C3 historical safety
        run: |
          node --test tests/es-13j9lb2b2b2b2c5-grid-lock.test.mjs tests/es-13j9lb2b2b2b2c4-foton-movement.test.mjs tests/es-13j2b-live-overdrive-adoption.test.mjs tests/es-13j2e-overdrive-integration-adoption.test.mjs
          npx tsx --test tests/gameplay/blackout-architect-dev-grid-lock.test.ts tests/gameplay/blackout-architect-dev-foton-movement.test.ts
      - name: Full repo/gameplay/platform
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Release and evidence
        run: |
          npm run release:verify
          npm run release:evidence:verify
      - name: Build and readiness
        run: |
          npm run build
          npm run release:readiness -- --output release-readiness.json
      - name: Android APK
        run: npm run android:debug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: es13-c5-precert-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
