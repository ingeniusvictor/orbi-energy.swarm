name: ES-13DOC31 Patch and Certification

on:
  push:
    branches:
      - docs/es-13-j6ba-closure-j6bb-activation
    paths:
      - '.github/workflows/es-13doc31-patch-cert.yml'

permissions:
  contents: write

jobs:
  patch-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 204566693978adabba7e66995c88ae2f85818f8b
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/es-13-j6ba-closure-j6bb-activation

      - name: Apply DOC31 exact anchored patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old, new, 1)

          def replace_regex(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, got {count}")
              return updated

          # ROADMAP
          p = Path('docs/ES13_GAMEPLAY_ROADMAP.md')
          s = p.read_text()
          replacement = '''### J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract
          Status: **DEPLOYED / FROZEN**
          Canonical: `204566693978adabba7e66995c88ae2f85818f8b`
          Issue #379 / PR #380

          Certified behavior:
          - exactly five immutable identities: `SOLAR_STORM`, `QUANTUM_RIFT`, `BLACKOUT_SURGE`, `CRYSTAL_RUSH`, `DYSON_ECLIPSE`;
          - exact deterministic lookup by supported ID; padded/empty/lowercase/deferred/unsupported values fail closed;
          - every profile is `ENVIRONMENTAL_IDENTITY` / `IDENTITY_ONLY`;
          - no opportunity selection, event selection, mutator/effect mapping or live execution;
          - no import/adoption by J6A, Infinite directors, mutator/environment runtime files or `EnergySwarmGame.tsx`;
          - no spawn/progression, collection, combat/economy, environment, entity lookup/scan, timing/RNG, cap/budget or entity authority.

          Exact deployment anchors:
          - DOC30 baseline `26554f20648f0a27c2c510c055cbec81c43416c7`;
          - pre-PR `cd2abd12e20082382611bf08cac2d3d89f693adc`, run `38782799375` / job `116587050168` GREEN including exact scope + Android APK;
          - final PR #380 head `2aae2803d302bea80c3f0b0748bda10c6fcaffcd`;
          - PR CI `38783326052` / `116588875589` GREEN; Android `38783326187` / `116588876111` GREEN;
          - canonical `204566693978adabba7e66995c88ae2f85818f8b`, parent `26554f20648f0a27c2c510c055cbec81c43416c7`, tree `3f6d2359ca87ec31853fbbfccc6bb1ffb6fb68ba`;
          - main CI `38783605087` / `116589825599` GREEN; Android `38783604964` / `116589827934` GREEN;
          - Pages `38783697902`, build `116590143603` + deploy `116590341097` GREEN.

          ### J6B-B — Pure Deterministic Dynamic Event Identity Selection Contract
          Status: **NEXT ACTIVE ENGINEERING SLICE AFTER DOC31 CLOSURE**

          J6A already emits one valid opportunity with an 8-lowercase-hex `identityFingerprint`; J6B-A freezes exactly five event identities. J6B-B may compose those two frozen contracts to select identity semantics only.

          Required direction:
          - pure deterministic contract only; no runtime adoption;
          - consume a valid current J6A opportunity and frozen J6B-A vocabulary;
          - validate kind/mode/source/wave consistency, canonical opportunity ID and exact fingerprint shape;
          - select exactly one frozen event ID from the existing `identityFingerprint`, with no new RNG/clock/seed authority;
          - output immutable `SELECTION_ONLY` metadata carrying source opportunity identity + selected event identity;
          - semantic event selection is allowed, but mutator/effect mapping and live execution remain forbidden;
          - invalid/stale/malformed input fails closed;
          - J6A/J6B-A remain unchanged;
          - no `EnergySwarmGame.tsx`, Infinite director, mutator/effect/environment runtime adoption;
          - no spawn/progression, collection, combat/economy, entity lookup/scan, timer/RNG, cap/budget or entity create/remove/mutate authority;
          - live effect mapping remains a later J6 slice and must reuse existing frozen environmental authorities.

          '''
          s = replace_regex(
              s,
              r'### J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract\n.*?(?=## J7 — Bonus Challenge Rounds)',
              replacement,
              'roadmap J6B-A/J6B-B',
          )
          p.write_text(s)

          # LEDGER
          p = Path('docs/IMPLEMENTATION_LEDGER.md')
          s = p.read_text()
          j6a = '| ES-13J6A — Pure Dynamic Mid-Sector Event Opportunity Contract | DEPLOYED / FROZEN | `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1` | #375 | #376 |'
          j6ba = '| ES-13J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract | DEPLOYED / FROZEN | `204566693978adabba7e66995c88ae2f85818f8b` | #379 | #380 |'
          s = replace_exact(s, j6a, j6a + '\n' + j6ba, 'ledger J6B-A milestone row')

          evidence = '''### J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract
          Certified behavior:
          - exactly five frozen identities: `SOLAR_STORM`, `QUANTUM_RIFT`, `BLACKOUT_SURGE`, `CRYSTAL_RUSH`, `DYSON_ECLIPSE`;
          - exact fail-closed lookup with immutable `ENVIRONMENTAL_IDENTITY` / `IDENTITY_ONLY` profiles;
          - no opportunity/event selection, mutator/effect mapping, live execution or runtime adoption;
          - no spawn/progression, collection, combat/economy, environment, scan/lookup, timing/RNG, cap/budget or entity authority.

          Exact deployment anchors:
          - DOC30 baseline `26554f20648f0a27c2c510c055cbec81c43416c7`;
          - pre-PR `cd2abd12e20082382611bf08cac2d3d89f693adc`, run `38782799375` / job `116587050168` GREEN including exact scope + Android APK;
          - final PR #380 head `2aae2803d302bea80c3f0b0748bda10c6fcaffcd`;
          - PR CI `38783326052` / `116588875589` GREEN; Android `38783326187` / `116588876111` GREEN;
          - canonical `204566693978adabba7e66995c88ae2f85818f8b`, parent `26554f20648f0a27c2c510c055cbec81c43416c7`, tree `3f6d2359ca87ec31853fbbfccc6bb1ffb6fb68ba` equal to final PR tree;
          - main CI `38783605087` / `116589825599` GREEN; Android `38783604964` / `116589827934` GREEN;
          - Pages `38783697902`, build `116590143603` + deploy `116590341097` GREEN.

          Issue #379 CLOSED / completed. J6B-A is **DEPLOYED / FROZEN**.

          '''
          s = replace_exact(s, '## Documentation canonicals\n', evidence + '## Documentation canonicals\n', 'ledger J6B-A evidence')
          s = replace_exact(
              s,
              '- DOC30 — J6A closure & J6B-A event identity vocabulary activation: Issue #377, branch `docs/es-13-j6a-closure-j6ba-activation`, in progress from gameplay canonical `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`.',
              '- DOC30 — J6A closure & J6B-A event identity vocabulary activation: `26554f20648f0a27c2c510c055cbec81c43416c7` — Issue #377 / PR #378.\n- DOC31 — J6B-A closure & J6B-B deterministic event selection activation: Issue #381, branch `docs/es-13-j6ba-closure-j6bb-activation`, in progress from gameplay canonical `204566693978adabba7e66995c88ae2f85818f8b`.',
              'ledger DOC30/DOC31',
          )
          next_section = '''### ES-13J6B-B — Pure Deterministic Dynamic Event Identity Selection Contract
          Status: **NEXT ENGINEERING TARGET AFTER DOC31 CLOSURE**.

          J6A is frozen as opportunity-only and J6B-A as identity-only. J6B-B may select exactly one frozen identity from a valid current J6A `identityFingerprint` without creating new randomness or runtime effect authority.

          J6B-B may own semantic selection only (`SELECTION_ONLY`). It must not map identities to mutators/environment effects, execute live behavior, adopt into runtime, or own spawn/progression, collections, combat/economy, environment mutation, scan/lookup, timing/RNG, cap/budget or entity authority. Live effect mapping remains later and must reuse existing frozen environmental systems.

          '''
          s = replace_regex(
              s,
              r'### ES-13J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract\n.*?(?=J4D\+ additional tactical families remain deferred:)',
              next_section,
              'ledger next gameplay',
          )
          s = replace_exact(
              s,
              '`J6B-A Pure Dynamic Mid-Sector Event Identity Vocabulary Contract → J6B-B+ Deterministic Selection/Certified Live Mapping → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance → ES-14 Living Warfront`',
              '`J6B-B Pure Deterministic Dynamic Event Identity Selection Contract → J6B-C+ Certified Effect Mapping/Live Adoption → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance → ES-14 Living Warfront`',
              'ledger program sequence',
          )
          p.write_text(s)

          # CONTINUITY
          p = Path('docs/PROJECT_CONTINUITY.md')
          s = p.read_text()
          current = '''## Current certified gameplay canonical

          `204566693978adabba7e66995c88ae2f85818f8b`

          Phase: **ES-13J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract**
          Status: **DEPLOYED / FROZEN**
          Issue: #379 — CLOSED / completed
          Delivery: PR #380 — squash merged

          Single parent: `26554f20648f0a27c2c510c055cbec81c43416c7` — DOC30 documentation canonical.

          Canonical tree: `3f6d2359ca87ec31853fbbfccc6bb1ffb6fb68ba`, exactly equal to final PR-head tree.

          '''
          s = replace_regex(
              s,
              r'## Current certified gameplay canonical\n.*?(?=Version remains `0\.2\.0-beta\.1`\.)',
              current,
              'continuity current canonical',
          )

          result = '''## J6B-A result
          J6B-A established the first bounded event identity vocabulary without selecting or executing an event.

          Certified contract:
          - exactly five immutable IDs: `SOLAR_STORM`, `QUANTUM_RIFT`, `BLACKOUT_SURGE`, `CRYSTAL_RUSH`, `DYSON_ECLIPSE`;
          - exact deterministic lookup; malformed/unsupported/deferred IDs fail closed;
          - immutable `ENVIRONMENTAL_IDENTITY` / `IDENTITY_ONLY` profiles;
          - no opportunity/event selection, effect mapping, runtime adoption, spawn/progression, collection, combat/economy, environment, scan/lookup, timing/RNG, cap/budget or entity authority.

          Final product scope exactly:
          - `src/game/dynamicMidSectorEventIdentity.ts`;
          - `tests/es-13j6ba-dynamic-mid-sector-event-identity.test.mjs`;
          - `tests/gameplay/dynamic-mid-sector-event-identity.test.ts`.

          ## J6B-A exact evidence
          - DOC30 baseline `26554f20648f0a27c2c510c055cbec81c43416c7`;
          - pre-PR SHA `cd2abd12e20082382611bf08cac2d3d89f693adc`, run `38782799375` / job `116587050168` GREEN including repo/gameplay/platform/typecheck/release/dossier/build/readiness, exact scope guard and Android APK build/verify/upload;
          - final PR #380 head `2aae2803d302bea80c3f0b0748bda10c6fcaffcd`;
          - PR CI `38783326052` / `116588875589` GREEN;
          - PR Android `38783326187` / `116588876111` GREEN including Build/Verify/Upload APK;
          - canonical `204566693978adabba7e66995c88ae2f85818f8b`, single parent `26554f20648f0a27c2c510c055cbec81c43416c7`, tree `3f6d2359ca87ec31853fbbfccc6bb1ffb6fb68ba` equal to final PR-head tree;
          - canonical diff exactly three certified product/test files;
          - main CI `38783605087` / `116589825599` GREEN;
          - main Android `38783604964` / `116589827934` GREEN including Build/Verify/Upload APK;
          - Pages `38783697902`: build `116590143603` + deploy `116590341097` GREEN.

          Issue #379 CLOSED / completed. J6B-A is **DEPLOYED / FROZEN**.

          '''
          s = replace_exact(s, '## ES-13 gameplay canonicals\n', result + '## ES-13 gameplay canonicals\n', 'continuity J6B-A evidence')
          s = replace_exact(
              s,
              '- J6A — Pure Dynamic Mid-Sector Event Opportunity Contract: `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`.',
              '- J6A — Pure Dynamic Mid-Sector Event Opportunity Contract: `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`.\n- J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract: `204566693978adabba7e66995c88ae2f85818f8b`.',
              'continuity canonical list',
          )
          s = replace_exact(
              s,
              '- DOC30 — J6A closure & J6B-A event identity vocabulary activation: Issue #377, branch `docs/es-13-j6a-closure-j6ba-activation`, documentation-only closure in progress from gameplay canonical `69ac8a1a83d2f6bbe6a989a3a819fac438e854c1`.',
              '- DOC30 — J6A closure & J6B-A event identity vocabulary activation: `26554f20648f0a27c2c510c055cbec81c43416c7` — Issue #377 / PR #378.\n- DOC31 — J6B-A closure & J6B-B deterministic event selection activation: Issue #381, branch `docs/es-13-j6ba-closure-j6bb-activation`, documentation-only closure in progress from gameplay canonical `204566693978adabba7e66995c88ae2f85818f8b`.',
              'continuity DOC30/DOC31',
          )
          next_cont = '''### ES-13J6B-B — Pure Deterministic Dynamic Event Identity Selection Contract
          Status: **NEXT ENGINEERING TARGET AFTER DOC31 CLOSURE**

          J6A is frozen as opportunity-only and J6B-A as identity-only. J6B-B composes those frozen facts to select exactly one event identity deterministically from the existing J6A fingerprint.

          Required direction:
          - validate current J6A opportunity identity and exact 8-lowercase-hex fingerprint;
          - select one of the five frozen J6B-A IDs with no new RNG/clock/seed authority;
          - emit immutable `SELECTION_ONLY` metadata only;
          - no mutator/effect mapping or live execution;
          - no adoption into `EnergySwarmGame.tsx`, Infinite directors or environmental runtime;
          - no spawn/progression, collection, combat/economy, environment mutation, scan/lookup, timing/RNG, cap/budget or entity authority;
          - any J6B-C+ live mapping must separately prove compatibility and reuse frozen environmental authorities.

          '''
          s = replace_regex(
              s,
              r'### ES-13J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract\n.*?(?=J4D\+ additional tactical families remain \*\*DEFERRED)',
              next_cont,
              'continuity next gameplay',
          )
          s = replace_exact(
              s,
              '`J6B-A Pure Dynamic Mid-Sector Event Identity Vocabulary Contract → J6B-B+ Deterministic Selection/Certified Live Mapping → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance`',
              '`J6B-B Pure Deterministic Dynamic Event Identity Selection Contract → J6B-C+ Certified Effect Mapping/Live Adoption → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance`',
              'continuity gameplay chronology',
          )
          s = replace_regex(
              s,
              r'Suggested handoff:\n>.*?(?=\n\n## Update obligation)',
              'Suggested handoff:\n> Continue ORBI Energy Swarm autonomously. Repository `ingeniusvictor/orbi-energy.swarm`. J6B-A gameplay canonical is `204566693978adabba7e66995c88ae2f85818f8b`, fully DEPLOYED / FROZEN via Issue #379 / PR #380 with exactly five immutable IDENTITY_ONLY event identities and post-main CI/Android/Pages GREEN. Complete DOC31 if still open, then implement J6B-B as a pure deterministic selection contract over the frozen J6A opportunity + J6B-A vocabulary: validate the current opportunity/fingerprint, choose one frozen event ID using only the existing fingerprint, emit SELECTION_ONLY metadata, and add no mutator/effect mapping, runtime adoption, spawn/collection/combat/economy/environment/timing/scan/cap/entity authority. Keep live mapping for J6B-C+ and reuse existing environmental authorities. Keep J3C-C, J4D+ and manual blockers deferred. Follow Issue → Branch → full gates → PR → exact-SHA post-merge evidence. Never touch `main` directly or weaken tests.',
              'continuity handoff',
          )
          p.write_text(s)
          PY

      - name: Commit exact DOC31 candidate locally
        shell: bash
        run: |
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git diff --cached --quiet && { echo "DOC31 produced no documentation change"; exit 1; }
          git commit -m "ES-13DOC31: close J6B-A and activate J6B-B"

      - name: Install dependencies
        run: npm ci
      - name: Repository Smoke
        run: npm run test:repo
      - name: Gameplay regression
        run: npm run test:gameplay
      - name: Platform regression
        run: npm run test:platform
      - name: Typecheck
        run: npm run typecheck
      - name: Release Contract
        run: npm run release:verify
      - name: Manual dossier
        run: npm run release:evidence:verify
      - name: Production Build
        run: npm run build
      - name: RC readiness fail-closed
        run: npm run release:readiness

      - name: DOC31 exact scope guard
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${files[@]}"
          expected=(
            ".github/workflows/es-13doc31-patch-cert.yml"
            "docs/ES13_GAMEPLAY_ROADMAP.md"
            "docs/IMPLEMENTATION_LEDGER.md"
            "docs/PROJECT_CONTINUITY.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${#files[@]}" -eq "${#expected_sorted[@]}" ]]
          for i in "${!files[@]}"; do
            [[ "${files[$i]}" == "${expected_sorted[$i]}" ]]
          done
          grep -Fq '204566693978adabba7e66995c88ae2f85818f8b' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J6B-B — Pure Deterministic Dynamic Event Identity Selection Contract' docs/PROJECT_CONTINUITY.md
          ! git diff --name-only "$BASE_SHA"...HEAD | grep -Eq '^(src/|tests/|android/|public/|package(-lock)?\.json$)'

      - name: Push certified DOC31 candidate
        shell: bash
        run: git push origin HEAD:docs/es-13-j6ba-closure-j6bb-activation
