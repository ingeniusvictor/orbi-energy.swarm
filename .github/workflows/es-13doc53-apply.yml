name: ES-13DOC53 guarded documentation apply

on:
  push:
    branches:
      - docs/es-13-j8o-closure-j8p-public-score-attack-ui
    paths:
      - .github/workflows/es-13doc53-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: docs/es-13-j8o-closure-j8p-public-score-attack-ui
          fetch-depth: 0

      - name: Apply guarded DOC53 updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          CANONICAL = "89d1dea159f8478c2e2ccc01f027c2e9041a4542"
          PARENT = "7ed00b7f28f8c3dd6578932f8e77845e8618d853"
          TREE = "3688799786e8700309e002a5ab75b4d0f7661f74"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def require_once(text, marker, path):
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{path}: expected marker once, got {count}: {marker}")

          def replace_between(text, start, end, replacement, path):
              require_once(text, start, path)
              require_once(text, end, path)
              i = text.index(start)
              j = text.index(end, i)
              if j <= i:
                  raise SystemExit(f"{path}: invalid marker ordering")
              return text[:i] + replacement + text[j:]

          j8o_roadmap = '''### ES-13J8O — Controlled Live Score Attack Engine Lifecycle Adoption
          Status: **DEPLOYED / FROZEN**
          Canonical: `89d1dea159f8478c2e2ccc01f027c2e9041a4542`  
          Issue #469 / PR #470

          J8O is the first controlled live Score Attack engine-lifecycle adoption over the frozen J8K→J8N prerequisite chain:
          - Campaign remains the unchanged/default public start path; Score Attack is still not publicly selectable in J8O;
          - internal `SCORE_ATTACK` start consumes only frozen J8L activation authority and installs its exact nested INFINITE runtime/session plus one scalar activation-envelope ref;
          - active Score Attack runtime reads reuse frozen J8L/J8K projection facts and bypass the generic runtime projection cache/adaptive/dynamic/bonus adoption path for that attempt;
          - the existing TIMEBOX timer remains the sole timer/clock and uses the frozen `60000 ms` descriptor;
          - terminal completion is intercepted before generic Infinite advancement and never advances Infinite progression;
          - J8M + J8N supply finalization and dedicated-record application; storage is touched only through existing `updateStatsAndSave(...)` when `scoreAttackBestScore` actually changes;
          - tied/below outcomes do not write GameStats/storage and premature Score Attack game-over skips generic `applyFinalRunCommit(...)`, global highScore, archive and generic counters;
          - Score Attack activation identity is cleared at reset/new-run and terminal boundaries;
          - `StartScreen`, `ResultScreen` and `GameHud` remain unchanged in J8O.

          Certification discovered one historical static platform expectation that required evidence-driven evolution: the runtime completion snapshot fields were preserved exactly but extracted to one shared `completionSnapshot` reused by both `isRuntimeWaveComplete(...)` and Score Attack finalization. Only `tests/runtime-completion-adoption.test.ts` widened (`+5/-1`); no frozen J8K/J8L/J8M/J8N source changed.

          Exact deployment anchors:
          - initial pre-PR run `38975238440`: certify `117222979343` RED only on Platform regression; Android `117222978976` GREEN;
          - diagnostic run `38984992393` isolated `wave transitions tick time only through the completion policy contract` without weakening the platform command/exit semantics;
          - final pre-PR SHA `01ca757d75f6c36c486277088cb90985ca4037a2`, run `38985148756`, certify `117254768498` + Android `117254768331` GREEN;
          - clean PR #470 head `d2e8935cfa321d47fe4c01373823ea400548c976` after temporary certifier removal;
          - PR CI `38985359191` / `117255442942` GREEN; Android `38985359228` / `117255443134` GREEN;
          - canonical `89d1dea159f8478c2e2ccc01f027c2e9041a4542`, parent `7ed00b7f28f8c3dd6578932f8e77845e8618d853`, tree `3688799786e8700309e002a5ab75b4d0f7661f74`, exact final diff five files;
          - main CI `38985499689` / `117255904499` GREEN; Android `38985499754` / `117255905187` GREEN with APK build/verify/upload;
          - Pages/Web Beta `38985557153`, build `117256089658` + deploy `117256175826` GREEN;
          - Issue #469 CLOSED / completed.

          ### ES-13J8P — Controlled Public Score Attack Selection & Presentation Adoption
          Status: **NEXT CONTRACT TARGET AFTER DOC53 CLOSURE**

          J8P is the first public-UI slice over frozen J8O. It must expose Score Attack on `StartScreen` while preserving Campaign as the unchanged/default primary launch path, and public Score Attack start must delegate to the existing frozen J8O `startGameWithMode("SCORE_ATTACK")` seam rather than duplicating bootstrap/runtime authority.

          J8P may add only a low-frequency presentation-mode identity sufficient for `StartScreen` / `GameHud` / `ResultScreen` attribution and result/restart continuity. That identity must stay outside `RuntimeProgressionState`, may not replace the J8O activation envelope, and owns no timer/clock, score, persistence or progression semantics. Presentation may consume frozen J8A display/objective identity, frozen TIMEBOX / `60000 ms` facts and dedicated `scoreAttackBestScore` only. Result presentation must not reuse global highScore/generic Campaign victory/archive/reward semantics as if they belonged to Score Attack. Campaign and normal Infinite behavior/presentation remain unchanged.

          J8P must not change J8A–J8O frozen authorities except the minimum controlled integration seams demonstrated necessary by UI discovery; no new runtime discriminator/cache/timer/clock/completion cursor, score formula, reward/economy, generic highScore/archive/counter write, spawn/arena/cap/budget/entity/projectile/FOTON/formation authority is allowed.

          '''

          roadmap_path = "docs/ES13_GAMEPLAY_ROADMAP.md"
          roadmap = read(roadmap_path)
          roadmap = replace_between(
              roadmap,
              "### ES-13J8O — Controlled Live Score Attack Engine Lifecycle Adoption",
              "## J9 — Boss & Miniboss Expansion",
              j8o_roadmap,
              roadmap_path,
          )
          if CANONICAL not in roadmap or "ES-13J8P" not in roadmap:
              raise SystemExit("roadmap validation failed")
          write(roadmap_path, roadmap)

          ledger_path = "docs/IMPLEMENTATION_LEDGER.md"
          ledger = read(ledger_path)
          j8n_row = "| ES-13J8N — Pure Dedicated Score Attack Stats-Commit Application Contract | DEPLOYED / FROZEN | `d0e9af1c3c8f94524187f7d8ee48c975e2bd9f3e` | #465 | #466 |"
          j8o_row = "| ES-13J8O — Controlled Live Score Attack Engine Lifecycle Adoption | DEPLOYED / FROZEN | `89d1dea159f8478c2e2ccc01f027c2e9041a4542` | #469 | #470 |"
          require_once(ledger, j8n_row, ledger_path)
          if j8o_row in ledger:
              raise SystemExit("ledger J8O row already exists")
          ledger = ledger.replace(j8n_row, j8n_row + "\n" + j8o_row, 1)

          j8o_ledger_evidence = '''### J8O — Controlled Live Score Attack Engine Lifecycle Adoption
          - Internal Score Attack start consumes frozen J8L and preserves Campaign as the default/public start path in J8O.
          - Frozen J8L/J8K owns effective runtime projection; the existing TIMEBOX / 60000 timer remains the sole timer/clock.
          - Terminal completion is intercepted before Infinite advancement; frozen J8M + J8N own finalization/dedicated record semantics; generic run persistence/highScore/archive/counters remain isolated.
          - Initial run `38975238440` exposed one historical static Platform assertion; diagnostic `38984992393` proved shared completion-snapshot extraction, not a live-engine defect.
          - Minimum test-only widening was `tests/runtime-completion-adoption.test.ts` (`+5/-1`); frozen J8K/J8L/J8M/J8N source remained unchanged.
          - Final pre-PR `01ca757d75f6c36c486277088cb90985ca4037a2`: run `38985148756`, certify `117254768498` + Android `117254768331` GREEN.
          - PR #470 head `d2e8935cfa321d47fe4c01373823ea400548c976`: CI `38985359191` / `117255442942` + Android `38985359228` / `117255443134` GREEN.
          - Canonical `89d1dea159f8478c2e2ccc01f027c2e9041a4542`, parent `7ed00b7f28f8c3dd6578932f8e77845e8618d853`, tree `3688799786e8700309e002a5ab75b4d0f7661f74`, exact final diff five files.
          - Main CI `38985499689` / `117255904499`, Android `38985499754` / `117255905187`, Pages `38985557153` build `117256089658` + deploy `117256175826` GREEN.

          '''
          next_marker = "## Next planned gameplay"
          require_once(ledger, next_marker, ledger_path)
          ledger = ledger.replace(next_marker, j8o_ledger_evidence + next_marker, 1)

          next_ledger = '''## Next planned gameplay

          ### ES-13J8P — Controlled Public Score Attack Selection & Presentation Adoption
          Status: **NEXT CONTRACT TARGET AFTER DOC53 CLOSURE**.

          J8P must expose frozen J8O through controlled public UI only: Campaign remains the default/primary launch path; Score Attack delegates to `startGameWithMode("SCORE_ATTACK")`; one low-frequency presentation-mode identity may survive terminal activation cleanup only for StartScreen/HUD/ResultScreen attribution and same-mode restart continuity; it stays outside `RuntimeProgressionState` and owns no engine semantics. StartScreen may display canonical Score Attack/60 s/dedicated-best facts, HUD may attribute the active mode using existing timer facts, and ResultScreen must use the dedicated Score Attack record rather than generic/global highScore semantics. Campaign/Infinite remain unchanged.

          No new runtime discriminator/cache/timer/clock/completion cursor, score formula/reward/economy, generic archive/counter/highScore write, spawn/arena/caps/budgets/entities/projectiles/FOTON/formation authority.

          '''
          ledger = replace_between(
              ledger,
              "## Next planned gameplay",
              "J4D+ additional tactical families remain deferred",
              next_ledger,
              ledger_path,
          )
          if ledger.count(j8o_row) != 1 or "ES-13J8P" not in ledger:
              raise SystemExit("ledger validation failed")
          write(ledger_path, ledger)

          continuity_path = "docs/PROJECT_CONTINUITY.md"
          continuity = read(continuity_path)
          current_block = '''## Current certified gameplay canonical

          `89d1dea159f8478c2e2ccc01f027c2e9041a4542`

          Phase: **ES-13J8O — Controlled Live Score Attack Engine Lifecycle Adoption**
          Status: **DEPLOYED / FROZEN**
          Issue: #469 — CLOSED / completed
          Delivery: PR #470 — squash merged

          Single parent: `7ed00b7f28f8c3dd6578932f8e77845e8618d853` — DOC52 documentation canonical.

          Canonical tree: `3688799786e8700309e002a5ab75b4d0f7661f74`.

          '''
          continuity = replace_between(
              continuity,
              "## Current certified gameplay canonical",
              "Version remains `0.2.0-beta.1`.",
              current_block,
              continuity_path,
          )

          j8o_continuity = '''## J8O result
          J8O completed the first controlled live Score Attack engine lifecycle without exposing a public Score Attack selector or giving UI components runtime authority. Internal `SCORE_ATTACK` start installs the exact frozen J8L nested Infinite runtime/activation envelope, uses frozen J8K projection facts and the existing TIMEBOX / 60000 timer, intercepts terminal completion before Infinite advancement, applies frozen J8M/J8N dedicated-record semantics, persists only a changed `scoreAttackBestScore` through `updateStatsAndSave(...)`, skips generic run persistence/highScore/archive/counters and clears activation identity at reset/terminal boundaries.

          The first pre-PR certification found one historical static platform expectation, not a product defect: completion snapshot fields remained exact but moved into one shared `completionSnapshot` reused by completion and Score Attack finalization. The minimum evidence-driven widening changed only `tests/runtime-completion-adoption.test.ts` (`+5/-1`).

          ## J8O exact evidence
          - DOC52 baseline `7ed00b7f28f8c3dd6578932f8e77845e8618d853`;
          - initial pre-PR run `38975238440`: certify `117222979343` RED only on Platform regression; Android `117222978976` GREEN;
          - diagnostic run `38984992393` isolated the historical assertion while preserving the same platform command/exit semantics;
          - final pre-PR SHA `01ca757d75f6c36c486277088cb90985ca4037a2`, run `38985148756`, certify `117254768498` + Android `117254768331` GREEN;
          - clean PR #470 head `d2e8935cfa321d47fe4c01373823ea400548c976` after temporary certifier removal;
          - PR CI `38985359191` / `117255442942` GREEN;
          - PR Android `38985359228` / `117255443134` GREEN including APK build/verify/upload;
          - canonical `89d1dea159f8478c2e2ccc01f027c2e9041a4542`, single parent `7ed00b7f28f8c3dd6578932f8e77845e8618d853`, tree `3688799786e8700309e002a5ab75b4d0f7661f74`, exact final diff five files;
          - main CI `38985499689` / `117255904499` GREEN;
          - main Android `38985499754` / `117255905187` GREEN including Build/Verify/Upload APK;
          - Pages/Web Beta `38985557153`: build `117256089658` + deploy `117256175826` GREEN.

          Issue #469 CLOSED / completed. J8O is **DEPLOYED / FROZEN**.

          '''
          next_phase_marker = "## Next gameplay phase"
          require_once(continuity, next_phase_marker, continuity_path)
          continuity = continuity.replace(next_phase_marker, j8o_continuity + next_phase_marker, 1)

          next_continuity = '''## Next gameplay phase

          ### ES-13J8P — Controlled Public Score Attack Selection & Presentation Adoption
          Status: **NEXT CONTRACT TARGET AFTER DOC53 CLOSURE**

          Discovery after J8O shows the live engine is ready but public surfaces still cannot safely infer mode identity after terminal cleanup: `StartScreen` only has `onStartGame()`, `GameHud` has no mode identity and derives Campaign objective vocabulary, and `ResultScreen` uses generic/global `highScore`. J8P must therefore add only a presentation-mode carrier outside `RuntimeProgressionState`, expose Score Attack through the frozen J8O start seam, and give StartScreen/HUD/ResultScreen bounded Score Attack attribution using frozen J8A identity, TIMEBOX / 60000 facts and dedicated `scoreAttackBestScore`.

          Campaign remains the default/primary start path. J8P must not duplicate J8O activation/runtime construction, create a second timer/countdown authority, change score/reward/economy, reuse generic Campaign/Infinite persistence as Score Attack persistence, or change spawn/arena/caps/budgets/entities/projectiles/FOTON/formations. Score Attack result presentation must distinguish its dedicated record from global highScore and must not imply generic Campaign victory/archive/reward semantics.

          '''
          continuity = replace_between(
              continuity,
              "## Next gameplay phase",
              "## Resolved diagnostics",
              next_continuity,
              continuity_path,
          )

          handoff_start = "Suggested handoff:"
          handoff_end = "## Update obligation"
          new_handoff = '''Suggested handoff:
          > Continue ORBI Energy Swarm autonomously. Repository `ingeniusvictor/orbi-energy.swarm`. J8O gameplay canonical is `89d1dea159f8478c2e2ccc01f027c2e9041a4542`, fully DEPLOYED / FROZEN via Issue #469 / PR #470 with exact post-main CI/Android/Pages GREEN. Complete DOC53 if still open, then implement ES-13J8P as the controlled public Score Attack selection/presentation adoption: Campaign remains the default primary launch; public Score Attack delegates to frozen J8O; keep one low-frequency presentation-mode identity outside RuntimeProgressionState for StartScreen/HUD/ResultScreen and same-mode result/restart continuity; consume frozen Score Attack identity/TIMEBOX/dedicated-best facts only; do not create another timer, runtime discriminator, score/economy/persistence authority or touch caps/budgets/FOTON/formations. Preserve J3C-C/J4D+ deferrals and manual blockers. Follow Issue → exact-base branch → full gates → PR → exact-SHA post-merge evidence. Never touch `main` directly or weaken tests.

          '''
          continuity = replace_between(
              continuity,
              handoff_start,
              handoff_end,
              new_handoff,
              continuity_path,
          )
          if CANONICAL not in continuity or "ES-13J8P" not in continuity:
              raise SystemExit("continuity validation failed")
          write(continuity_path, continuity)

          # Final scope guard before committing: only three docs plus this temporary helper may differ.
          PY

          git diff --check
          git status --short
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/es-13doc53-apply.yml' \
            'docs/ES13_GAMEPLAY_ROADMAP.md' \
            'docs/IMPLEMENTATION_LEDGER.md' \
            'docs/PROJECT_CONTINUITY.md' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected scope before helper cleanup"
            printf 'Changed:\n%s\nExpected:\n%s\n' "$changed" "$expected"
            exit 1
          fi

      - name: Commit docs and remove temporary helper
        shell: bash
        run: |
          rm .github/workflows/es-13doc53-apply.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            'docs/ES13_GAMEPLAY_ROADMAP.md' \
            'docs/IMPLEMENTATION_LEDGER.md' \
            'docs/PROJECT_CONTINUITY.md' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Final DOC53 scope mismatch"
            printf 'Changed:\n%s\nExpected:\n%s\n' "$changed" "$expected"
            exit 1
          fi
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md .github/workflows/es-13doc53-apply.yml
          git commit -m "ES-13DOC53 — Close J8O and activate J8P public Score Attack UI"
          git push origin HEAD:docs/es-13-j8o-closure-j8p-public-score-attack-ui
