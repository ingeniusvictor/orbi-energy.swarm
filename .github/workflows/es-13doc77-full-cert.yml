name: ES-13DOC77 full docs pre-PR certification
on:
  push:
    branches:
      - docs/es-13-doc77-close-j9lb2b1
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repository, gameplay and platform tests
        run: npm run test:repo && npm run test:gameplay && npm run test:platform
      - name: Typecheck
        run: npm run typecheck
      - name: Release verify
        run: npm run release:verify
      - name: Evidence verify
        run: npm run release:evidence:verify
      - name: Production build
        run: npm run build
      - name: RC readiness
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: es-13doc77-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
