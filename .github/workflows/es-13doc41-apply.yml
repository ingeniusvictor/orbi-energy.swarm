name: ES-13DOC41 Apply

on:
  push:
    branches:
      - docs/es-13-j8c-closure-j8d-record-projection
    paths:
      - scripts/es13doc41_apply.py
      - .github/workflows/es-13doc41-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/es-13-j8c-closure-j8d-record-projection
          fetch-depth: 0
      - name: Apply DOC41 fail-closed
        run: python scripts/es13doc41_apply.py
      - name: Validate exact DOC41 scope and preservation
        run: |
          set -euo pipefail
          git diff --name-only 78dfd39af5172499e7d82b8a62385a8e49f0e403 -- \
            ':!.github/workflows/es-13doc41-apply.yml' ':!scripts/es13doc41_apply.py' | sort > /tmp/files.txt
          printf '%s\n' \
            docs/ES13_GAMEPLAY_ROADMAP.md \
            docs/IMPLEMENTATION_LEDGER.md \
            docs/PROJECT_CONTINUITY.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt
          grep -Fq '#4' docs/PROJECT_CONTINUITY.md
          grep -Fq '#5' docs/PROJECT_CONTINUITY.md
          grep -Fq '#202' docs/PROJECT_CONTINUITY.md
          grep -Fq '#248' docs/PROJECT_CONTINUITY.md
          grep -Fq '#254' docs/PROJECT_CONTINUITY.md
          grep -Fq '#283' docs/PROJECT_CONTINUITY.md
          grep -Fq 'J3C-C' docs/PROJECT_CONTINUITY.md
          grep -Fq 'J4D+' docs/PROJECT_CONTINUITY.md
          grep -Fq '## J9 — Boss & Miniboss Expansion' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '78dfd39af5172499e7d82b8a62385a8e49f0e403' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J8D' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J8D' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq 'ES-13J8D' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'SCORE_ATTACK_BEST_SCORE' docs/PROJECT_CONTINUITY.md
          grep -Fq 'SCORE_ATTACK_BEST_SCORE' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq 'SCORE_ATTACK_BEST_SCORE' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'Number.MAX_SAFE_INTEGER' docs/PROJECT_CONTINUITY.md
          grep -Fq 'Number.MAX_SAFE_INTEGER' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq 'Number.MAX_SAFE_INTEGER' docs/ES13_GAMEPLAY_ROADMAP.md
      - name: Commit DOC41 docs
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'ES-13DOC41: close J8C and activate J8D record projection'
          git push origin HEAD:docs/es-13-j8c-closure-j8d-record-projection
