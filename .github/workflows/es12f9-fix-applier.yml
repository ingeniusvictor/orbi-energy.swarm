name: ES-12F9 Fix Applier

on:
  push:
    branches:
      - feat/es-12f9-gaia-fusion-evolution

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[fix-applier-done]') && !contains(github.event.head_commit.message, '[es12f9-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/es-12f9-gaia-fusion-evolution
          fetch-depth: 0
      - name: Replace fragile consolidation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/es12f9-apply.yml')
          text = path.read_text()
          start_marker = "          game = replace_once(\n              game,\n              '''      // From these candidates, find the lowest level and XP"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('fragile guard patch block not found')
          end = text.find("\n\n          game = replace_once(", start + len(start_marker))
          if end < 0:
              raise SystemExit('next patch block not found')

          replacement = '''          game = replace_once(
              game,
              '      candidates = swarmRef.current;',
              ''' + "'''" + '''      candidates = swarmRef.current.filter(
                (m) => m.energyId !== "GAIA",
              );''' + "'''" + ''',
              'gaia consolidation fallback',
          )'''

          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit hardened applier
        run: |
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add .github/workflows/es12f9-apply.yml
          git commit -m "chore: harden ES-12F9 consolidation patch [fix-applier-done]"
          git push origin HEAD:feat/es-12f9-gaia-fusion-evolution
