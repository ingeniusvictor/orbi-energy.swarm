name: ES-13DOC38 Certification

on:
  push:
    branches:
      - docs/es-13-j7d-j7-closure-j8-discovery
    paths:
      - .github/workflows/es-13doc38-cert.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repository Smoke
        run: npm run test:repo
      - name: Gameplay regression
        run: npm run test:gameplay
      - name: Platform regression
        run: npm run test:platform
      - name: Typecheck
        run: npm run typecheck
      - name: Release Contract
        run: npm run release:verify
      - name: Manual dossier
        run: npm run release:evidence:verify
      - name: Production Build
        run: npm run build
      - name: RC readiness fail-closed
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json
      - name: DOC38 exact scope and preservation guard
        run: |
          set -euo pipefail
          git diff --name-only 9440b31b0c8dca2da0cfe92a5f02cbf7065e6d67 -- \
            ':!.github/workflows/es-13doc38-cert.yml' | sort > /tmp/files.txt
          printf '%s\n' \
            docs/ES13_GAMEPLAY_ROADMAP.md \
            docs/IMPLEMENTATION_LEDGER.md \
            docs/PROJECT_CONTINUITY.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt
          test -z "$(git diff --name-only 9440b31b0c8dca2da0cfe92a5f02cbf7065e6d67 -- src tests package.json package-lock.json public android)"
          grep -Fq '9440b31b0c8dca2da0cfe92a5f02cbf7065e6d67' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J7D — Controlled Live Timed Survival Adoption' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq 'DEPLOYED / FROZEN — FIRST CERTIFIED VERTICAL SLICE' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'NEXT ARCHITECTURE / DISCOVERY TARGET AFTER DOC38 CLOSURE' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '## J9 — Boss & Miniboss Expansion' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '#4' docs/PROJECT_CONTINUITY.md
          grep -Fq '#5' docs/PROJECT_CONTINUITY.md
          grep -Fq '#202' docs/PROJECT_CONTINUITY.md
          grep -Fq '#248' docs/PROJECT_CONTINUITY.md
          grep -Fq '#254' docs/PROJECT_CONTINUITY.md
          grep -Fq '#283' docs/PROJECT_CONTINUITY.md
          grep -Fq 'J3C-C' docs/PROJECT_CONTINUITY.md
          grep -Fq 'J4D+' docs/PROJECT_CONTINUITY.md
      - name: Upload RC readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13doc38-rc-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30
