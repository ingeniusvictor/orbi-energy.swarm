name: ES-13J9L-B2B1 full pre-PR certification
on:
  push:
    branches:
      - es-13j9l-b2b1-architect-encounter-claim-preflight
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused static and gameplay
        run: node --test tests/es-13j9lb2b1-encounter-claim-preflight.test.mjs && npx tsx --test tests/gameplay/blackout-architect-encounter-claim-preflight.test.ts
      - name: Full repository, gameplay and platform suites
        run: npm run test:repo && npm run test:gameplay && npm run test:platform
      - name: Typecheck
        run: npm run typecheck
      - name: Release contract
        run: npm run release:verify
      - name: Evidence dossier
        run: npm run release:evidence:verify
      - name: Build
        run: npm run build
      - name: Release readiness
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: es-13j9lb2b1-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - run: npm ci
      - name: Build Android APK
        run: npm run android:debug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: es-13j9lb2b1-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
