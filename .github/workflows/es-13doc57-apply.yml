name: ES-13DOC57 guarded docs applicator

on:
  push:
    branches:
      - docs/es-13-doc57-close-j9c-activate-j9d
    paths:
      - '.github/workflows/es-13doc57-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DOC57 branch
        uses: actions/checkout@v4
        with:
          ref: docs/es-13-doc57-close-j9c-activate-j9d
          fetch-depth: 0

      - name: Apply exact DOC57 patch
        run: python3 scripts/es-13doc57-apply.py

      - name: Verify whitespace and exact docs scope
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            docs/ES13_GAMEPLAY_ROADMAP.md
            docs/IMPLEMENTATION_LEDGER.md
            docs/PROJECT_CONTINUITY.md
          )
          [ "${#changed[@]}" -eq "${#expected[@]}" ]
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null; done
          grep -F 'ACTIVE PROGRAM — J9C DEPLOYED / J9D NEXT' docs/ES13_GAMEPLAY_ROADMAP.md >/dev/null
          grep -F '370f770171993760a3e11fa0aa95bcaa4318b758' docs/IMPLEMENTATION_LEDGER.md >/dev/null
          grep -F 'ES-13J9D — Pure Blackout Architect Chassis Selection/Binding Contract' docs/PROJECT_CONTINUITY.md >/dev/null

      - name: Commit and push DOC57 docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m "ES-13DOC57 — close J9C and activate J9D chassis selection"
          git push origin HEAD:docs/es-13-doc57-close-j9c-activate-j9d
