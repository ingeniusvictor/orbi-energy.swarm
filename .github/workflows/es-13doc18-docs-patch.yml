name: ES-13DOC18 Documentation Certification

on:
  push:
    branches:
      - docs/es-13-j4c-b-closure-j4c-c-activation
    paths:
      - '.github/workflows/es-13doc18-docs-patch.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
      ORBI_RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay
        run: npm run test:gameplay

      - name: Platform
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release Contract
        run: npm run release:verify

      - name: Manual dossier
        run: npm run release:evidence:verify

      - name: Production Build
        run: npm run build

      - name: RC readiness fail-closed
        run: npm run release:readiness -- --output release-readiness.json

      - name: DOC18 docs-only scope guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = '2e16ff9a577128ffb06211b612116553928c8cda'
          git diff --check 2e16ff9a577128ffb06211b612116553928c8cda...HEAD
          changed="$(git diff --name-only 2e16ff9a577128ffb06211b612116553928c8cda...HEAD | sort)"
          expected="$(printf '%s\n' '.github/es13doc18_patch.py' '.github/workflows/es-13doc18-docs-patch.yml' 'docs/ES13_GAMEPLAY_ROADMAP.md' 'docs/IMPLEMENTATION_LEDGER.md' 'docs/PROJECT_CONTINUITY.md' | sort)"
          printf 'DOC18 pre-cert changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          grep -Fq 'ES-13J4C-B — Live Siege Volley Telegraph Integration' docs/PROJECT_CONTINUITY.md
          grep -Fq '2e16ff9a577128ffb06211b612116553928c8cda' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J4C-C — Controlled Normal-Progression Siege Adoption' docs/PROJECT_CONTINUITY.md
          grep -Fq '| ES-13J4C-B — Live Siege Volley Telegraph Integration | DEPLOYED / FROZEN | `2e16ff9a577128ffb06211b612116553928c8cda` | #326 | #327 + #328 |' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '### J4C-B — Live Siege Volley Telegraph Integration' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '### J4C-C — Controlled Normal-Progression Siege Adoption' docs/ES13_GAMEPLAY_ROADMAP.md
          git diff --quiet 2e16ff9a577128ffb06211b612116553928c8cda...HEAD -- src tests android public package.json package-lock.json
