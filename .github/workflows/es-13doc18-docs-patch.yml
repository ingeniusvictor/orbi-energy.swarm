name: ES-13DOC18 Guarded Docs Patch

on:
  push:
    branches:
      - docs/es-13-j4c-b-closure-j4c-c-activation
    paths:
      - '.github/workflows/es-13doc18-docs-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard canonical base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'docs/es-13-j4c-b-closure-j4c-c-activation'
          git fetch origin main
          test "$(git rev-parse origin/main)" = '2e16ff9a577128ffb06211b612116553928c8cda'

      - name: Apply guarded DOC18 patch
        run: python .github/es13doc18_patch.py

      - name: Normalize newly inserted Markdown lines
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^Phase: \*\*ES-13J4C-B — Live Siege Volley Telegraph Integration\*\*  $/Phase: **ES-13J4C-B — Live Siege Volley Telegraph Integration**/' docs/PROJECT_CONTINUITY.md
          sed -i 's/^Issue: #326 — CLOSED \/ completed  $/Issue: #326 — CLOSED \/ completed/' docs/PROJECT_CONTINUITY.md
          sed -i 's/^Status: \*\*DEPLOYED \/ FROZEN\*\*  $/Status: **DEPLOYED \/ FROZEN**/' docs/ES13_GAMEPLAY_ROADMAP.md
          sed -i 's/^Canonical: `2e16ff9a577128ffb06211b612116553928c8cda`  $/Canonical: `2e16ff9a577128ffb06211b612116553928c8cda`/' docs/ES13_GAMEPLAY_ROADMAP.md

      - name: Scope and content guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'docs/ES13_GAMEPLAY_ROADMAP.md' 'docs/IMPLEMENTATION_LEDGER.md' 'docs/PROJECT_CONTINUITY.md' | sort)"
          printf 'DOC18 changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          grep -Fq '2e16ff9a577128ffb06211b612116553928c8cda' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J4C-C — Controlled Normal-Progression Siege Adoption' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J4C-B — Live Siege Volley Telegraph Integration | DEPLOYED / FROZEN' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '### J4C-C — Controlled Normal-Progression Siege Adoption' docs/ES13_GAMEPLAY_ROADMAP.md

      - name: Commit exactly three docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_CONTINUITY.md docs/IMPLEMENTATION_LEDGER.md docs/ES13_GAMEPLAY_ROADMAP.md
          git commit -m 'docs(doc18): close J4C-B and activate J4C-C'
          test "$(git branch --show-current)" = 'docs/es-13-j4c-b-closure-j4c-c-activation'
          git push origin HEAD:docs/es-13-j4c-b-closure-j4c-c-activation
