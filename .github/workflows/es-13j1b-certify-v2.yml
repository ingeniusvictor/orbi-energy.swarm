name: ES-13J1B Live Resonance Certification v2

on:
  push:
    branches:
      - feat/es-13j1b-live-combat-resonance-v2

permissions:
  contents: write

jobs:
  certify:
    if: ${{ !contains(github.event.head_commit.message, '[j1b-diagnostic]') && !contains(github.event.head_commit.message, '[j1b-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize J1B live adoption from certified historical patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/es-13j1b-live-combat-resonance:refs/remotes/origin/j1b-old
          git show origin/j1b-old:.github/workflows/es-13j1b-certify.yml > /tmp/j1b-old-workflow.yml
          node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/j1b-old-workflow.yml', 'utf8');
          const startMarker = "          node <<'NODE'\n";
          const endMarker = "\n          NODE\n";
          const start = text.indexOf(startMarker);
          if (start < 0) throw new Error('J1B historical materializer start marker not found');
          const bodyStart = start + startMarker.length;
          const end = text.indexOf(endMarker, bodyStart);
          if (end < 0) throw new Error('J1B historical materializer end marker not found');
          const body = text
            .slice(bodyStart, end)
            .split('\n')
            .map((line) => line.startsWith('          ') ? line.slice(10) : line)
            .join('\n');
          fs.writeFileSync('/tmp/j1b-materialize.cjs', body + '\n');
          NODE
          node /tmp/j1b-materialize.cjs

      - name: Align inherited reward-routing contracts with J1B authority
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceOnce = (path, before, after) => {
            let source = fs.readFileSync(path, 'utf8');
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`${path}: expected legacy reward-routing assertion not found`);
            if (source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`${path}: legacy reward-routing assertion is not unique`);
            }
            source = source.slice(0, first) + after + source.slice(first + before.length);
            fs.writeFileSync(path, source);
          };

          replaceOnce(
            'tests/runtime-enemy-evolution-adoption.test.ts',
`  const uses =
    collisions.match(/getEnemyScoreReward\\(/g) ?? [];
  assert.equal(
    uses.length,
    2,
    "direct and splash kills must share evolved-aware rewards",
  );`,
`  const defeatHelper = section(
    game,
    "const registerCombatDefeat =",
    "// --- DETECT SINGLE-IMPACT COLLISION SWEEPS ---",
  );
  assert.match(
    defeatHelper,
    /baseScore:\\s*getEnemyScoreReward\\(enemy\\)/,
  );
  assert.match(
    collisions,
    /registerCombatDefeat\\(otherEnemy, proj\\.affinity\\);/,
  );
  assert.match(
    collisions,
    /registerCombatDefeat\\(enemy, proj\\.affinity\\);/,
  );
  assert.equal(
    (collisions.match(/getEnemyScoreReward\\(/g) ?? []).length,
    0,
    "direct and splash kills must route through the single evolved-aware reward authority",
  );`,
          );

          replaceOnce(
            'tests/runtime-miniboss-adoption.test.ts',
`  const rewardCalls =
    collisions.match(/getEnemyScoreReward\\(/g) ?? [];
  assert.equal(
    rewardCalls.length,
    2,
    "both direct and splash kill paths must use milestone-aware score rewards",
  );`,
`  const defeatHelper = section(
    game,
    "const registerCombatDefeat =",
    "// --- DETECT SINGLE-IMPACT COLLISION SWEEPS ---",
  );
  assert.match(
    defeatHelper,
    /baseScore:\\s*getEnemyScoreReward\\(enemy\\)/,
  );
  assert.match(
    collisions,
    /registerCombatDefeat\\(otherEnemy, proj\\.affinity\\);/,
  );
  assert.match(
    collisions,
    /registerCombatDefeat\\(enemy, proj\\.affinity\\);/,
  );
  assert.equal(
    (collisions.match(/getEnemyScoreReward\\(/g) ?? []).length,
    0,
    "direct and splash kills must route through the single milestone-aware reward authority",
  );`,
          );
          NODE

      - name: Repository smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression with persistent failure transcript
        id: platform
        shell: bash
        run: |
          set +e
          npm run test:platform 2>&1 | tee /tmp/j1b-v2-platform.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist platform failure if any
        if: steps.platform.outputs.exit_code != '0'
        shell: bash
        env:
          PLATFORM_EXIT: ${{ steps.platform.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo '# ES-13J1B v2 platform failure'
            echo
            echo "input SHA: ${{ github.sha }}"
            echo "platform exit: ${PLATFORM_EXIT}"
            echo
            echo '```text'
            cat /tmp/j1b-v2-platform.log
            echo '```'
          } > diagnostics/j1b-v2-platform.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/j1b-v2-platform.md
          git commit -m 'diag(j1b): persist v2 platform failure [j1b-diagnostic]'
          git push origin HEAD:feat/es-13j1b-live-combat-resonance-v2
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness remains fail-closed
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Build Android debug APK
        env:
          ORBI_BUILD_SHA: ${{ github.sha }}
        run: npm run android:debug

      - name: Verify Android APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: J1B scope guard
        shell: bash
        run: |
          set -euo pipefail
          {
            git diff --name-only 622a75805a2228546737a5cf65a8e3b20f7f9c7d...HEAD
            git diff --name-only
          } | sort -u > /tmp/j1b-files.txt
          cat /tmp/j1b-files.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .github/workflows/es-13j1b-certify-v2.yml|src/components/GameHud.tsx|src/game/EnergySwarmGame.tsx|tests/es-13j1b-live-resonance-adoption.test.mjs|tests/runtime-enemy-evolution-adoption.test.ts|tests/runtime-miniboss-adoption.test.ts) ;;
              *) echo "Unexpected J1B scope: $file" >&2; exit 1 ;;
            esac
          done < /tmp/j1b-files.txt

      - name: Commit certified materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/game/EnergySwarmGame.tsx \
            tests/runtime-enemy-evolution-adoption.test.ts \
            tests/runtime-miniboss-adoption.test.ts
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit.'
            exit 0
          fi
          git commit -m 'ES-13J1B materialize live combat resonance adoption [j1b-materialized]'
          git push origin HEAD:feat/es-13j1b-live-combat-resonance-v2
