name: ES-13J8D Certification

on:
  push:
    branches:
      - es-13j8d-pure-score-attack-record-projection
    paths:
      - .github/workflows/es-13j8d-cert.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repository Smoke
        run: npm run test:repo
      - name: Gameplay regression
        run: npm run test:gameplay
      - name: Platform regression
        run: npm run test:platform
      - name: Typecheck
        run: npm run typecheck
      - name: Release Contract
        run: npm run release:verify
      - name: Manual dossier
        run: npm run release:evidence:verify
      - name: Production Build
        run: npm run build
      - name: RC readiness fail-closed
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json
      - name: J8D exact product scope and authority guard
        run: |
          set -euo pipefail
          git diff --name-only 2e4eb93a06e303c42cd8c97a133a176860eb2e38 -- \
            ':!.github/workflows/es-13j8d-cert.yml' | sort > /tmp/files.txt
          printf '%s\n' \
            src/game/scoreAttackRecordProjection.ts \
            tests/es-13j8d-score-attack-record-projection.test.mjs \
            tests/gameplay/score-attack-record-projection.test.ts | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt
          test -z "$(git diff --name-only 2e4eb93a06e303c42cd8c97a133a176860eb2e38 -- \
            src/game/EnergySwarmGame.tsx \
            src/game/types.ts \
            src/game/runPersistence.ts \
            src/game/storage.ts \
            src/game/scoreAttackModeContract.ts \
            src/game/scoreAttackTimeboxProjection.ts \
            src/components/StartScreen.tsx \
            src/components/ResultScreen.tsx \
            package.json package-lock.json public android)"
          ! grep -R "scoreAttackRecordProjection" \
            src/game/EnergySwarmGame.tsx \
            src/game/types.ts \
            src/game/runPersistence.ts \
            src/game/storage.ts \
            src/components/StartScreen.tsx \
            src/components/ResultScreen.tsx
          grep -Fq 'SCORE_ATTACK_RECORD_ID = "SCORE_ATTACK_BEST_SCORE" as const' src/game/scoreAttackRecordProjection.ts
          grep -Fq 'projectionMode: "RECORD_PROJECTION_ONLY"' src/game/scoreAttackRecordProjection.ts
          grep -Fq 'ownsDedicatedRecordProjectionAuthority: true' src/game/scoreAttackRecordProjection.ts
          grep -Fq 'Number.MAX_SAFE_INTEGER' src/game/scoreAttackRecordProjection.ts
      - name: Upload RC readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8d-rc-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Install dependencies
        run: npm ci
      - name: Build Android debug APK
        run: npm run android:debug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8d-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
