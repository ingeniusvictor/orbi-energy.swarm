name: ES-13J8N Isolated Diagnostic

on:
  push:
    branches: [es-13j8n-pure-score-attack-stats-commit-application]
    paths:
      - .github/workflows/es-13j8n-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: NEW_BEST only field
        run: npx tsx --test --test-name-pattern='J8N applies NEW_BEST' tests/gameplay/score-attack-stats-commit-application.test.ts
      - name: TIED and BELOW preserve stats
        run: npx tsx --test --test-name-pattern='J8N preserves stats for TIED_BEST and BELOW_BEST' tests/gameplay/score-attack-stats-commit-application.test.ts
      - name: stale plan fails closed
        run: npx tsx --test --test-name-pattern='J8N fails closed when current dedicated best' tests/gameplay/score-attack-stats-commit-application.test.ts
      - name: inconsistent plan fails closed
        run: npx tsx --test --test-name-pattern='J8N fails closed for absent or internally inconsistent' tests/gameplay/score-attack-stats-commit-application.test.ts
      - name: authority contract
        run: npx tsx --test --test-name-pattern='J8N authority contract owns only' tests/gameplay/score-attack-stats-commit-application.test.ts
