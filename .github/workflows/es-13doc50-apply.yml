name: ES-13DOC50 Apply

on:
  push:
    branches: [docs/es-13-j8l-closure-j8m-finalization-plan]
    paths:
      - .github/workflows/es-13doc50-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact J8L ancestry
        run: test "$(git merge-base d41f00a1a87140dba1ddc2d04b207261df862307 HEAD)" = "d41f00a1a87140dba1ddc2d04b207261df862307"

      - name: Apply DOC50 patch fail closed
        run: python scripts/es13doc50_apply.py

      - name: Guard exact documentation scope
        run: |
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          grep -Fq 'd41f00a1a87140dba1ddc2d04b207261df862307' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J8M' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'Attempt Finalization Plan' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '#4' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#5' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#202' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#248' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#254' docs/PROJECT_CONTINUITY.md
          grep -Fq '#283' docs/PROJECT_CONTINUITY.md
          grep -Fq '## J9 — Boss & Miniboss Expansion' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '## J15' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md

      - name: Commit DOC50 documents
        run: |
          git config user.name ingeniusvictor
          git config user.email ingenius.victor@gmail.com
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'docs(doc50): close J8L and activate J8M finalization plan'
          git push
