name: ES-13J8L Gameplay Diagnostic

on:
  push:
    branches: [es-13j8l-pure-score-attack-runtime-activation-envelope]
    paths:
      - .github/workflows/es-13j8l-gameplay-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Canonical envelope shape
        run: npx tsx --test --test-name-pattern='composes one canonical' tests/gameplay/score-attack-runtime-activation-envelope.test.ts
      - name: Object identity
        if: always()
        run: npx tsx --test --test-name-pattern='preserves exact runtime/session' tests/gameplay/score-attack-runtime-activation-envelope.test.ts
      - name: Isolation facts
        if: always()
        run: npx tsx --test --test-name-pattern='carries frozen Score Attack isolation' tests/gameplay/score-attack-runtime-activation-envelope.test.ts
      - name: Unsupported ids
        if: always()
        run: npx tsx --test --test-name-pattern='fails closed for unsupported' tests/gameplay/score-attack-runtime-activation-envelope.test.ts
      - name: Repeated resolutions
        if: always()
        run: npx tsx --test --test-name-pattern='repeated resolutions' tests/gameplay/score-attack-runtime-activation-envelope.test.ts
      - name: Authority contract
        if: always()
        run: npx tsx --test --test-name-pattern='authority contract owns only' tests/gameplay/score-attack-runtime-activation-envelope.test.ts
