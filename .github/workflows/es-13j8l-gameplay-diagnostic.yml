name: ES-13J8L Gameplay Diagnostic

on:
  push:
    branches: [es-13j8l-pure-score-attack-runtime-activation-envelope]
    paths:
      - .github/workflows/es-13j8l-gameplay-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolver returns envelope
        run: npx tsx -e 'import assert from "node:assert/strict"; import { resolveScoreAttackRuntimeActivationEnvelope as r } from "./src/game/scoreAttackRuntimeActivationEnvelope.ts"; assert.ok(r("SCORE_ATTACK"));'
      - name: Envelope metadata
        if: always()
        run: npx tsx -e 'import assert from "node:assert/strict"; import { resolveScoreAttackRuntimeActivationEnvelope as r } from "./src/game/scoreAttackRuntimeActivationEnvelope.ts"; const a=r("SCORE_ATTACK"); assert.ok(a); assert.equal(a.kind,"SCORE_ATTACK_RUNTIME_ACTIVATION_ENVELOPE"); assert.equal(a.activationMode,"ACTIVATION_ONLY"); assert.equal(a.modeId,"SCORE_ATTACK"); assert.equal(a.sourceRuntimeMode,"INFINITE"); assert.equal(a.runtimeProgression.mode,"INFINITE"); assert.equal(a.exactDurationMs,60000);'
      - name: Envelope frozen
        if: always()
        run: npx tsx -e 'import assert from "node:assert/strict"; import { resolveScoreAttackRuntimeActivationEnvelope as r } from "./src/game/scoreAttackRuntimeActivationEnvelope.ts"; const a=r("SCORE_ATTACK"); assert.ok(a); assert.equal(Object.isFrozen(a),true);'
      - name: Completion policy
        if: always()
        run: npx tsx -e 'import assert from "node:assert/strict"; import { resolveScoreAttackRuntimeActivationEnvelope as r } from "./src/game/scoreAttackRuntimeActivationEnvelope.ts"; const a=r("SCORE_ATTACK"); assert.ok(a); assert.deepEqual(a.completionPolicy,{type:"TIMEBOX",durationMs:60000}); assert.equal(Object.isFrozen(a.completionPolicy),true);'
      - name: Canonical fresh start
        if: always()
        run: npx tsx -e 'import assert from "node:assert/strict"; import { resolveScoreAttackRuntimeActivationEnvelope as r } from "./src/game/scoreAttackRuntimeActivationEnvelope.ts"; const a=r("SCORE_ATTACK"); assert.ok(a); assert.deepEqual(a.canonicalFreshStart,{sector:11,wave:1});'
