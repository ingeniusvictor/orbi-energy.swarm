name: ES-13DOC46 Apply

on:
  push:
    branches: [docs/es-13-j8h-closure-j8i-descriptor-completion-overlay]
    paths:
      - .github/workflows/es-13doc46-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact J8H ancestry
        run: test "$(git merge-base 8ed798beaa688f73ab8513c0e7ecb9bd112a2824 HEAD)" = "8ed798beaa688f73ab8513c0e7ecb9bd112a2824"

      - name: Apply DOC46 patch fail closed
        run: python scripts/es13doc46_apply.py

      - name: Guard exact documentation scope
        run: |
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          grep -Fq '8ed798beaa688f73ab8513c0e7ecb9bd112a2824' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J8I' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'BUDGET_AND_CLEAR' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'TIMEBOX / 60000 ms' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '#4' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#5' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#202' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#248' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq '#254' docs/PROJECT_CONTINUITY.md
          grep -Fq '#283' docs/PROJECT_CONTINUITY.md
          grep -Fq '## J9 — Boss & Miniboss Expansion' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq '## J15' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -Fq 'ES-14' docs/ES13_GAMEPLAY_ROADMAP.md

      - name: Commit DOC46 documents
        run: |
          git config user.name ingeniusvictor
          git config user.email ingenius.victor@gmail.com
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'docs(doc46): close J8H and activate J8I descriptor overlay'
          git push
