name: ES-13J8O Marker Diagnostic

on:
  push:
    branches: [es-13j8o-controlled-live-score-attack-engine-lifecycle]
    paths:
      - .github/workflows/es-13j8o-marker-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check import anchor
        run: python -c "from pathlib import Path; import re; t=Path('src/game/EnergySwarmGame.tsx').read_text(); assert len(re.findall(r'\\} from \"\\.\\/runtimeProjectionBundleCache\";\\n', t)) == 1"

      - name: Check runtime ref anchor
        run: python -c "from pathlib import Path; import re; t=Path('src/game/EnergySwarmGame.tsx').read_text(); assert len(re.findall(r'  const runtimeProgressionRef = useRef<RuntimeProgressionState>\\(\\s*createCampaignRuntimeState\\(1\\),\\s*\\);\\n', t, re.S)) == 1"

      - name: Check projection anchor
        run: python -c "from pathlib import Path; import re; t=Path('src/game/EnergySwarmGame.tsx').read_text(); assert len(re.findall(r'  const getCurrentRuntimeProjection = \\(\\) =>\\s*getCachedRuntimeProjectionBundle\\(\\s*runtimeProjectionBundleCacheRef\\.current,\\s*runtimeProgressionRef\\.current,\\s*swarmRef\\.current\\.length,\\s*\\);', t, re.S)) == 1"

      - name: Check start marker
        run: grep -Fq '  const startGame = () => {' src/game/EnergySwarmGame.tsx

      - name: Check reset anchor
        run: python -c "from pathlib import Path; import re; t=Path('src/game/EnergySwarmGame.tsx').read_text(); a=t.index('  const startGame = () => {'); b=t.index('  // --- REBOOT GAME ON LOSS ---', a); s=t[a:b]; assert len(re.findall(r'    currentWaveRef\\.current = 1;\\s*runtimeProgressionRef\\.current = createCampaignRuntimeState\\(1\\);\\s*waveActiveRef\\.current = false;', s, re.S)) == 1"

      - name: Check completion snapshot anchor
        run: python -c "from pathlib import Path; import re; t=Path('src/game/EnergySwarmGame.tsx').read_text(); assert len(re.findall(r'      const baseWaveComplete = isRuntimeWaveComplete\\(\\s*completionDescriptor,\\s*\\{\\s*remainingTimeMs: waveTimeRemainingRef\\.current,\\s*spawnedEnemyCount: waveBudgetSpawnedRef\\.current,\\s*livingEnemyCount,\\s*bossDefeated: false,\\s*\\},\\s*\\);', t, re.S)) == 1"

      - name: Check wave terminal anchor
        run: python -c "from pathlib import Path; import re; t=Path('src/game/EnergySwarmGame.tsx').read_text(); assert len(re.findall(r'      if \\(waveComplete\\) \\{\\s*// Wave complete! Transition into intermission', t, re.S)) == 1"

      - name: Check game-over trigger anchor
        run: grep -Fq '  const triggerGameOver = (won: boolean) => {' src/game/EnergySwarmGame.tsx

      - name: Check game-over dialogue anchor
        run: grep -Fq 'ENIGM-CORE CRASHED. Sincronización del enjambre perdida.' src/game/EnergySwarmGame.tsx
