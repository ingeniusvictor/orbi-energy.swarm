name: ES-12F7 Patch

on:
  push:
    branches:
      - feat/es-12f7-orbi-energy-canon

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/es-12f7-orbi-energy-canon
          fetch-depth: 0
      - name: Apply canonical energy patch
        run: node .github/es12f7-patch.mjs
      - name: Commit patch
        run: |
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(orbi): wire canonical energy recruitment ES-12F7 [patch-applied]"
          git push origin HEAD:feat/es-12f7-orbi-energy-canon
