name: ES-13J5F-E Patch and Pre-PR Certification v3

on:
  push:
    branches:
      - es-13j5fe-controlled-live-command-link-pulse
    paths:
      - .github/workflows/es-13j5fe-patch-cert-v3.yml

permissions:
  contents: write

jobs:
  patch-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_SHA: 022741e5c500dea2947241d4bb8c6cb8d004772c
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: es-13j5fe-controlled-live-command-link-pulse

      - name: Reuse audited v2 runtime patch exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/es-13j5fe-patch-cert-v2.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          script = '\n'.join(lines)
          exec(compile(script, 'j5fe-v2-patch.py', 'exec'), {})
          PY

      - name: Commit exact J5F-E candidate locally
        shell: bash
        run: |
          git config user.name ingeniusvictor
          git config user.email ingenius.victor@gmail.com
          git add src/game/EnergySwarmGame.tsx
          git diff --cached --quiet && { echo 'No runtime patch produced'; exit 1; }
          git commit -m 'ES-13J5F-E: integrate controlled live non-lethal command-link pulse'
          echo "J5FE_CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release Contract
        run: npm run release:verify

      - name: Manual dossier
        run: npm run release:evidence:verify

      - name: Production Build
        run: npm run build

      - name: RC readiness fail-closed
        run: npm run release:readiness

      - name: J5F-E exact scope guard
        shell: bash
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/es-13j5fe-patch-cert.yml \
            .github/workflows/es-13j5fe-patch-cert-v2.yml \
            .github/workflows/es-13j5fe-patch-cert-v3.yml \
            src/game/EnergySwarmGame.tsx \
            src/game/liveCommandLinkPulseApplication.ts \
            tests/es-13j5fe-live-command-link-pulse-application.test.mjs \
            tests/gameplay/live-command-link-pulse-application.test.ts | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected J5F-E scope:'; echo "$changed"; exit 1; }

      - name: Frozen registerCombatDefeat signature guard
        shell: bash
        run: |
          grep -F 'const registerCombatDefeat = (enemy: Enemy, affinity?: OrbiAffinity) => {' src/game/EnergySwarmGame.tsx
          test "$(grep -Fc 'registerCombatDefeat(enemy, proj.affinity);' src/game/EnergySwarmGame.tsx)" -eq 1
          test "$(grep -Fc 'registerCombatDefeat(otherEnemy, proj.affinity);' src/game/EnergySwarmGame.tsx)" -eq 1

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbi-energy-swarm-j5fe-debug-${{ env.J5FE_CANDIDATE_SHA }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Push certified J5F-E candidate
        shell: bash
        run: |
          git push origin HEAD:es-13j5fe-controlled-live-command-link-pulse
