name: ES-13DOC33 Continuity Repair

on:
  push:
    branches:
      - docs/es-13-j6bc-closure-j6bd-activation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/es-13-j6bc-closure-j6bd-activation
          fetch-depth: 0
      - name: Restore canonical continuity preservation block
        run: python scripts/es13doc33_continuity_repair.py
      - name: Validate preservation
        shell: bash
        run: |
          grep -q '^## Resolved diagnostics$' docs/PROJECT_CONTINUITY.md
          grep -q '^## Frozen manual/physical blockers$' docs/PROJECT_CONTINUITY.md
          grep -q '#4 — visual/responsive certification' docs/PROJECT_CONTINUITY.md
          grep -q '#5 — Infinite play-feel' docs/PROJECT_CONTINUITY.md
          grep -q '#202 — GAIA physical runtime/performance' docs/PROJECT_CONTINUITY.md
          grep -q '#248 — Android real-device certification' docs/PROJECT_CONTINUITY.md
          test "$(git diff --name-only HEAD -- | sort | tr '\n' ' ')" = "docs/PROJECT_CONTINUITY.md "
      - name: Commit repaired continuity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_CONTINUITY.md
          git commit -m "ES-13DOC33: preserve diagnostics and manual blockers"
          git push origin HEAD:docs/es-13-j6bc-closure-j6bd-activation
