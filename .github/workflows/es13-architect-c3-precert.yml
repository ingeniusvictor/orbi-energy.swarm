name: ES-13 Architect C3 temporary full pre-cert
on:
  push:
    branches: ['feat/es13-architect-qa-core-impact-c3']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Verify authorized C3 file scope
        shell: bash
        run: |
          git diff --name-only 0bf0241872c8e0b51c806125b61a09fa380630e0 HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/es13-architect-c3-precert.yml' \
            'src/game/EnergySwarmGame.tsx' \
            'src/game/blackoutArchitectDevQaCoreImpact.ts' \
            'tests/es-13j9lb2b2b2b2c3-core-impact.test.mjs' \
            'tests/gameplay/blackout-architect-dev-core-impact.test.ts' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Dependencies
        run: npm ci
      - name: Focused C3, C2 and J2 regression
        run: |
          node --test tests/es-13j9lb2b2b2b2c2-cardinal-impact.test.mjs tests/es-13j9lb2b2b2b2c3-core-impact.test.mjs tests/es-13j2b-live-overdrive-adoption.test.mjs tests/es-13j2e-overdrive-integration-adoption.test.mjs
          npx tsx --test tests/gameplay/blackout-architect-dev-cardinal-impact.test.ts tests/gameplay/blackout-architect-dev-core-impact.test.ts
      - name: Full repository/gameplay/platform
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Release and evidence
        run: |
          npm run release:verify
          npm run release:evidence:verify
      - name: Web build and release readiness
        run: |
          npm run build
          npm run release:readiness -- --output release-readiness.json
      - name: Android debug APK
        run: npm run android:debug
      - name: APK verification
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: es13-c3-precert-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
