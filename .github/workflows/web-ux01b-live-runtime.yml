name: ORBI Web UX01B Live Runtime Diagnosis
on:
  push:
    branches: [fix/web-ux01b-blank-battlefield]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/web-ux01b-live-diagnostics.mjs'
      - '.github/workflows/web-ux01b-live-runtime.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium without touching runtime dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect real public Chrome Vercel gameplay at 1 5 9 seconds
        run: node scripts/web-ux01b-live-diagnostics.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ux01b-live-${{ github.sha }}
          path: artifacts/web-ux01b/
          retention-days: 14
          if-no-files-found: warn
