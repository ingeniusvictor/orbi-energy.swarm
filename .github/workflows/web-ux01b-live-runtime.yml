name: ORBI Web UX01B Live Runtime Diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main, fix/web-ux01b-blank-battlefield]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/web-ux01b-live-diagnostics.mjs'
      - 'scripts/web-ux01b-recovery-browser.mjs'
      - '.github/workflows/web-ux01b-live-runtime.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium without touching runtime dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          which google-chrome || which google-chrome-stable || true
      # The LIVE Vercel alias still runs OLD code before protected squash.
      # Reproduce it manually; PR gating tests the exact candidate bundle.
      - name: Inspect current live production, on explicit diagnostic dispatch
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/web-ux01b-live-diagnostics.mjs
      - name: Build production bundle for device failure simulation
        run: npm run typecheck && npm run build
      - name: Real production Chrome with WebGL normal and unavailable
        run: node scripts/web-ux01b-recovery-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ux01b-live-${{ github.sha }}
          path: |
            artifacts/web-ux01b/
            artifacts/web-ux01b-production/
          retention-days: 14
          if-no-files-found: warn
