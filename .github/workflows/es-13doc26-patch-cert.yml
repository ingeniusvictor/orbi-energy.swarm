name: ES-13DOC26 Patch and Certification

on:
  push:
    branches:
      - docs/es-13-j5fb-closure-j5fc-activation
    paths:
      - '.github/workflows/es-13doc26-patch-cert.yml'

permissions:
  contents: write

jobs:
  patch-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 9812592dd77a0dd4e6364d57857f4c9065757d49
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/es-13-j5fb-closure-j5fc-activation

      - name: Apply DOC26 exact anchored patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old, new, 1)

          def replace_regex(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, got {count}")
              return updated

          # ROADMAP
          p = Path('docs/ES13_GAMEPLAY_ROADMAP.md')
          s = p.read_text()
          j5fb_j5fc = '''### J5F-B — Pure Current Command-Link Pulse Target Eligibility Contract
          Status: **DEPLOYED / FROZEN**
          Canonical: `9812592dd77a0dd4e6364d57857f4c9065757d49`
          Issue #359 / PR #360

          Certified behavior:
          - composes frozen J5F-A proposal semantics with current J5B binding for exactly one caller-supplied candidate;
          - requires `COMMAND_LINK_DISRUPTION_PULSE` / `PULSE_LINKED_MEMBERS` / `PROPOSAL_ONLY` / `LINKED_MEMBER` semantics and all J5F-A zero-effect flags;
          - requires valid current J5B `LINKED_MEMBER`, same `groupId`, explicit `isLiving === true`, and exact bounded target shape `[1]` for size 2 or `[1,2]` for size 3;
          - output is immutable `ELIGIBLE_ONLY` metadata;
          - no live IDs, lookup/scan/collection, health mutation, damage/kill/defeat, score/reward, projectile/formation mutation, clock/RNG, cap/budget or entity create/remove authority;
          - no `EnergySwarmGame.tsx` adoption and no disruption pulse is live.

          Exact deployment anchors:
          - pre-PR `66472e7939ec4230b1d8fba8ba520417254523ed`, run `38685113993` / job `116258071836` GREEN including exact scope + Android APK;
          - final PR #360 head `e286127a0fc4d78d05a1f37e2427296376d5819e`;
          - PR CI `38685413567` / `116259016390` GREEN; Android `38685413708` / `116259016971` GREEN;
          - canonical `9812592dd77a0dd4e6364d57857f4c9065757d49`, parent `78737695d82f6bcdf76c1bc68e6c849c457711c0`, tree `e248768164f391adec3d71955f6b065fa1b4b787`;
          - main CI `38685585231` / `116259545039` GREEN; Android `38685585286` / `116259545298` GREEN;
          - Pages `38685655054`, build `116259769899` + deploy `116259848508` GREEN.

          ### J5F-C — Pure Non-Lethal Command-Link Pulse Damage Safety Envelope
          Status: **NEXT ACTIVE ENGINEERING SLICE AFTER DOC26 CLOSURE**

          Architecture discovery shows current enemies own `health`, `maxHealth` and `isDead`, while direct-hit and splash branches already own health mutation and may converge through `registerCombatDefeat(...)`. Enemy health also varies by family and runtime/evolved/elite/milestone multipliers. J5F-C therefore must certify damage safety without choosing tuning or adopting live mutation.

          Required direction:
          - pure deterministic helper only; no live `EnergySwarmGame.tsx` adoption;
          - consume one frozen J5F-B `ELIGIBLE_ONLY` result plus caller-supplied `currentHealth`, `maxHealth` and positive finite `proposedDamage`;
          - validate scalar health/damage facts fail-closed and preserve J5F-B group/member eligibility metadata without entity IDs;
          - J5F-C does not choose the proposed magnitude; it only bounds safety;
          - cap safe damage at `max(0, currentHealth - 1)` so projected resulting health is never below exactly 1 HP;
          - at the 1 HP floor safe damage resolves to 0, never a kill;
          - immutable metadata only with `canKill: false`, `registersDefeat: false`, `awardsScore: false`, `awardsRewards: false`;
          - no health/isDead mutation, defeat registration, score/reward/drop/milestone/boss effect, lookup/scan/collection, projectile/formation mutation, timer/RNG, cap/budget or entity create/remove authority;
          - source magnitude/tuning and live application remain J5F-D+ and require independent attribution/reward-deduplication proof.

          '''
          s = replace_regex(
              s,
              r'### J5F-B — Pure Current Command-Link Pulse Target Eligibility Contract\n.*?(?=## J6 — Dynamic Mid-Sector Events)',
              j5fb_j5fc,
              'roadmap J5F-B→J5F-C section',
          )
          p.write_text(s)

          # LEDGER
          p = Path('docs/IMPLEMENTATION_LEDGER.md')
          s = p.read_text()
          j5fa_row = '| ES-13J5F-A — Pure Optional Command-Link Disruption Pulse Contract | DEPLOYED / FROZEN | `90f3fc82271654e6d7a7076474ae46efd02775e4` | #355 | #356 |'
          j5fb_row = '| ES-13J5F-B — Pure Current Command-Link Pulse Target Eligibility Contract | DEPLOYED / FROZEN | `9812592dd77a0dd4e6364d57857f4c9065757d49` | #359 | #360 |'
          s = replace_exact(s, j5fa_row, j5fa_row + '\n' + j5fb_row, 'ledger milestone row')

          j5fb_evidence = '''### J5F-B — Pure Current Command-Link Pulse Target Eligibility Contract
          J5F-B proves eligibility for one current caller-supplied linked candidate before any damage magnitude or live mutation exists. It composes frozen J5F-A proposal semantics with current J5B binding and explicit living state, and returns immutable `ELIGIBLE_ONLY` metadata only.

          Final product diff exactly:
          - `src/game/commandLinkPulseTargetEligibility.ts`;
          - `tests/es-13j5fb-command-link-pulse-target-eligibility.test.mjs`;
          - `tests/gameplay/command-link-pulse-target-eligibility.test.ts`.

          Exact evidence:
          - baseline DOC25 `78737695d82f6bcdf76c1bc68e6c849c457711c0`;
          - pre-PR SHA `66472e7939ec4230b1d8fba8ba520417254523ed`, run `38685113993` / job `116258071836` GREEN including repo/gameplay/platform/typecheck/release/dossier/build/readiness, exact scope guard and Android APK build/verify/upload;
          - final PR #360 head `e286127a0fc4d78d05a1f37e2427296376d5819e`;
          - PR CI `38685413567` / `116259016390` GREEN;
          - PR Android `38685413708` / `116259016971` GREEN including Build/Verify/Upload APK;
          - canonical `9812592dd77a0dd4e6364d57857f4c9065757d49`, single parent `78737695d82f6bcdf76c1bc68e6c849c457711c0`, tree `e248768164f391adec3d71955f6b065fa1b4b787`;
          - canonical diff exactly three certified J5F-B product/test files;
          - main CI `38685585231` / `116259545039` GREEN;
          - main Android `38685585286` / `116259545298` GREEN including Build/Verify/Upload APK;
          - Pages `38685655054`: build `116259769899` + deploy `116259848508` GREEN.

          Issue #359 CLOSED / completed. J5F-B is **DEPLOYED / FROZEN**.

          '''
          s = replace_exact(s, '## Documentation canonicals\n', j5fb_evidence + '## Documentation canonicals\n', 'ledger J5F-B evidence')
          s = replace_exact(
              s,
              '- DOC25 — J5F-A closure & J5F-B target eligibility activation: Issue #357, branch `docs/es-13-j5fa-closure-j5fb-activation`, in progress from gameplay canonical `90f3fc82271654e6d7a7076474ae46efd02775e4`.',
              '- DOC25 — J5F-A closure & J5F-B target eligibility activation: `78737695d82f6bcdf76c1bc68e6c849c457711c0` — Issue #357 / PR #358.\n- DOC26 — J5F-B closure & J5F-C non-lethal damage safety activation: Issue #361, branch `docs/es-13-j5fb-closure-j5fc-activation`, in progress from gameplay canonical `9812592dd77a0dd4e6364d57857f4c9065757d49`.',
              'ledger DOC25/DOC26',
          )
          next_ledger = '''### ES-13J5F-C — Pure Non-Lethal Command-Link Pulse Damage Safety Envelope
          Status: **NEXT ENGINEERING TARGET AFTER DOC26 CLOSURE**.

          Current direct-hit and splash paths already own health mutation and defeat-adjacent side effects, and enemy health scales across families and runtime modifiers. J5F-C therefore remains pure: it constrains caller-supplied proposed damage so an eligible linked target cannot be reduced below 1 HP, without selecting tuning or mutating runtime.

          J5F-C must validate finite positive health/damage scalars, preserve frozen J5F-B eligibility, cap safe damage at `max(0, currentHealth - 1)`, expose resulting health >= 1, and explicitly own no kill/defeat/score/reward/drop/milestone/live mutation authority. Source magnitude and live adoption remain J5F-D+.

          '''
          s = replace_regex(
              s,
              r'### ES-13J5F-B — Pure Current Command-Link Pulse Target Eligibility Contract\n.*?(?=J4D\+ additional tactical families remain deferred:)',
              next_ledger,
              'ledger next gameplay',
          )
          s = replace_exact(
              s,
              '`J5F-B Pure Current Command-Link Pulse Target Eligibility Contract → J5F-C+ separately proven damage policy/live application → J6 Dynamic Events → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance → ES-14 Living Warfront`',
              '`J5F-C Pure Non-Lethal Command-Link Pulse Damage Safety Envelope → J5F-D+ source tuning/live application → J6 Dynamic Events → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance → ES-14 Living Warfront`',
              'ledger program sequence',
          )
          p.write_text(s)

          # CONTINUITY
          p = Path('docs/PROJECT_CONTINUITY.md')
          s = p.read_text()
          current = '''## Current certified gameplay canonical

          `9812592dd77a0dd4e6364d57857f4c9065757d49`

          Phase: **ES-13J5F-B — Pure Current Command-Link Pulse Target Eligibility Contract**
          Status: **DEPLOYED / FROZEN**
          Issue: #359 — CLOSED / completed
          Delivery: PR #360 — squash merged

          Single parent: `78737695d82f6bcdf76c1bc68e6c849c457711c0` — DOC25 documentation canonical.

          Canonical tree: `e248768164f391adec3d71955f6b065fa1b4b787`.

          '''
          s = replace_regex(
              s,
              r'## Current certified gameplay canonical\n.*?(?=Version remains `0\.2\.0-beta\.1`\.)',
              current,
              'continuity current canonical',
          )
          j5fb_cont = '''## J5F-B result
          J5F-B established the pure current-target eligibility gate required before any Command-Link disruption-pulse damage policy may exist.

          Certified contract:
          - consumes frozen J5F-A proposal semantics, one caller-supplied current bounded formation candidate and explicit living state;
          - reuses J5B binding and requires current `LINKED_MEMBER`, same `groupId`, exact target shape and `isLiving === true`;
          - size-2 eligibility is member 1 only; size-3 eligibility is members 1 and 2; core index 0 is rejected;
          - malformed proposal semantics, wrong group/shape, invalid formation facts, absent inputs or non-living candidates fail closed;
          - output is immutable `ELIGIBLE_ONLY` metadata;
          - no live ids, lookup/scan/collection, runtime mutation, health/damage/kill/defeat, score/reward/economy, projectile/formation mutation, clock/RNG, cap/budget or entity create/remove authority.

          Final product scope exactly:
          - `src/game/commandLinkPulseTargetEligibility.ts`;
          - `tests/es-13j5fb-command-link-pulse-target-eligibility.test.mjs`;
          - `tests/gameplay/command-link-pulse-target-eligibility.test.ts`.

          ## J5F-B exact evidence
          - DOC25 baseline `78737695d82f6bcdf76c1bc68e6c849c457711c0`;
          - pre-PR SHA `66472e7939ec4230b1d8fba8ba520417254523ed`, run `38685113993` / job `116258071836` GREEN including repo/gameplay/platform/typecheck/release/dossier/build/readiness, exact product-scope guard and Android APK build/verify/upload;
          - final PR #360 head `e286127a0fc4d78d05a1f37e2427296376d5819e`;
          - PR CI `38685413567` / `116259016390` GREEN;
          - PR Android `38685413708` / `116259016971` GREEN including Build/Verify/Upload APK;
          - canonical `9812592dd77a0dd4e6364d57857f4c9065757d49`, single parent `78737695d82f6bcdf76c1bc68e6c849c457711c0`, tree `e248768164f391adec3d71955f6b065fa1b4b787`;
          - canonical diff exactly three certified product/test files;
          - main CI `38685585231` / `116259545039` GREEN;
          - main Android `38685585286` / `116259545298` GREEN including Build/Verify/Upload APK;
          - Pages `38685655054`: build `116259769899` + deploy `116259848508` GREEN.

          Issue #359 CLOSED / completed. J5F-B is **DEPLOYED / FROZEN**.

          '''
          s = replace_exact(s, '## ES-13 gameplay canonicals\n', j5fb_cont + '## ES-13 gameplay canonicals\n', 'continuity J5F-B evidence')
          s = replace_exact(
              s,
              '- J5F-A — Pure Optional Command-Link Disruption Pulse Contract: `90f3fc82271654e6d7a7076474ae46efd02775e4`.',
              '- J5F-A — Pure Optional Command-Link Disruption Pulse Contract: `90f3fc82271654e6d7a7076474ae46efd02775e4`.\n- J5F-B — Pure Current Command-Link Pulse Target Eligibility Contract: `9812592dd77a0dd4e6364d57857f4c9065757d49`.',
              'continuity canonical list',
          )
          s = replace_exact(
              s,
              '- DOC25 — J5F-A closure & J5F-B target eligibility activation: Issue #357, branch `docs/es-13-j5fa-closure-j5fb-activation`, documentation-only closure in progress from gameplay canonical `90f3fc82271654e6d7a7076474ae46efd02775e4`.',
              '- DOC25 — J5F-A closure & J5F-B target eligibility activation: `78737695d82f6bcdf76c1bc68e6c849c457711c0` — Issue #357 / PR #358.\n- DOC26 — J5F-B closure & J5F-C non-lethal damage safety activation: Issue #361, branch `docs/es-13-j5fb-closure-j5fc-activation`, documentation-only closure in progress from gameplay canonical `9812592dd77a0dd4e6364d57857f4c9065757d49`.',
              'continuity DOC25/DOC26',
          )
          next_cont = '''### ES-13J5F-C — Pure Non-Lethal Command-Link Pulse Damage Safety Envelope
          Status: **NEXT ENGINEERING TARGET AFTER DOC26 CLOSURE**

          J5F-B freezes target eligibility only. Runtime discovery confirms that `Enemy` already owns `health`, `maxHealth` and `isDead`; direct-hit and splash branches mutate health and own defeat-adjacent destruction/drop/persistence behavior; enemy health varies through family and runtime multipliers. J5F-C therefore must not invent tuning or go live.

          Required direction:
          - pure helper only; no `EnergySwarmGame.tsx` adoption;
          - consume frozen J5F-B eligibility plus caller-supplied finite positive `currentHealth`, `maxHealth` and `proposedDamage`;
          - require `currentHealth <= maxHealth` and valid eligibility; invalid facts fail closed;
          - do not choose proposed damage; bound it only so `safeDamage <= max(0, currentHealth - 1)` and projected `resultingHealth >= 1`;
          - 1 HP floor yields zero safe damage, never defeat;
          - return immutable metadata with `canKill: false`, `registersDefeat: false`, `awardsScore: false`, `awardsRewards: false`;
          - no live IDs/lookups/scans/collections, health/isDead mutation, defeat/drop/milestone/boss side effects, projectile/formation mutation, clock/RNG, caps/budgets or entity create/remove;
          - source magnitude/tuning and live application remain J5F-D+ with independent attribution/reward-deduplication proof.

          '''
          s = replace_regex(
              s,
              r'### ES-13J5F-B — Pure Current Command-Link Pulse Target Eligibility Contract\n.*?(?=J4D\+ additional tactical families remain \*\*DEFERRED / NOT CURRENTLY JUSTIFIED\*\*\.)',
              next_cont,
              'continuity next gameplay',
          )
          s = replace_exact(
              s,
              '`J5F-B Pure Current Command-Link Pulse Target Eligibility Contract → J5F-C+ separately proven damage policy/live application → J6 Dynamic Events → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance`',
              '`J5F-C Pure Non-Lethal Command-Link Pulse Damage Safety Envelope → J5F-D+ source tuning/live application → J6 Dynamic Events → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance`',
              'continuity chronology',
          )
          s = replace_regex(
              s,
              r'> Continue ORBI Energy Swarm autonomously\..*?(?=\n\n## Update obligation)',
              '> Continue ORBI Energy Swarm autonomously. Repository `ingeniusvictor/orbi-energy.swarm`. J5F-B gameplay canonical is `9812592dd77a0dd4e6364d57857f4c9065757d49`, fully DEPLOYED / FROZEN via Issue #359 / PR #360 with exact three-file product scope and post-main CI/Android/Pages GREEN. Complete DOC26 if still open, then implement J5F-C as a pure non-lethal Command-Link pulse damage-safety envelope only: consume frozen J5F-B eligibility and caller-supplied health/proposed-damage scalars; choose no tuning; cap safe damage so resulting health remains at least 1 HP; no live mutation, defeat/reward/drop attribution, entity lookup/scan/collection, timer/RNG or cap authority. Any source magnitude and live application remain J5F-D+ and require independent attribution/reward-deduplication proof. Keep J4D+ families and J3C-C deferred until prerequisites are proven. Follow Issue → Branch → full gates → PR → exact-SHA post-merge evidence. Never touch `main` directly or weaken tests.',
              'continuity handoff',
