          p.write_text(s)
          PY

      - name: Commit exact DOC26 candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git diff --cached --quiet && { echo 'DOC26 patch produced no documentation changes'; exit 1; }
          git commit -m 'ES-13DOC26: close J5F-B and activate J5F-C'

      - name: Install dependencies
        run: npm ci

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release Contract
        run: npm run release:verify

      - name: Manual dossier
        run: npm run release:evidence:verify

      - name: Production Build
        run: npm run build

      - name: RC readiness fail-closed
        run: npm run release:readiness -- --output release-readiness.json

      - name: DOC26 exact scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" HEAD
          mapfile -t actual < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          expected=(
            ".github/workflows/es-13doc26-patch-cert.yml"
            "docs/ES13_GAMEPLAY_ROADMAP.md"
            "docs/IMPLEMENTATION_LEDGER.md"
            "docs/PROJECT_CONTINUITY.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [[ "${#actual[@]}" -eq "${#expected_sorted[@]}" ]]
          for i in "${!expected_sorted[@]}"; do
            [[ "${actual[$i]}" == "${expected_sorted[$i]}" ]]
          done
          git diff --quiet "$BASE_SHA" HEAD -- src tests android public package.json package-lock.json

      - name: Push certified DOC26 candidate
        shell: bash
        run: git push origin HEAD:docs/es-13-j5fb-closure-j5fc-activation
