name: ES-13DOC34 Apply

on:
  push:
    branches:
      - docs/es-13-j6bd-closure-j7-discovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/es-13-j6bd-closure-j7-discovery
          fetch-depth: 0
      - name: Apply DOC34 fail-closed
        run: python scripts/es13doc34_apply.py
      - name: Validate exact DOC34 product scope and preservation
        shell: bash
        run: |
          test "$(git diff --name-only HEAD -- | sort | tr '\n' ' ')" = "docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md "
          ! git diff --name-only HEAD -- | grep -E '^(src/|tests/|package|public/|assets/|android/)'
          grep -q '^## Resolved diagnostics$' docs/PROJECT_CONTINUITY.md
          grep -q '^## Frozen manual/physical blockers$' docs/PROJECT_CONTINUITY.md
          grep -q '#4 — visual/responsive certification' docs/PROJECT_CONTINUITY.md
          grep -q '#248 — Android real-device certification' docs/PROJECT_CONTINUITY.md
          grep -q '^## J7 — Bonus Challenge Rounds$' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -q '^## J8 — Additional Game Modes$' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -q '^## J15 — Gameplay Integration & Long-Range Balance$' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -q '^## ES-14 — Living Warfront$' docs/ES13_GAMEPLAY_ROADMAP.md
      - name: Commit DOC34 docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m "ES-13DOC34: close J6B-D and activate J7 discovery"
          git push origin HEAD:docs/es-13-j6bd-closure-j7-discovery
