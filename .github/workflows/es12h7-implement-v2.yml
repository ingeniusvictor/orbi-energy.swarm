name: ES-12H7 Guarded Titan Implementation V2

on:
  push:
    branches:
      - feat/es-12h7-titan-core-chassis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/es-12h7-titan-core-chassis
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply fail-closed H7 runtime integration V2
        run: |
          python - <<'PYV2'
          from pathlib import Path

          workflow = Path('.github/workflows/es12h7-implement.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if workflow.count(start_marker) != 1:
              raise SystemExit(f"fail-closed: old patcher start count={workflow.count(start_marker)}")
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit("fail-closed: old patcher end marker missing")

          raw_script = workflow[start:end]
          script_lines = []
          for line in raw_script.splitlines():
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip() == '':
                  script_lines.append('')
              else:
                  raise SystemExit(f"fail-closed: unexpected patcher indentation: {line[:40]!r}")
          script = '\n'.join(script_lines) + '\n'

          old_start = '# Dynamic intro skip.\n'
          old_end = '# Data-driven weakpoint creation, preserving Devourer historical values.\n'
          if script.count(old_start) != 1 or script.count(old_end) != 1:
              raise SystemExit(
                  f"fail-closed: skip patch section markers start={script.count(old_start)} end={script.count(old_end)}"
              )
          si = script.index(old_start)
          ei = script.index(old_end, si)
          replacement = '''# Dynamic intro skip.
          skip_start = '  const skipBossIntro = () => {'
          skip_end = '  const spawnBossShieldNodes = (boss: Enemy) => {'
          skip_new = ''' + '"""' + '''  const skipBossIntro = () => {
            if (bossIntroTimeRef.current === null) return;
            bossIntroTimeRef.current = null;
            setBossIntroTime(null);
            if (bossRef.current) {
              bossRef.current.y = 150;
            }
            playHeavyImpactSound();
            const activeChassis = getBossChassisProfile(
              bossRef.current?.bossChassis ?? "DEVOURER",
            );
            postDialogue(
              "COMPANION",
              `¡ANOMALÍA ESTABILIZADA! Entrando en combate activo contra ${activeChassis.displayName}.`,
            );
          };

          ''' + '"""' + '''
          text = replace_between(
              text,
              skip_start,
              skip_end,
              skip_new,
              'dynamic boss intro skip',
          )

          '''
          script = script[:si] + replacement + script[ei:]
          exec(compile(script, 'es12h7-patcher-v2.py', 'exec'), {})
          PYV2
      - name: Repository Smoke
        run: npm run test:repo
      - name: Gameplay
        run: npm run test:gameplay
      - name: Platform
        run: npm run test:platform
      - name: Typecheck
        run: npm run typecheck
      - name: Production Build
        run: npm run build
      - name: Materialize certified H7 product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/es12h7-implement.yml \
            .github/workflows/es12h7-implement-v2.yml
          git add \
            src/game/types.ts \
            src/game/EnergySwarmCanvas.tsx \
            src/game/EnergySwarmGame.tsx \
            tests/runtime-boss-rematch-gate.test.ts \
            tests/infinite-boss-family-runtime.test.ts \
            tests/runtime-boss-rematch-adoption.test.ts \
            tests/titan-runtime-adoption.test.ts
          git diff --cached --check
          ACTUAL="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/es12h7-implement-v2.yml' \
            '.github/workflows/es12h7-implement.yml' \
            'src/game/EnergySwarmCanvas.tsx' \
            'src/game/EnergySwarmGame.tsx' \
            'src/game/types.ts' \
            'tests/infinite-boss-family-runtime.test.ts' \
            'tests/runtime-boss-rematch-adoption.test.ts' \
            'tests/runtime-boss-rematch-gate.test.ts' \
            'tests/titan-runtime-adoption.test.ts' | sort)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo 'fail-closed: unexpected staged paths'
            echo '--- actual ---'
            printf '%s\n' "$ACTUAL"
            echo '--- expected ---'
            printf '%s\n' "$EXPECTED"
            exit 1
          fi
          git commit -m "feat(h7): integrate Titan Core raid chassis"
          git push origin HEAD:feat/es-12h7-titan-core-chassis
