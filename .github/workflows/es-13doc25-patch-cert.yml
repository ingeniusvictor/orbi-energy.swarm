name: ES-13DOC25 Patch and Certification

on:
  push:
    branches:
      - docs/es-13-j5fa-closure-j5fb-activation
    paths:
      - '.github/workflows/es-13doc25-patch-cert.yml'

permissions:
  contents: write

jobs:
  patch-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 90f3fc82271654e6d7a7076474ae46efd02775e4
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/es-13-j5fa-closure-j5fb-activation

      - name: Apply DOC25 exact anchored patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def rex(text, pattern, replacement, label):
              out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, got {count}")
              return out

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          # ROADMAP
          p = Path('docs/ES13_GAMEPLAY_ROADMAP.md')
          s = p.read_text()
          section = '''### J5F-A — Pure Optional Command-Link Disruption Pulse Contract
          Status: **DEPLOYED / FROZEN**
          Canonical: `90f3fc82271654e6d7a7076474ae46efd02775e4`
          Issue #355 / PR #356

          Certified contract:
          - consumes frozen J5D `CommandLinkBreakResolution` as a type-only prerequisite;
          - explicit source freshness is caller-supplied as `CURRENT` / `STALE`, and `STALE` fails closed;
          - valid projections use `COMMAND_LINK_DISRUPTION_PULSE`, `PULSE_LINKED_MEMBERS`, `PROPOSAL_ONLY`, target role `LINKED_MEMBER`;
          - bounded target member indices remain exactly `[1]` or `[1,2]`;
          - current-formation and living-target requirements are metadata only;
          - explicit zero-effect facts keep damage, kills, score, rewards, projectiles and formation mutation false;
          - no runtime/entity lookup, scan, collection, clock/RNG, cap/budget or mutation authority;
          - no live adoption and no collision with existing combat-resonance chain semantics.

          Exact deployment anchors:
          - pre-PR `074d8f38a24eab6eb3a5adf448cd7fbdee8d57f8`, run `38683045891` / job `116251639676` GREEN including exact scope + Android APK build/verify/upload;
          - final PR #356 head `d5afcd198efbefa16eeb4659650db3f0ab7eebc8`;
          - PR CI `38683347951` / `116252576394` GREEN; Android `38683348067` / `116252576749` GREEN;
          - canonical `90f3fc82271654e6d7a7076474ae46efd02775e4`, parent `a94883c1532ba14e9c81b0a16e923a730aa1275d`, tree `e0226f6da7fb90b54a612b5e42716437b19ca171`;
          - main CI `38683470982` / `116252958810` GREEN; Android `38683471108` / `116252959290` GREEN;
          - Pages `38683544584`, build `116253182791` + deploy `116253277337` GREEN.

          ### J5F-B — Pure Current Command-Link Pulse Target Eligibility Contract
          Status: **NEXT ACTIVE ENGINEERING SLICE AFTER DOC25 CLOSURE**

          J5F-A proves only a bounded proposal. J5F-B must prove that one caller-supplied current candidate is eligible before any damage magnitude or live mutation is allowed.

          Required direction:
          - pure deterministic helper only; no live `EnergySwarmGame.tsx` adoption;
          - consume a frozen J5F-A projection plus current bounded formation facts for one candidate and explicit living state;
          - require exact J5F-A proposal semantics: `COMMAND_LINK_DISRUPTION_PULSE`, `PULSE_LINKED_MEMBERS`, `PROPOSAL_ONLY`, `LINKED_MEMBER`;
          - require current candidate `groupId` equality, bounded target-member index membership and J5B binding role `LINKED_MEMBER`;
          - require `isLiving === true`;
          - absent/malformed/wrong-group/core/unsupported candidates fail closed;
          - return immutable `ELIGIBLE_ONLY` metadata only;
          - no ids beyond existing opaque group facts, lookup, scan, collection, health mutation, damage/kill, defeat, score/reward, projectile, formation mutation, clock/RNG, cap/budget or entity create/remove authority;
          - damage policy/magnitude and live application remain J5F-C+ and require separate attribution/reward-deduplication proof.

          '''
          s = rex(s, r'### J5F-A — Pure Optional Command-Link Combat Effect Contract\n.*?(?=## J6 — Dynamic Mid-Sector Events)', section, 'roadmap J5F-A/J5F-B')
          p.write_text(s)

          # LEDGER
          p = Path('docs/IMPLEMENTATION_LEDGER.md')
          s = p.read_text()
          anchor = '| ES-13J5E — Controlled Live Command-Link Detach Application | DEPLOYED / FROZEN | `6aa63e9643a2521738b3b6afebfb0856f48bd3fd` | #351 | #352 |'
          row = '| ES-13J5F-A — Pure Optional Command-Link Disruption Pulse Contract | DEPLOYED / FROZEN | `90f3fc82271654e6d7a7076474ae46efd02775e4` | #355 | #356 |'
          s = one(s, anchor, anchor + '\n' + row, 'ledger milestone row')

          evidence = '''### J5F-A — Pure Optional Command-Link Disruption Pulse Contract
          J5F-A introduced one pure, immutable and non-live proposal for an optional Command-Link disruption pulse while preserving every frozen J5 prerequisite and all runtime/combat authorities.

          Final product diff exactly:
          - `src/game/commandLinkCombatEffectContract.ts`;
          - `tests/es-13j5fa-command-link-combat-effect-contract.test.mjs`;
          - `tests/gameplay/command-link-combat-effect-contract.test.ts`.

          Exact evidence:
          - baseline DOC24 `a94883c1532ba14e9c81b0a16e923a730aa1275d`;
          - pre-PR SHA `074d8f38a24eab6eb3a5adf448cd7fbdee8d57f8`, run `38683045891` / job `116251639676` GREEN including repo/gameplay/platform/typecheck/release/dossier/build/readiness, exact scope guard and Android APK build/verify/upload;
          - final PR #356 head `d5afcd198efbefa16eeb4659650db3f0ab7eebc8`;
          - PR CI `38683347951` / `116252576394` GREEN;
          - PR Android `38683348067` / `116252576749` GREEN including Build/Verify/Upload APK;
          - canonical `90f3fc82271654e6d7a7076474ae46efd02775e4`, single parent `a94883c1532ba14e9c81b0a16e923a730aa1275d`, tree `e0226f6da7fb90b54a612b5e42716437b19ca171`;
          - canonical diff exactly three certified J5F-A files;
          - main CI `38683470982` / `116252958810` GREEN;
          - main Android `38683471108` / `116252959290` GREEN including Build/Verify/Upload APK;
          - Pages `38683544584`: build `116253182791` + deploy `116253277337` GREEN.

          Issue #355 CLOSED / completed. J5F-A is **DEPLOYED / FROZEN**.

          '''
          s = one(s, '## Documentation canonicals\n', evidence + '## Documentation canonicals\n', 'ledger J5F-A evidence')
          s = one(
              s,
              '- DOC24 — J5E closure & J5F-A activation: Issue #353, branch `docs/es-13-j5e-closure-j5fa-activation`, in progress from gameplay canonical `6aa63e9643a2521738b3b6afebfb0856f48bd3fd`.',
              '- DOC24 — J5E closure & J5F-A activation: `a94883c1532ba14e9c81b0a16e923a730aa1275d` — Issue #353 / PR #354.\n- DOC25 — J5F-A closure & J5F-B target eligibility activation: Issue #357, branch `docs/es-13-j5fa-closure-j5fb-activation`, in progress from gameplay canonical `90f3fc82271654e6d7a7076474ae46efd02775e4`.',
              'ledger DOC24/DOC25',
          )
          next_section = '''### ES-13J5F-B — Pure Current Command-Link Pulse Target Eligibility Contract
          Status: **NEXT ENGINEERING TARGET AFTER DOC25 CLOSURE**.

          J5F-A is frozen as proposal-only. J5F-B must prove eligibility for one caller-supplied current candidate by composing frozen J5F-A projection semantics with current bounded formation facts, J5B linked-member binding and explicit living state.

          J5F-B returns immutable `ELIGIBLE_ONLY` metadata and may not add live ids, entity lookup/scans/collections, runtime mutation, health/damage/kill/defeat authority, score/reward/economy, projectiles, formation mutation, timer/RNG, cap/budget or entity create/remove authority. Damage magnitude/policy and live adoption remain J5F-C+ and require separate defeat-attribution and reward-deduplication proof.

          '''
          s = rex(s, r'### ES-13J5F-A — Pure Optional Command-Link Combat Effect Contract\n.*?(?=J4D\+ additional tactical families remain deferred:)', next_section, 'ledger next gameplay')
          s = one(
              s,
              '`J5F-A Pure Optional Command-Link Combat Effect Contract → J5F-B+ separately proven live effects → J6 Dynamic Events → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance → ES-14 Living Warfront`',
              '`J5F-B Pure Current Command-Link Pulse Target Eligibility Contract → J5F-C+ separately proven damage policy/live application → J6 Dynamic Events → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance → ES-14 Living Warfront`',
              'ledger program sequence',
          )
          p.write_text(s)

          # CONTINUITY
          p = Path('docs/PROJECT_CONTINUITY.md')
          s = p.read_text()
          current = '''## Current certified gameplay canonical

          `90f3fc82271654e6d7a7076474ae46efd02775e4`

          Phase: **ES-13J5F-A — Pure Optional Command-Link Disruption Pulse Contract**
          Status: **DEPLOYED / FROZEN**
          Issue: #355 — CLOSED / completed
          Delivery: PR #356 — squash merged

          Single parent: `a94883c1532ba14e9c81b0a16e923a730aa1275d` — DOC24 documentation canonical.

          Canonical tree: `e0226f6da7fb90b54a612b5e42716437b19ca171`.

          '''
          s = rex(s, r'## Current certified gameplay canonical\n.*?(?=Version remains `0\.2\.0-beta\.1`\.)', current, 'continuity current canonical')

          result = '''## J5F-A result
          J5F-A established a pure optional Command-Link disruption-pulse proposal without creating any live combat consequence.

          Certified contract:
          - consumes frozen J5D break resolution as a type-only prerequisite;
          - caller-supplied freshness `CURRENT` / `STALE`; only CURRENT may project;
          - exact vocabulary `COMMAND_LINK_DISRUPTION_PULSE` / `PULSE_LINKED_MEMBERS` / `PROPOSAL_ONLY` / `LINKED_MEMBER`;
          - target indices remain bounded to `[1]` or `[1,2]`;
          - projection and target-index arrays are immutable;
          - current-formation and living-target requirements remain metadata only;
          - explicit zero-effect facts prohibit damage, kills, score, rewards, projectiles and formation mutation;
          - no entity lookup/scan/collection, runtime mutation, clock/RNG, cap/budget or entity create/remove authority;
          - no live adoption and no collision with combat-resonance chain semantics.

          Final product scope exactly:
          - `src/game/commandLinkCombatEffectContract.ts`;
          - `tests/es-13j5fa-command-link-combat-effect-contract.test.mjs`;
          - `tests/gameplay/command-link-combat-effect-contract.test.ts`.

          ## J5F-A exact evidence
          - DOC24 baseline `a94883c1532ba14e9c81b0a16e923a730aa1275d`;
          - pre-PR SHA `074d8f38a24eab6eb3a5adf448cd7fbdee8d57f8`, run `38683045891` / job `116251639676` GREEN including repo/gameplay/platform/typecheck/release/dossier/build/readiness, exact scope guard and Android APK build/verify/upload;
          - final PR #356 head `d5afcd198efbefa16eeb4659650db3f0ab7eebc8`;
          - PR CI `38683347951` / `116252576394` GREEN;
          - PR Android `38683348067` / `116252576749` GREEN including Build/Verify/Upload APK;
          - canonical `90f3fc82271654e6d7a7076474ae46efd02775e4`, single parent `a94883c1532ba14e9c81b0a16e923a730aa1275d`, tree `e0226f6da7fb90b54a612b5e42716437b19ca171`;
          - canonical diff exactly three certified product/test files;
          - main CI `38683470982` / `116252958810` GREEN;
          - main Android `38683471108` / `116252959290` GREEN including Build/Verify/Upload APK;
          - Pages `38683544584`: build `116253182791` + deploy `116253277337` GREEN.

          Issue #355 CLOSED / completed. J5F-A is **DEPLOYED / FROZEN**.

          '''
          s = one(s, '## ES-13 gameplay canonicals\n', result + '## ES-13 gameplay canonicals\n', 'continuity J5F-A evidence')
          s = one(
              s,
              '- J5E — Controlled Live Command-Link Detach Application: `6aa63e9643a2521738b3b6afebfb0856f48bd3fd`.',
              '- J5E — Controlled Live Command-Link Detach Application: `6aa63e9643a2521738b3b6afebfb0856f48bd3fd`.\n- J5F-A — Pure Optional Command-Link Disruption Pulse Contract: `90f3fc82271654e6d7a7076474ae46efd02775e4`.',
              'continuity canonical list',
          )
          s = one(
              s,
              '- DOC24 — J5E closure & J5F-A activation: Issue #353, branch `docs/es-13-j5e-closure-j5fa-activation`, documentation-only closure in progress from gameplay canonical `6aa63e9643a2521738b3b6afebfb0856f48bd3fd`.',
              '- DOC24 — J5E closure & J5F-A activation: `a94883c1532ba14e9c81b0a16e923a730aa1275d` — Issue #353 / PR #354.\n- DOC25 — J5F-A closure & J5F-B target eligibility activation: Issue #357, branch `docs/es-13-j5fa-closure-j5fb-activation`, documentation-only closure in progress from gameplay canonical `90f3fc82271654e6d7a7076474ae46efd02775e4`.',
              'continuity DOC24/DOC25',
          )
          next_cont = '''## Next gameplay phase

          ### ES-13J5F-B — Pure Current Command-Link Pulse Target Eligibility Contract
          Status: **NEXT ENGINEERING TARGET AFTER DOC25 CLOSURE**

          J5F-A is frozen as proposal-only. J5F-B resolves whether one caller-supplied current formation candidate is eligible for that proposal; it still does not apply an effect.

          Required direction:
          - pure deterministic helper only; no `EnergySwarmGame.tsx` adoption;
          - consume frozen J5F-A projection + current bounded formation facts for one candidate + explicit living state;
          - require exact J5F-A proposal vocabulary and current J5B `LINKED_MEMBER` binding;
          - require exact group identity match and candidate member index membership in the bounded projection target indices;
          - require `isLiving === true`;
          - absent/malformed/wrong-group/core/unsupported candidates fail closed;
          - return immutable `ELIGIBLE_ONLY` metadata only;
          - no live ids, lookup, scan, collection, health mutation, damage/kill/defeat, score/reward/economy, projectile, formation mutation, clock/RNG, cap/budget or entity create/remove authority;
          - J5F-C+ remains responsible for any damage magnitude/policy and live application, with independent defeat-attribution and duplicate-reward prevention proof.

          J4D+ additional tactical families remain **DEFERRED / NOT CURRENTLY JUSTIFIED**. J3C-C remains deferred, not cancelled.

          '''
          s = rex(s, r'## Next gameplay phase\n.*?(?=## Resolved diagnostics)', next_cont, 'continuity next phase')
          s = one(
              s,
              '`J5F-A Pure Optional Command-Link Combat Effect Contract → J5F-B+ separately proven live effects → J6 Dynamic Events → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance`',
              '`J5F-B Pure Current Command-Link Pulse Target Eligibility Contract → J5F-C+ separately proven damage policy/live application → J6 Dynamic Events → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance`',
              'continuity chronology',
          )
          s = rex(
              s,
              r'> Continue ORBI Energy Swarm autonomously\..*?(?=\n\n## Update obligation)',
              '> Continue ORBI Energy Swarm autonomously. Repository `ingeniusvictor/orbi-energy.swarm`. J5F-A gameplay canonical is `90f3fc82271654e6d7a7076474ae46efd02775e4`, fully DEPLOYED / FROZEN via Issue #355 / PR #356 with exact three-file product scope and post-main CI/Android/Pages GREEN. Complete DOC25 if still open, then implement J5F-B as a pure current Command-Link pulse target-eligibility contract only: compose frozen J5F-A proposal semantics with one caller-supplied current formation candidate, J5B linked-member binding and explicit living state; return ELIGIBLE_ONLY. No live adoption, health/damage/kill/defeat, reward/score, entity lookup/scan/collection, timer/RNG or cap authority. Any damage policy/live application remains J5F-C+ and requires independent attribution/reward-deduplication proof. Keep J4D+ families and J3C-C deferred until prerequisites are proven. Follow Issue → Branch → full gates → PR → exact-SHA post-merge evidence. Never touch `main` directly or weaken tests.',
              'continuity handoff',
          )
          p.write_text(s)

          print('DOC25 patch applied to exactly three documentation files')
          PY

          git diff --check
          test "$(git diff --name-only | sort | paste -sd ' ' -)" = "docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md"
          git status --short

      - name: Commit exact DOC25 candidate locally
        shell: bash
        run: |
          git config user.name ingeniusvictor
          git config user.email ingenius.victor@gmail.com
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git commit -m 'ES-13DOC25: close J5F-A and activate J5F-B eligibility'
          echo "CERT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release Contract
        run: npm run release:verify

      - name: Manual dossier
        run: npm run release:evidence:verify

      - name: Production Build
        run: npm run build

      - name: RC readiness fail-closed
        run: npm run release:readiness -- --output release-readiness.json

      - name: DOC25 exact scope guard
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CERT_SHA" == "$(git rev-parse HEAD)" ]]
          git diff --check "$BASE_SHA" HEAD
          mapfile -t actual < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          expected=(
            ".github/workflows/es-13doc25-patch-cert.yml"
            "docs/ES13_GAMEPLAY_ROADMAP.md"
            "docs/IMPLEMENTATION_LEDGER.md"
            "docs/PROJECT_CONTINUITY.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [[ "${#actual[@]}" -eq "${#expected_sorted[@]}" ]]
          for i in "${!expected_sorted[@]}"; do
            [[ "${actual[$i]}" == "${expected_sorted[$i]}" ]]
          done
          git diff --quiet "$BASE_SHA" HEAD -- src tests android public package.json package-lock.json

      - name: Push certified DOC25 candidate
        shell: bash
        run: |
          git push origin HEAD:docs/es-13-j5fa-closure-j5fb-activation
          echo "PUSHED_CERT_SHA=$(git rev-parse HEAD)"
