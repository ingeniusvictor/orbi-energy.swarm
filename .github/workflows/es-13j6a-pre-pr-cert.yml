name: ES-13J6A Pre-PR Certification

on:
  push:
    branches:
      - es-13j6a-pure-dynamic-event-opportunity
    paths:
      - '.github/workflows/es-13j6a-pre-pr-cert.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: 0dca89678698be0557f0500590f27c9f53ab1548
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: es-13j6a-pure-dynamic-event-opportunity

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release Contract
        run: npm run release:verify

      - name: Manual dossier
        run: npm run release:evidence:verify

      - name: Production Build
        run: npm run build

      - name: RC readiness fail-closed
        run: npm run release:readiness

      - name: J6A exact product scope guard
        shell: bash
        run: |
          git diff --name-only "$BASE_SHA"...HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/es-13j6a-pre-pr-cert.yml' \
            'src/game/dynamicMidSectorEventOpportunity.ts' \
            'tests/es-13j6a-dynamic-mid-sector-event-opportunity.test.mjs' \
            'tests/gameplay/dynamic-mid-sector-event-opportunity.test.ts' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbi-energy-swarm-j6a-pre-pr-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
