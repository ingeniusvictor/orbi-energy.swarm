name: ES-13DOC29 Patch and Certification

on:
  push:
    branches:
      - docs/es-13-j5fe-closure-j6a-activation
    paths:
      - '.github/workflows/es-13doc29-patch-cert.yml'

permissions:
  contents: write

jobs:
  patch-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 9554358005d6d092341f4f65d8b986090307f8b5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/es-13-j5fe-closure-j6a-activation

      - name: Apply DOC29 exact anchored patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old, new, 1)

          def replace_regex(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, got {count}")
              return updated

          j5fe_evidence = '''### J5F-E — Controlled Live Command-Link Disruption Pulse Application
          Status: **DEPLOYED / FROZEN**
          Canonical: `9554358005d6d092341f4f65d8b986090307f8b5`
          Issue #371 / PR #372

          Certified live behavior:
          - composes frozen J5F-A/B/C/D through one bounded live adapter;
          - direct/splash paths capture local pre-hit source health before the existing damage subtraction;
          - only the exact lethal hit against a valid current Command Core may raise one scalar pending pulse;
          - current linked-member eligibility and non-lethal health projection are consumed inside the already-existing enemy traversal and before J5E detach;
          - linked mutation is limited to the frozen J5F-C `resultingHealth` with exact 1 HP floor;
          - linked targets never receive `isDead` from the pulse and never generate pulse defeat, score, reward, drop or persistence attribution;
          - pending pulse is consumed with identity guard and reset at the same three J3/J5E lifecycle boundaries;
          - no second scan/index/collection, Enemy field, new projectile, timer/RNG, spawn/progression, cap/budget, presentation or audio authority.

          Exact deployment anchors:
          - DOC28 baseline `022741e5c500dea2947241d4bb8c6cb8d004772c`;
          - pre-PR `098726ad50eb74686fd186703d73a46e79eda340`, run `38729351008` / job `116402995881` GREEN including exact scope + Android APK;
          - final PR #372 head `98761ecaaaa0e873d8a0468d92ed0c70ce45cf57`;
          - PR CI `38729931559` / `116404920626` GREEN; Android `38729931466` / `116404919622` GREEN;
          - canonical `9554358005d6d092341f4f65d8b986090307f8b5`, parent `022741e5c500dea2947241d4bb8c6cb8d004772c`, tree `7cdc717088f0b4543564d0db404d444fcb2ac8d2`;
          - main CI `38730136916` / `116405605392` GREEN; Android `38730137080` / `116405605024` GREEN;
          - Pages `38730253083`, build `116405984608` + deploy `116406188447` GREEN.

          '''

          j6a = '''### J6A — Pure Dynamic Mid-Sector Event Opportunity Contract
          Status: **NEXT ACTIVE ENGINEERING SLICE AFTER DOC29 CLOSURE**

          Architecture discovery reuses existing Infinite authority instead of creating a parallel event director:
          - `RuntimeWaveDescriptor` already exposes source mode, sector, wave index/count, mutators, milestone, fairness and traceable source/seed facts;
          - Infinite sectors already contain 3–7 waves;
          - milestone ownership is final-wave only;
          - recovery sectors already exist explicitly and suppress mutators;
          - environmental mutator selection/conflicts and runtime environmental effects already have dedicated authorities.

          Required J6A direction:
          - pure deterministic/fail-closed contract only; no `EnergySwarmGame.tsx` adoption;
          - consume caller-supplied existing sector/wave facts; own no runtime state;
          - Campaign, recovery sectors, milestone waves and invalid/stale facts fail closed;
          - only interior Infinite waves (`waveIndex > 1 && waveIndex < waveCount`) may expose an opportunity;
          - at most one deterministic opportunity slot per sector, derived from existing sector/wave identity/seed facts without a new RNG or clock;
          - output immutable `OPPORTUNITY_ONLY` metadata;
          - J6A does not yet select Solar Storm, Quantum Rift, Blackout Surge, Crystal Rush, Dyson Eclipse or any other event identity/effect;
          - no spawn/entity/projectile collection, damage/defeat, score/reward/economy, mutator/environment mutation, lookup/scan, timer/RNG, cap/budget mutation or entity create/remove authority.

          Event vocabulary and live effect mapping require later J6 slices after J6A is certified.

          '''

          # ROADMAP
          p = Path('docs/ES13_GAMEPLAY_ROADMAP.md')
          s = p.read_text()
          s = replace_regex(
              s,
              r'### J5F-E — Controlled Live Command-Link Disruption Pulse Application\n.*?(?=## J6 — Dynamic Mid-Sector Events)',
              j5fe_evidence,
              'roadmap J5F-E closure',
          )
          j6_block = '''## J6 — Dynamic Mid-Sector Events
          Status: ACTIVE PROGRAM / CONTRACT-FIRST

          ''' + j6a + '''Planned vocabulary remains Solar Storm, Quantum Rift, Blackout Surge, Crystal Rush, Dyson Eclipse, Swarm Distress Call, Convoy Defense, Void Hunt, Elite Incursion, Mirror Swarm, Meteor/Debris Field and Singularity Event. J6A activates only the bounded opportunity contract; event identity and live effects remain deferred.

          '''
          s = replace_regex(s, r'## J6 — Dynamic Mid-Sector Events\n.*?(?=## J7 — Bonus Challenge Rounds)', j6_block, 'roadmap J6 activation')
          p.write_text(s)

          # LEDGER
          p = Path('docs/IMPLEMENTATION_LEDGER.md')
          s = p.read_text()
          j5fd_row = '| ES-13J5F-D — Pure Effective Trigger-Damage Source Projection | DEPLOYED / FROZEN | `113865079ac4581c90356c3c218a28f8f88b6ef7` | #367 | #368 |'
          j5fe_row = '| ES-13J5F-E — Controlled Live Command-Link Disruption Pulse Application | DEPLOYED / FROZEN | `9554358005d6d092341f4f65d8b986090307f8b5` | #371 | #372 |'
          s = replace_exact(s, j5fd_row, j5fd_row + '\n' + j5fe_row, 'ledger milestone row')
          ledger_evidence = j5fe_evidence.replace('Status: **DEPLOYED / FROZEN**\nCanonical: `9554358005d6d092341f4f65d8b986090307f8b5`\nIssue #371 / PR #372\n\n', '')
          ledger_evidence += 'Issue #371 CLOSED / completed. J5F-E is **DEPLOYED / FROZEN**.\n\n'
          s = replace_exact(s, '## Documentation canonicals\n', ledger_evidence + '## Documentation canonicals\n', 'ledger J5F-E evidence')
          s = replace_exact(
              s,
              '- DOC28 — J5F-D closure & J5F-E controlled live pulse activation: Issue #369, branch `docs/es-13-j5fd-closure-j5fe-live-pulse`, in progress from gameplay canonical `113865079ac4581c90356c3c218a28f8f88b6ef7`.',
              '- DOC28 — J5F-D closure & J5F-E controlled live pulse activation: `022741e5c500dea2947241d4bb8c6cb8d004772c` — Issue #369 / PR #370.\n- DOC29 — J5F-E closure & J6A dynamic event opportunity activation: Issue #373, branch `docs/es-13-j5fe-closure-j6a-activation`, in progress from gameplay canonical `9554358005d6d092341f4f65d8b986090307f8b5`.',
              'ledger DOC28/DOC29',
          )
          ledger_next = '''### ES-13J6A — Pure Dynamic Mid-Sector Event Opportunity Contract
          Status: **NEXT ENGINEERING TARGET AFTER DOC29 CLOSURE**.

          J6A is contract-first and may only decide whether one bounded mid-sector event opportunity exists. It consumes existing Infinite sector/wave facts, fails closed for Campaign/recovery/milestone/invalid facts, permits only an interior wave, and derives at most one opportunity slot per sector from existing identity/seed facts without new clock/RNG ownership.

          J6A emits immutable `OPPORTUNITY_ONLY` metadata only. It selects no event vocabulary and owns no live effect, spawn/entity/projectile collection, damage/defeat, score/reward/economy, mutator/environment mutation, lookup/scan, timer/RNG, cap/budget or entity create/remove authority.

          '''
          s = replace_regex(s, r'### ES-13J5F-E — Controlled Live Command-Link Disruption Pulse Application\n.*?(?=J4D\+ additional tactical families remain deferred:)', ledger_next, 'ledger next gameplay')
          s = replace_exact(
              s,
              '`J5F-E Controlled Live Command-Link Disruption Pulse Application → J6 Dynamic Events → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance → ES-14 Living Warfront`',
              '`J6A Pure Dynamic Mid-Sector Event Opportunity Contract → J6B+ Event Vocabulary/Live Effects → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance → ES-14 Living Warfront`',
              'ledger program sequence',
          )
          p.write_text(s)

          # CONTINUITY
          p = Path('docs/PROJECT_CONTINUITY.md')
          s = p.read_text()
          current = '''## Current certified gameplay canonical

          `9554358005d6d092341f4f65d8b986090307f8b5`

          Phase: **ES-13J5F-E — Controlled Live Command-Link Disruption Pulse Application**
          Status: **DEPLOYED / FROZEN**
          Issue: #371 — CLOSED / completed
          Delivery: PR #372 — squash merged

          Single parent: `022741e5c500dea2947241d4bb8c6cb8d004772c` — DOC28 documentation canonical.

          Canonical tree: `7cdc717088f0b4543564d0db404d444fcb2ac8d2`.

          '''
          s = replace_regex(s, r'## Current certified gameplay canonical\n.*?(?=Version remains `0\.2\.0-beta\.1`\.)', current, 'continuity current canonical')
          cont_evidence = '''## J5F-E result
          J5F-E delivered the first controlled live non-lethal Command-Link disruption pulse while preserving exact defeat attribution and all frozen J5 authorities.

          Certified live behavior:
          - one scalar pending pulse only;
          - local pre-hit source health captured for direct/splash paths before the existing subtraction;
          - only the lethal valid current Command Core hit raises pulse intent;
          - application occurs inside the existing enemy traversal before J5E detach;
          - only frozen J5F-C resulting health is applied, with exact 1 HP floor;
          - no linked `isDead`, pulse defeat, score/reward/drop/persistence, second scan/index/collection, timer/RNG, cap/budget, presentation or audio authority.

          Final product scope exactly:
          - `src/game/EnergySwarmGame.tsx`;
          - `src/game/liveCommandLinkPulseApplication.ts`;
          - `tests/es-13j5fe-live-command-link-pulse-application.test.mjs`;
          - `tests/gameplay/live-command-link-pulse-application.test.ts`.

          ## J5F-E exact evidence
          - DOC28 baseline `022741e5c500dea2947241d4bb8c6cb8d004772c`;
          - pre-PR SHA `098726ad50eb74686fd186703d73a46e79eda340`, run `38729351008` / job `116402995881` GREEN including repo/gameplay/platform/typecheck/release/dossier/build/readiness, exact product-scope guard and Android APK build/verify/upload;
          - final PR #372 head `98761ecaaaa0e873d8a0468d92ed0c70ce45cf57`;
          - PR CI `38729931559` / `116404920626` GREEN;
          - PR Android `38729931466` / `116404919622` GREEN including Build/Verify/Upload APK;
          - canonical `9554358005d6d092341f4f65d8b986090307f8b5`, single parent `022741e5c500dea2947241d4bb8c6cb8d004772c`, tree `7cdc717088f0b4543564d0db404d444fcb2ac8d2`;
          - canonical diff exactly four certified product/test files;
          - main CI `38730136916` / `116405605392` GREEN;
          - main Android `38730137080` / `116405605024` GREEN including Build/Verify/Upload APK;
          - Pages `38730253083`: build `116405984608` + deploy `116406188447` GREEN.

          Issue #371 CLOSED / completed. J5F-E is **DEPLOYED / FROZEN**.

          '''
          s = replace_exact(s, '## ES-13 gameplay canonicals\n', cont_evidence + '## ES-13 gameplay canonicals\n', 'continuity J5F-E evidence')
          s = replace_exact(
              s,
              '- J5F-D — Pure Effective Trigger-Damage Source Projection: `113865079ac4581c90356c3c218a28f8f88b6ef7`.',
              '- J5F-D — Pure Effective Trigger-Damage Source Projection: `113865079ac4581c90356c3c218a28f8f88b6ef7`.\n- J5F-E — Controlled Live Command-Link Disruption Pulse Application: `9554358005d6d092341f4f65d8b986090307f8b5`.',
              'continuity canonical list',
          )
          s = replace_exact(
              s,
              '- DOC28 — J5F-D closure & J5F-E controlled live pulse activation: Issue #369, branch `docs/es-13-j5fd-closure-j5fe-live-pulse`, documentation-only closure in progress from gameplay canonical `113865079ac4581c90356c3c218a28f8f88b6ef7`.',
              '- DOC28 — J5F-D closure & J5F-E controlled live pulse activation: `022741e5c500dea2947241d4bb8c6cb8d004772c` — Issue #369 / PR #370.\n- DOC29 — J5F-E closure & J6A dynamic event opportunity activation: Issue #373, branch `docs/es-13-j5fe-closure-j6a-activation`, documentation-only closure in progress from gameplay canonical `9554358005d6d092341f4f65d8b986090307f8b5`.',
              'continuity DOC28/DOC29',
          )
          cont_next = '''### ES-13J6A — Pure Dynamic Mid-Sector Event Opportunity Contract
          Status: **NEXT ENGINEERING TARGET AFTER DOC29 CLOSURE**

          J6A reuses existing Infinite sector/wave descriptors and environmental authorities. It defines only whether one bounded event opportunity exists; it does not select or run an event.

          Required direction:
          - pure helper/contract only; no `EnergySwarmGame.tsx` adoption;
          - caller supplies current existing Infinite sector/wave facts;
          - Campaign/recovery/milestone/invalid facts fail closed;
          - only interior waves may qualify;
          - at most one deterministic opportunity slot per sector from existing identity/seed facts;
          - immutable `OPPORTUNITY_ONLY` output;
          - no event vocabulary/live effect yet and no spawn, collection, combat/economy, environment mutation, scan/lookup, timer/RNG, cap/budget or entity authority.

          '''
          s = replace_regex(s, r'### ES-13J5F-E — Controlled Live Command-Link Disruption Pulse Application\n.*?(?=J4D\+ additional tactical families remain \*\*DEFERRED)', cont_next, 'continuity next gameplay')
          s = replace_exact(
              s,
              '`J5F-E Controlled Live Command-Link Disruption Pulse Application → J6 Dynamic Events → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance`',
              '`J6A Pure Dynamic Mid-Sector Event Opportunity Contract → J6B+ Event Vocabulary/Live Effects → J7 Bonus Rounds → J8 Additional Modes → J9 Boss Expansion → J10 Expert Risk/Reward → J11 Build/Synergy → J12 Rare/Secret Encounters → J13 Score/Rank/Mastery → J14 Procedural Matrix → J15 Integration/Balance`',
              'continuity chronology',
          )
          handoff = '''Suggested handoff:
          > Continue ORBI Energy Swarm autonomously. Repository `ingeniusvictor/orbi-energy.swarm`. J5F-E gameplay canonical is `9554358005d6d092341f4f65d8b986090307f8b5`, fully DEPLOYED / FROZEN via Issue #371 / PR #372 with exact four-file product scope and post-main CI/Android/Pages GREEN. Complete DOC29 if still open, then implement J6A as a pure Dynamic Mid-Sector Event Opportunity Contract only: reuse existing Infinite sector/wave identity, fail closed for Campaign/recovery/milestone/invalid facts, allow only one deterministic interior-wave opportunity per sector, emit `OPPORTUNITY_ONLY`, and add no live event/effect, director, timer/RNG, scan/collection, combat/economy or cap authority. Event vocabulary and live effects remain J6B+. Keep J3C-C, J4D+ and manual blockers deferred. Follow Issue → Branch → full gates → PR → exact-SHA post-merge evidence. Never touch `main` directly or weaken tests.

          '''
          s = replace_regex(s, r'Suggested handoff:\n>.*?\n\n(?=## Update obligation)', handoff, 'continuity handoff')
          p.write_text(s)
          PY

      - name: Commit exact DOC29 candidate locally
        shell: bash
        run: |
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add docs/ES13_GAMEPLAY_ROADMAP.md docs/IMPLEMENTATION_LEDGER.md docs/PROJECT_CONTINUITY.md
          git diff --cached --quiet && { echo 'No DOC29 changes staged'; exit 1; }
          git commit -m "ES-13DOC29: close J5F-E and activate J6A"

      - name: Install dependencies
        run: npm ci
      - name: Repository Smoke
        run: npm run test:repo
      - name: Gameplay regression
        run: npm run test:gameplay
      - name: Platform regression
        run: npm run test:platform
      - name: Typecheck
        run: npm run typecheck
      - name: Release Contract
        run: npm run release:verify
      - name: Manual dossier
        run: npm run release:evidence:verify
      - name: Production Build
        run: npm run build
      - name: RC readiness fail-closed
        run: npm run release:readiness

      - name: DOC29 exact scope guard
        shell: bash
        run: |
          git diff --name-only "$BASE_SHA"...HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/es-13doc29-patch-cert.yml' \
            'docs/ES13_GAMEPLAY_ROADMAP.md' \
            'docs/IMPLEMENTATION_LEDGER.md' \
            'docs/PROJECT_CONTINUITY.md' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          ! git diff --name-only "$BASE_SHA"...HEAD | grep -E '^(src|tests|android|public)/|^(package|vite|tsconfig)|^\.github/workflows/(?!es-13doc29-patch-cert\.yml$)' || exit 1

      - name: Push certified DOC29 candidate
        shell: bash
        run: |
          git push origin HEAD:refs/heads/docs/es-13-j5fe-closure-j6a-activation
