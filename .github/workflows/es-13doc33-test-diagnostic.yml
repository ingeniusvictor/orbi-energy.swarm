name: ES-13DOC33 Test Diagnostic

on:
  push:
    branches:
      - docs/es-13-j6bc-closure-j6bd-activation

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/es-13-j6bc-closure-j6bd-activation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests file by file
        run: python scripts/es13doc33_test_diagnostic.py
      - name: Commit diagnostic result
        shell: bash
        run: |
          test -f .tmp/es13doc33-smoke-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/es13doc33-smoke-diagnostic.txt
          git commit -m "ES-13DOC33: capture temporary smoke diagnostic"
          git push origin HEAD:docs/es-13-j6bc-closure-j6bd-activation
