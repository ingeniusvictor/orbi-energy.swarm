name: ES-13J8A Certification

on:
  push:
    branches:
      - es-13j8a-pure-score-attack-profile
    paths:
      - .github/workflows/es-13j8a-cert.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repository Smoke
        run: npm run test:repo
      - name: Gameplay regression
        run: npm run test:gameplay
      - name: Platform regression
        run: npm run test:platform
      - name: Typecheck
        run: npm run typecheck
      - name: Release Contract
        run: npm run release:verify
      - name: Manual dossier
        run: npm run release:evidence:verify
      - name: Production Build
        run: npm run build
      - name: RC readiness fail-closed
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json
      - name: J8A exact product scope and authority guard
        run: |
          set -euo pipefail
          git diff --name-only 0b7e61820d139327046f02adbef604f65f1909ff -- \
            ':!.github/workflows/es-13j8a-cert.yml' | sort > /tmp/files.txt
          printf '%s\n' \
            src/game/scoreAttackModeContract.ts \
            tests/es-13j8a-score-attack-mode-contract.test.mjs \
            tests/gameplay/score-attack-mode-contract.test.ts | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt
          test -z "$(git diff --name-only 0b7e61820d139327046f02adbef604f65f1909ff -- \
            src/game/EnergySwarmGame.tsx \
            src/game/runtimeProgressionRouter.ts \
            src/game/runtimeWaveDescriptor.ts \
            src/game/runPersistence.ts \
            src/game/storage.ts \
            src/game/types.ts \
            src/components/StartScreen.tsx \
            src/components/ResultScreen.tsx \
            package.json package-lock.json public android)"
          ! grep -R "scoreAttackModeContract" \
            src/game/EnergySwarmGame.tsx \
            src/game/runtimeProgressionRouter.ts \
            src/game/runPersistence.ts \
            src/game/storage.ts \
            src/components/StartScreen.tsx \
            src/components/ResultScreen.tsx
      - name: Upload RC readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8a-rc-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Install dependencies
        run: npm ci
      - name: Build Android debug APK
        run: npm run android:debug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j8a-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
