name: ES-13DOC33 Repair

on:
  push:
    branches:
      - docs/es-13-j6bc-closure-j6bd-activation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/es-13-j6bc-closure-j6bd-activation
          fetch-depth: 0
      - name: Restore frozen roadmap suffix fail-closed
        run: python scripts/es13doc33_repair.py
      - name: Validate roadmap preservation and DOC33 scope
        shell: bash
        run: |
          grep -q '^## J7 — Bonus Challenge Rounds$' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -q '^## J15 — Gameplay Integration & Long-Range Balance$' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -q '^## ES-14 — Living Warfront$' docs/ES13_GAMEPLAY_ROADMAP.md
          grep -q '^## Recovery discipline$' docs/ES13_GAMEPLAY_ROADMAP.md
          test "$(git diff --name-only HEAD -- | sort | tr '\n' ' ')" = "docs/ES13_GAMEPLAY_ROADMAP.md "
      - name: Commit repaired roadmap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ES13_GAMEPLAY_ROADMAP.md
          git commit -m "ES-13DOC33: preserve J7+ roadmap after J6B-D activation"
          git push origin HEAD:docs/es-13-j6bc-closure-j6bd-activation
