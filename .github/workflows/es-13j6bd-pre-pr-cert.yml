name: ES-13J6B-D Pre-PR Certification

on:
  push:
    branches:
      - es-13j6bd-controlled-live-event-adoption

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repository Smoke
        run: npm test
      - name: Gameplay regression
        run: npm run test:gameplay
      - name: Platform regression
        run: npm run test:platform
      - name: Typecheck
        run: npm run typecheck
      - name: Release Contract
        run: npm run release:verify
      - name: Manual dossier
        run: npm run release:evidence:verify
      - name: Production Build
        run: npm run build
      - name: RC readiness fail-closed
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json
      - name: J6B-D exact product scope guard
        shell: bash
        run: |
          git diff --name-only 34168aa3ed192d72ef7100103691dff8cca7e1c9...HEAD | sort > /tmp/files.txt
          printf '%s\n' '.github/workflows/es-13j6bd-pre-pr-cert.yml' 'src/game/dynamicMidSectorEventRuntimeAdoption.ts' 'src/game/runtimeProjectionBundleCache.ts' 'tests/es-13j6bd-dynamic-mid-sector-event-runtime-adoption.test.mjs' 'tests/gameplay/dynamic-mid-sector-event-runtime-adoption.test.ts' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt
          ! grep -q '^src/game/EnergySwarmGame.tsx$' /tmp/files.txt
          ! grep -E '^(android/|package|public/|assets/)' /tmp/files.txt
          grep -q 'applyDynamicMidSectorEventRuntimeAdoption' src/game/runtimeProjectionBundleCache.ts
          grep -q 'CURRENT_WAVE_ONLY' src/game/dynamicMidSectorEventRuntimeAdoption.ts
          grep -q 'DYSON_ECLIPSE' src/game/dynamicMidSectorEventEffectMapping.ts
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Build Android debug APK
        run: npm run android:debug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j6bd-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload RC readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13j6bd-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30
