name: ES-13DOC35 Pre-PR Certification

on:
  push:
    branches:
      - docs/es-13-j7a-closure-j7b-activation

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository smoke tests
        run: npm test

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness evidence
        env:
          ORBI_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --output release-readiness.json

      - name: Exact DOC35 scope and preservation guard
        shell: bash
        run: |
          set -euo pipefail
          base=8a5244e770c360d13b8218599ba3f49bbaa03b46
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | sort)
          expected=(
            .github/workflows/es-13doc35-pre-pr-cert.yml
            docs/ES13_GAMEPLAY_ROADMAP.md
            docs/IMPLEMENTATION_LEDGER.md
            docs/PROJECT_CONTINUITY.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected DOC35 certification scope:\n%s\n' "${actual[*]}"
            exit 1
          fi
          grep -q '8a5244e770c360d13b8218599ba3f49bbaa03b46' docs/PROJECT_CONTINUITY.md
          grep -q 'ES-13J7B' docs/PROJECT_CONTINUITY.md
          grep -q 'ES-13J7A' docs/IMPLEMENTATION_LEDGER.md
          grep -q '### J7B' docs/ES13_GAMEPLAY_ROADMAP.md
          for marker in '#4' '#5' '#202' '#248' '#254' '#283' 'J3C-C' 'J4D+'; do
            grep -q -- "$marker" docs/PROJECT_CONTINUITY.md
          done
          for marker in '## J8 — Additional Game Modes' '## J9 —' '## J10 —' '## J11 —' '## J12 —' '## J13 —' '## J14 —' '## J15 —' 'ES-14'; do
            grep -q -- "$marker" docs/ES13_GAMEPLAY_ROADMAP.md
          done

      - name: Upload RC readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: es-13doc35-rc-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30
