name: ES-13J5E Pre-PR Certification

on:
  push:
    branches:
      - es-13j5e-controlled-live-command-link-detach
    paths:
      - '.github/workflows/es-13j5e-pre-pr-cert.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: b317faa1cb3403fe11baaa71e6c072b8a97a3062
      ORBI_RELEASE_SHA: ${{ github.sha }}
      ORBI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository Smoke
        run: npm run test:repo

      - name: Gameplay
        run: npm run test:gameplay

      - name: Platform
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release Contract
        run: npm run release:verify

      - name: Manual dossier
        run: npm run release:evidence:verify

      - name: Production Build
        run: npm run build

      - name: RC readiness fail-closed
        run: npm run release:readiness -- --output release-readiness.json

      - name: J5E exact product scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" HEAD

          mapfile -t actual < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          expected=(
            ".github/workflows/es-13j5e-pre-pr-cert.yml"
            "src/game/EnergySwarmGame.tsx"
            "src/game/liveCommandLinkBreakApplication.ts"
            "tests/es-13j5e-live-command-link-break-application.test.mjs"
            "tests/gameplay/live-command-link-break-application.test.ts"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)

          [[ "${#actual[@]}" -eq "${#expected_sorted[@]}" ]]
          for i in "${!expected_sorted[@]}"; do
            [[ "${actual[$i]}" == "${expected_sorted[$i]}" ]]
          done

          git diff --quiet "$BASE_SHA" HEAD -- \
            src/game/types.ts \
            src/game/liveEnemyFormationDirector.ts \
            src/game/priorityTargetContract.ts \
            src/game/commandLinkBinding.ts \
            src/game/liveCommandCorePresentation.ts \
            src/game/commandLinkBreakResolution.ts \
            src/game/runtimeTacticalEnemyAdoption.ts \
            src/game/constants.ts \
            android \
            public \
            docs \
            package.json \
            package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: es-13j5e-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

