name: ES-13DOC32 Apply Documentation

on:
  push:
    branches:
      - docs/es-13-j6bb-closure-j6bc-activation
    paths:
      - '.github/workflows/es-13doc32-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/es-13-j6bb-closure-j6bc-activation

      - name: Apply DOC32 exact replacements fail-closed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def dec(value):
              return base64.b64decode(value).decode('utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          def replace_section(text, start, end, new, label):
              if text.count(start) != 1:
                  raise SystemExit(f'{label}: start anchor count={text.count(start)}')
              i = text.index(start)
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f'{label}: end anchor missing')
              return text[:i] + new + text[j:]

          CONT_CURRENT = dec('')
          CONT_RESULT = dec('')
          CONT_NEXT = dec('')
          CONT_HANDOFF = dec('')
          LEDGER_RESULT = dec('')
          LEDGER_NEXT = dec('')
          ROADMAP_J6 = dec('')

          p = Path('docs/PROJECT_CONTINUITY.md')
          text = p.read_text(encoding='utf-8')
          text = replace_section(text, '## Current certified gameplay canonical\n', '\n\nVersion remains', CONT_CURRENT, 'continuity current')
          text = replace_once(text, '\n\n## ES-13 gameplay canonicals', '\n\n' + CONT_RESULT + '\n\n## ES-13 gameplay canonicals', 'continuity J6B-B result')
          text = replace_once(text, '- J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract: `204566693978adabba7e66995c88ae2f85818f8b`.\n', '- J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract: `204566693978adabba7e66995c88ae2f85818f8b`.\n- J6B-B — Pure Deterministic Dynamic Event Identity Selection Contract: `dcd39a173da7635bf85db6844dc86aeca6c1f38c`.\n', 'continuity canonical list')
          text = replace_once(text, '- DOC31 — J6B-A closure & J6B-B deterministic event selection activation: Issue #381, branch `docs/es-13-j6ba-closure-j6bb-activation`, documentation-only closure in progress from gameplay canonical `204566693978adabba7e66995c88ae2f85818f8b`.\n', '- DOC31 — J6B-A closure & J6B-B deterministic event selection activation: `6cadd1db296d5249ae236121088307f480685fe0` — Issue #381 / PR #382.\n- DOC32 — J6B-B closure & J6B-C contract-first effect-mapping activation: Issue #385, branch `docs/es-13-j6bb-closure-j6bc-activation`, documentation-only closure in progress from gameplay canonical `dcd39a173da7635bf85db6844dc86aeca6c1f38c`.\n', 'continuity docs')
          text = replace_section(text, '## Next gameplay phase\n', '\n\nJ4D+ additional tactical families', CONT_NEXT, 'continuity next')
          text = replace_once(text, '`J6B-B Pure Deterministic Dynamic Event Identity Selection Contract → J6B-C+ Certified Effect Mapping/Live Adoption → J7 Bonus Rounds', '`J6B-C Pure Dynamic Event Effect-Mapping Compatibility Contract → J6B-D+ Controlled Live Event Adoption → J7 Bonus Rounds', 'continuity chronology')
          text = replace_section(text, '> Continue ORBI Energy Swarm autonomously.', '\n\n## Update obligation', CONT_HANDOFF, 'continuity handoff')
          p.write_text(text, encoding='utf-8')

          p = Path('docs/IMPLEMENTATION_LEDGER.md')
          text = p.read_text(encoding='utf-8')
          row = '| ES-13J6B-A — Pure Dynamic Mid-Sector Event Identity Vocabulary Contract | DEPLOYED / FROZEN | `204566693978adabba7e66995c88ae2f85818f8b` | #379 | #380 |\n'
          text = replace_once(text, row, row + '| ES-13J6B-B — Pure Deterministic Dynamic Event Identity Selection Contract | DEPLOYED / FROZEN | `dcd39a173da7635bf85db6844dc86aeca6c1f38c` | #383 | #384 |\n', 'ledger row')
          text = replace_once(text, '\n\n## Documentation canonicals', '\n\n' + LEDGER_RESULT + '\n\n## Documentation canonicals', 'ledger result')
          text = replace_once(text, '- DOC31 — J6B-A closure & J6B-B deterministic event selection activation: Issue #381, branch `docs/es-13-j6ba-closure-j6bb-activation`, in progress from gameplay canonical `204566693978adabba7e66995c88ae2f85818f8b`.\n', '- DOC31 — J6B-A closure & J6B-B deterministic event selection activation: `6cadd1db296d5249ae236121088307f480685fe0` — Issue #381 / PR #382.\n- DOC32 — J6B-B closure & J6B-C contract-first effect-mapping activation: Issue #385, branch `docs/es-13-j6bb-closure-j6bc-activation`, in progress from gameplay canonical `dcd39a173da7635bf85db6844dc86aeca6c1f38c`.\n', 'ledger docs')
          text = replace_section(text, '## Next planned gameplay\n', '\n\nJ4D+ additional tactical families', LEDGER_NEXT, 'ledger next')
          text = replace_once(text, '`J6B-B Pure Deterministic Dynamic Event Identity Selection Contract → J6B-C+ Certified Effect Mapping/Live Adoption → J7 Bonus Rounds', '`J6B-C Pure Dynamic Event Effect-Mapping Compatibility Contract → J6B-D+ Controlled Live Event Adoption → J7 Bonus Rounds', 'ledger sequence')
          p.write_text(text, encoding='utf-8')

          p = Path('docs/ES13_GAMEPLAY_ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          text = replace_section(text, '### J6B-B — Pure Deterministic Dynamic Event Identity Selection Contract\n', '\n\n## J7 — Bonus Challenge Rounds', ROADMAP_J6, 'roadmap J6B')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact DOC32 product scope before commit
        shell: bash
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/actual.txt
          printf '%s\n' 'docs/ES13_GAMEPLAY_ROADMAP.md' 'docs/IMPLEMENTATION_LEDGER.md' 'docs/PROJECT_CONTINUITY.md' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          grep -Fq 'dcd39a173da7635bf85db6844dc86aeca6c1f38c' docs/PROJECT_CONTINUITY.md
          grep -Fq 'ES-13J6B-C — Pure Dynamic Event Effect-Mapping Compatibility Contract' docs/IMPLEMENTATION_LEDGER.md
          grep -Fq 'controlled live event adoption remains J6B-D+' docs/ES13_GAMEPLAY_ROADMAP.md
          if git diff --name-only | grep -Eq '^(src/|tests/|package|public/|assets/)'; then exit 1; fi

      - name: Commit and push DOC32 candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_CONTINUITY.md docs/IMPLEMENTATION_LEDGER.md docs/ES13_GAMEPLAY_ROADMAP.md
          git commit -m 'ES-13DOC32: close J6B-B and activate J6B-C discovery'
          git push origin HEAD:docs/es-13-j6bb-closure-j6bc-activation
          echo "DOC32 candidate SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
