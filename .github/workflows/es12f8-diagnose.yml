name: ES-12F8 Smoke Diagnostic

on:
  push:
    branches:
      - feat/es-12f8-unique-energy-attacks

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[diag-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/es-12f8-unique-energy-attacks
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture smoke-test failure
        shell: bash
        run: |
          set +e
          npm test > /tmp/es12f8-test.log 2>&1
          status=$?
          set -e
          {
            echo "exit_status=$status"
            echo "=== FAILURE MATCHES ==="
            grep -nE "not ok|AssertionError|ERR_ASSERTION|failure|failed|error:" /tmp/es12f8-test.log || true
            echo "=== LOG TAIL ==="
            tail -n 220 /tmp/es12f8-test.log
          } > .github/es12f8-test-diagnostic.txt
      - name: Commit diagnostic
        run: |
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add .github/es12f8-test-diagnostic.txt
          git commit -m "chore: capture ES-12F8 smoke failure [diag-done]"
          git push origin HEAD:feat/es-12f8-unique-energy-attacks
