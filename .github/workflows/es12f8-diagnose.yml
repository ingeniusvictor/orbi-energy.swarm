name: ES-12F8 Smoke Diagnostic

on:
  push:
    branches:
      - feat/es-12f8-unique-energy-attacks

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[diag2-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/es-12f8-unique-energy-attacks
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture exact smoke-test failures
        shell: bash
        run: |
          set +e
          npm test > /tmp/es12f8-test.log 2>&1
          status=$?
          set -e
          {
            echo "exit_status=$status"
            echo "=== FAILING TEST SOURCE LOCATIONS ==="
            grep -R -n -F "live thermal splash uses indexed candidates in original enemy order without sqrt" tests || true
            grep -R -n -F "gameplay probability rolls remain raw and semantically unchanged" tests || true
            grep -R -n -F "live direct-hit pushback relocates the indexed target before later projectiles" tests || true
            echo "=== FAILURE 340 CONTEXT ==="
            grep -n -B 18 -A 30 "not ok 340" /tmp/es12f8-test.log || true
            echo "=== FAILURE 384 CONTEXT ==="
            grep -n -B 18 -A 30 "not ok 384" /tmp/es12f8-test.log || true
            echo "=== FAILURE 610 CONTEXT ==="
            grep -n -B 18 -A 30 "not ok 610" /tmp/es12f8-test.log || true
          } > .github/es12f8-test-diagnostic.txt
      - name: Commit diagnostic
        run: |
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add .github/es12f8-test-diagnostic.txt
          git commit -m "chore: capture exact ES-12F8 failures [diag2-done]"
          git push origin HEAD:feat/es-12f8-unique-energy-attacks
