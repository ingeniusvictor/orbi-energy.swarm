name: ES-12I5 First-frame Runtime Certification

on:
  push:
    branches:
      - fix/es-12i5-first-frame-pause-render

permissions:
  contents: write

jobs:
  certify-and-materialize:
    if: ${{ !contains(github.event.head_commit.message, '[i5-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORBI_BUILD_SHA: ${{ github.sha }}
      I5_BASE_SHA: 6cae3eda798cd754a0f47aa7a927fbe59749de30
    steps:
      - name: Checkout I5 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Materialize I5 runtime fix and regression contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          game = Path('src/game/EnergySwarmGame.tsx')
          source = game.read_text()

          old = '''      member.shootCooldown -=
                (delta / 16.6) *
                getEclipseSolarCooldownRecoveryMultiplier(
                  simulationMutatorEffects,
                  member.affinity,
                );'''
          new = '''      member.shootCooldown -=
                (delta / 16.6) *
                getEclipseSolarCooldownRecoveryMultiplier(
                  frameMutatorEffects,
                  member.affinity,
                );'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one TDZ follower cooldown block, found {source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''    setAudioMuted(loaded.audioMuted);
              setMuteState(loaded.audioMuted);'''
          new = '''    setAudioMuted(loaded.audioMuted);
              // Restore persisted mute state without starting Web Audio/BGM before a user gesture.
              // The module defaults to unmuted, so only the persisted muted=true case needs action.
              if (loaded.audioMuted) {
                setMuteState(true);
              }'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one startup mute restore block, found {source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''  const canvasRef = useRef<HTMLCanvasElement | null>(null);
            const loopActiveRef = useRef(false);'''
          new = '''  const canvasRef = useRef<HTMLCanvasElement | null>(null);
            const loopActiveRef = useRef(false);
            const suspendedFrameRenderedRef = useRef(false);'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one loop ref block, found {source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''    if (isPausedRef.current || isUpgradeSelectionOpenRef.current) {
              lastTimeRef.current = timestamp;
              frameHealthRef.current = resetFrameHealthState(
                frameHealthRef.current,
              );
              requestAnimationFrame(gameLoop);
              return;
            }

            let delta = timestamp - lastTimeRef.current;'''
          new = '''    if (isPausedRef.current || isUpgradeSelectionOpenRef.current) {
              lastTimeRef.current = timestamp;
              frameHealthRef.current = resetFrameHealthState(
                frameHealthRef.current,
              );
              // A lifecycle pause can happen before the first active frame. Materialize one
              // battlefield frame once the canvas exists, but never advance simulation state.
              if (!suspendedFrameRenderedRef.current && canvasRef.current) {
                renderCanvasScene();
                suspendedFrameRenderedRef.current = true;
              }
              requestAnimationFrame(gameLoop);
              return;
            }

            suspendedFrameRenderedRef.current = false;
            let delta = timestamp - lastTimeRef.current;'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one paused gameLoop branch, found {source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''    frameHealthRef.current = createFrameHealthState();
            frameHealthRecommendationShownRef.current = null;'''
          new = '''    frameHealthRef.current = createFrameHealthState();
            suspendedFrameRenderedRef.current = false;
            frameHealthRecommendationShownRef.current = null;'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one startGame frame health reset block, found {source.count(old)}')
          source = source.replace(old, new, 1)

          game.write_text(source)

          test = Path('tests/es-12i5-runtime-startup.test.mjs')
          test.write_text(r'''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const source = await readFile(new URL("../src/game/EnergySwarmGame.tsx", import.meta.url), "utf8");

          test("I5 follower cooldown uses initialized frame mutator projection", () => {
            const frameDeclaration = source.indexOf("const frameMutatorEffects =");
            const followerUse = source.indexOf("getEclipseSolarCooldownRecoveryMultiplier(\n          frameMutatorEffects,\n          member.affinity,");
            const simulationDeclaration = source.indexOf("const simulationMutatorEffects =");

            assert.ok(frameDeclaration >= 0, "frame mutator projection must exist");
            assert.ok(followerUse > frameDeclaration, "follower cooldown must use the already initialized frame projection");
            assert.ok(simulationDeclaration > followerUse, "later simulation projection may remain for post-follower runtime work");
            assert.doesNotMatch(
              source,
              /getEclipseSolarCooldownRecoveryMultiplier\(\s*simulationMutatorEffects,\s*member\.affinity,/,
              "follower cooldown must never read the later simulationMutatorEffects binding",
            );
          });

          test("I5 persisted unmuted profile does not autoplay BGM on mount", () => {
            assert.doesNotMatch(
              source,
              /setAudioMuted\(loaded\.audioMuted\);\s*setMuteState\(loaded\.audioMuted\);/,
            );
            assert.match(
              source,
              /setAudioMuted\(loaded\.audioMuted\);[\s\S]*?if \(loaded\.audioMuted\) \{\s*setMuteState\(true\);\s*\}/,
            );
          });

          test("I5 suspended loop materializes at most one frame without advancing simulation", () => {
            assert.match(source, /const suspendedFrameRenderedRef = useRef\(false\);/);
            const pausedStart = source.indexOf("if (isPausedRef.current || isUpgradeSelectionOpenRef.current)");
            const activeStart = source.indexOf("suspendedFrameRenderedRef.current = false;", pausedStart);
            assert.ok(pausedStart >= 0 && activeStart > pausedStart);
            const pausedBlock = source.slice(pausedStart, activeStart);
            assert.match(pausedBlock, /!suspendedFrameRenderedRef\.current && canvasRef\.current/);
            assert.match(pausedBlock, /renderCanvasScene\(\);/);
            assert.match(pausedBlock, /suspendedFrameRenderedRef\.current = true;/);
            assert.doesNotMatch(pausedBlock, /updateEnginePhysics\(/);
            assert.doesNotMatch(pausedBlock, /timeElapsedRef\.current \+=/);
          });
          ''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Repository smoke
        run: npm run test:repo

      - name: Gameplay regression
        run: npm run test:gameplay

      - name: Platform regression
        run: npm run test:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Release contract
        run: npm run release:verify

      - name: Manual certification dossier
        run: npm run release:evidence:verify

      - name: Production build
        run: npm run build

      - name: RC readiness remains blocked
        run: npm run release:readiness

      - name: Android debug regression
        run: npm run android:debug

      - name: Verify Android APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: I5 scope guard
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only "$I5_BASE_SHA" -- | sort)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/es-12i5-certify.yml|src/game/EnergySwarmGame.tsx|tests/es-12i5-runtime-startup.test.mjs) ;;
              *) echo "Unexpected I5 scope: $path" >&2; exit 1 ;;
            esac
          done

      - name: Commit certified I5 materialization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/EnergySwarmGame.tsx tests/es-12i5-runtime-startup.test.mjs
          git commit -m 'fix(i5): restore first-frame runtime startup [i5-materialized]'
          git push origin HEAD:${GITHUB_REF_NAME}
